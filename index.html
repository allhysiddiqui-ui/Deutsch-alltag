as kann er gut.","en":"Yes, he can do that well.","ur":"Ji haan, woh yeh acha kar leta hai."},{"s":"A","de":"Sehr schön. Jetzt kommt die Impfung.","en":"Very nice. Now comes the vaccination.","ur":"Bohat khoob. Ab teeka lagega."},{"s":"B","de":"Tut das weh?","en":"Does that hurt?","ur":"Kya is se dard hoga?"},{"s":"A","de":"Nur ganz kurz. Wie ein kleiner Piks.","en":"Only very briefly. Like a small prick.","ur":"Sirf thori dair. Ek chhoti si chubhan jaisa."},{"s":"B","de":"Yusuf, halt bitte den Arm still.","en":"Yusuf, please keep your arm still.","ur":"Yusuf, baazu ko sakit rakho."},{"s":"A","de":"Fertig! Du warst sehr tapfer.","en":"Done! You were very brave.","ur":"Ho gaya! Tum bohat bahadur ho."},{"s":"B","de":"Braucht er heute noch etwas?","en":"Does he need anything else today?","ur":"Kya aaj usay aur kuch chahiye?"},{"s":"A","de":"Nein. Der nächste Termin ist in zwei Jahren.","en":"No. The next appointment is in two years.","ur":"Nahi. Agla appointment do saal baad hai."},{"s":"B","de":"Vielen Dank, Herr Doktor.","en":"Thank you very much, doctor.","ur":"Bohat shukriya, doctor sahab."}]},"A2":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Khan. Haben Sie den Impfpass und das Untersuchungsheft dabei?","en":"Hello, Mrs Khan. Do you have the vaccination record and the check-up booklet with you?","ur":"Salam, Frau Khan. Kya teeka card aur check-up copy saath hai?"},{"s":"B","de":"Ja, beides. Hier bitte.","en":"Yes, both. Here you are.","ur":"Ji haan, dono. Yeh lijiye."},{"s":"A","de":"Danke. Bei der U8 prüfen wir Sehen, Hören, Sprache und Bewegung.","en":"Thank you. At the U8 we check vision, hearing, speech and movement.","ur":"Shukriya. U8 mein hum nazar, sunna, bolna aur harkat dekhte hain."},{"s":"B","de":"Beim Sehen bin ich nicht sicher. Er sitzt sehr nah vor dem Fernseher.","en":"About the vision I'm not sure. He sits very close to the television.","ur":"Nazar ke baare mein mujhe yaqeen nahi. Woh TV ke bohat qareeb baithta hai."},{"s":"A","de":"Gut, dass Sie das sagen. Wir machen gleich einen Sehtest.","en":"Good that you say that. We'll do an eye test right away.","ur":"Acha hua aap ne bataya. Hum abhi nazar ka test karte hain."},{"s":"B","de":"Und wenn er die Bilder nicht erkennt?","en":"And if he doesn't recognise the pictures?","ur":"Aur agar woh tasveerein na pehchane?"},{"s":"A","de":"Dann schicke ich Sie zum Augenarzt. Das ist in diesem Alter ganz normal.","en":"Then I'll send you to the eye doctor. That is completely normal at this age.","ur":"To main aap ko aankhon ke doctor ke paas bhej doonga. Is umar mein yeh aam hai."},{"s":"B","de":"Verstanden. Und die Sprache? Er mischt Deutsch und Urdu.","en":"Understood. And speech? He mixes German and Urdu.","ur":"Samajh gayi. Aur bolna? Woh German aur Urdu mila deta hai."},{"s":"A","de":"Das ist kein Problem, sondern ein Vorteil. Zweisprachige Kinder machen das fast alle.","en":"That is not a problem but an advantage. Almost all bilingual children do that.","ur":"Yeh masla nahi balke faida hai. Do zabanon wale bachay tqreeban sab yehi karte hain."},{"s":"B","de":"Das beruhigt mich. In der Kita hat man mir gesagt, ich soll zu Hause nur Deutsch sprechen.","en":"That reassures me. At daycare I was told I should only speak German at home.","ur":"Is se tasalli hui. Kita mein mujhe kaha gaya ke ghar par sirf German bolein."},{"s":"A","de":"Das ist ein alter Rat und er stimmt nicht. Sprechen Sie zu Hause die Sprache, die Sie am besten können.","en":"That is old advice and it isn't correct. At home speak the language you know best.","ur":"Yeh purani baat hai aur theek nahi. Ghar par wohi zaban bolein jo aap sab se behtar jaanti hain."},{"s":"B","de":"Das mache ich gern. Und heute steht auch eine Impfung an, oder?","en":"I'll gladly do that. And there is also a vaccination due today, right?","ur":"Yeh main khushi se karoongi. Aur aaj teeka bhi hai, na?"},{"s":"A","de":"Genau, die Auffrischung gegen Masern, Mumps und Röteln.","en":"Exactly, the booster against measles, mumps and rubella.","ur":"Bilkul, khasra, kanpere aur rubella ka booster."},{"s":"B","de":"Kann er danach Fieber bekommen?","en":"Can he get a fever afterwards?","ur":"Kya us ke baad bukhar ho sakta hai?"},{"s":"A","de":"Manche Kinder bekommen nach einer Woche leichtes Fieber. Das ist normal und geht von allein weg.","en":"Some children get a slight fever after a week. That is normal and goes away by itself.","ur":"Kuch bachon ko ek hafte baad halka bukhar hota hai. Yeh normal hai aur khud theek ho jata hai."},{"s":"B","de":"Soll ich ihm dann Fiebersaft geben?","en":"Should I give him fever syrup then?","ur":"To kya main usay bukhar ka syrup doon?"},{"s":"A","de":"Nur wenn er sich unwohl fühlt. Nicht vorbeugend.","en":"Only if he feels unwell. Not as a precaution.","ur":"Sirf agar usay takleef ho. Pehle se nahi."},{"s":"B","de":"Alles klar. Dann machen wir das so.","en":"All right. Then we'll do it that way.","ur":"Theek hai. To hum aisa hi karte hain."}]},"B1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Heute wäre die zweite Masernimpfung dran. Haben Sie dazu noch Fragen?","en":"Today the second measles vaccination would be due. Do you have any questions about it?","ur":"Aaj khasre ka doosra teeka hai. Kya is baare mein koi sawal hai?"},{"s":"B","de":"Ehrlich gesagt bin ich unsicher. In einer Gruppe im Internet steht, dass die Impfung zu früh kommt.","en":"To be honest I'm unsure. In a group on the internet it says the vaccination comes too early.","ur":"Sach kahoon to mujhe shak hai. Internet ke ek group mein likha hai ke teeka bohat jaldi lagta hai."},{"s":"A","de":"Ich verstehe die Verunsicherung. Wichtig ist, woher die Information kommt und ob sie überprüfbar ist.","en":"I understand the uncertainty. What matters is where the information comes from and whether it can be checked.","ur":"Main pareshani samajhta hoon. Ahem yeh hai ke maloomat kahan se aayi aur kya us ki tasdeeq ho sakti hai."},{"s":"B","de":"Woran erkenne ich denn, ob eine Quelle seriös ist?","en":"How do I recognise whether a source is reliable?","ur":"Mujhe kaise pata chale ke maloomat qabil-e-aitbaar hai?"},{"s":"A","de":"Seriöse Stellen nennen ihre Daten und ihre Zweifel. Wer nur Angst macht und nichts belegt, will meist etwas verkaufen.","en":"Reliable sources name their data and their doubts. Whoever only creates fear and proves nothing usually wants to sell something.","ur":"Qabil-e-aitbaar log apna data aur apne shukook batate hain. Jo sirf darata hai aur saboot nahi deta woh aksar kuch bechna chahta hai."},{"s":"B","de":"Das leuchtet mir ein. Trotzdem: Was passiert im schlimmsten Fall nach der Impfung?","en":"That makes sense to me. Still: what happens in the worst case after the vaccination?","ur":"Yeh baat samajh aati hai. Phir bhi: teeke ke baad bad tareen soorat mein kya hota hai?"},{"s":"A","de":"Bei etwa fünf von hundert Kindern kommt es zu Fieber und einem leichten Ausschlag, meist in der zweiten Woche.","en":"In about five out of a hundred children fever and a mild rash occur, usually in the second week.","ur":"Taqreeban har sau mein se paanch bachon ko bukhar aur halke dane hote hain, aksar doosre hafte."},{"s":"B","de":"Und wirklich schwere Reaktionen?","en":"And really severe reactions?","ur":"Aur waqai sangeen rad-e-amal?"},{"s":"A","de":"Die sind sehr selten, in der Größenordnung von eins zu einer Million. Eine echte Masernerkrankung ist um ein Vielfaches gefährlicher.","en":"Those are very rare, in the order of one in a million. An actual measles infection is many times more dangerous.","ur":"Woh bohat kam hain, das lakh mein ek jitna. Asli khasra kai guna zyada khatarnak hai."},{"s":"B","de":"Wie gefährlich ist Masern denn heute noch? Man hört ja kaum davon.","en":"How dangerous are measles nowadays? You hardly hear about them.","ur":"Aaj kal khasra kitna khatarnak hai? Sunne mein bohat kam aata hai."},{"s":"A","de":"Genau deshalb hört man wenig davon: weil fast alle geimpft sind. Sobald die Impfquote sinkt, kommen die Ausbrüche zurück.","en":"That is exactly why you hear little about it: because almost everyone is vaccinated. As soon as the vaccination rate falls, the outbreaks come back.","ur":"Isi liye kam sunte hain: kyunke taqreeban sab ko teeka laga hai. Jaise hi teeke kam hon, beemari wapis aa jati hai."},{"s":"B","de":"Das habe ich so noch nie gehört. Es gibt in Deutschland doch auch eine Pflicht, oder?","en":"I've never heard it put that way. There is also an obligation in Germany, isn't there?","ur":"Main ne yeh is tarah kabhi nahi suna. Germany mein is ki pabandi bhi hai, na?"},{"s":"A","de":"Für Masern ja. Kinder in der Kita müssen den Schutz nachweisen. Ohne Nachweis kann die Einrichtung Ihr Kind ablehnen.","en":"For measles yes. Children at daycare have to prove protection. Without proof the facility can turn your child away.","ur":"Khasre ke liye haan. Kita ke bachon ko saboot dena hota hai. Baghair saboot ke idara bache ko mana kar sakta hai."},{"s":"B","de":"Das wusste ich nicht. Dann machen wir die Impfung heute.","en":"I didn't know that. Then let's do the vaccination today.","ur":"Yeh mujhe nahi pata tha. To hum aaj teeka laga dete hain."},{"s":"A","de":"Ich lege Ihnen trotzdem den Aufklärungsbogen vor. Lesen Sie ihn in Ruhe, ich habe Zeit.","en":"I'll still give you the information sheet. Read it calmly, I have time.","ur":"Phir bhi main aap ko maloomati form deta hoon. Itminan se parhein, mere paas waqt hai."},{"s":"B","de":"Danke, dass Sie mich nicht gedrängt haben.","en":"Thank you for not pushing me.","ur":"Shukriya ke aap ne dabao nahi dala."},{"s":"A","de":"Eine Entscheidung, die man versteht, hält länger als eine, zu der man überredet wurde.","en":"A decision you understand lasts longer than one you were talked into.","ur":"Jo faisla samajh kar kiya jaye woh us se behtar hai jo baaton mein aa kar kiya jaye."},{"s":"B","de":"Da haben Sie recht. Ich unterschreibe.","en":"You're right there. I'll sign.","ur":"Aap theek kehte hain. Main dastakhat karti hoon."}]},"B2":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Bevor wir impfen, muss ich Sie formal aufklären. Das ist keine Formalität, sondern Ihre Grundlage für die Einwilligung.","en":"Before we vaccinate I have to inform you formally. That is not a formality but the basis for your consent.","ur":"Teeke se pehle mujhe aap ko baqaida maloomat deni hain. Yeh sirf rasm nahi balke aap ki ijazat ki bunyaad hai."},{"s":"B","de":"Gut. Mich interessiert vor allem, wie Sie den Nutzen gegen das Risiko abwägen.","en":"Good. What interests me above all is how you weigh the benefit against the risk.","ur":"Acha. Mujhe sab se zyada yeh jan-na hai ke aap faide aur nuqsan ka moazna kaise karte hain."},{"s":"A","de":"Nüchtern gesagt: Der Nutzen ist gut belegt, die Risiken sind quantifiziert und beide stehen in keinem Verhältnis zueinander.","en":"Put soberly: the benefit is well documented, the risks are quantified, and the two are in no proportion to each other.","ur":"Saaf kahoon: faida saabit shuda hai, khatrat ginay ja chuke hain, aur dono ka koi moazna hi nahi banta."},{"s":"B","de":"Können Sie das an Zahlen festmachen? Ich arbeite selbst mit Statistik und Prozentangaben helfen mir mehr als Beruhigung.","en":"Can you pin that down in numbers? I work with statistics myself, and percentages help me more than reassurance.","ur":"Kya aap yeh numbers mein bata sakte hain? Main khud statistics mein kaam karti hoon, mujhe percentage tasalli se zyada madad deti hai."},{"s":"A","de":"Sehr gern. Bei Masern erkrankt eines von tausend Kindern an einer Gehirnentzündung, und ein Teil davon behält bleibende Schäden.","en":"Gladly. With measles, one in a thousand children develops encephalitis, and some of them retain permanent damage.","ur":"Zaroor. Khasre mein har hazaar mein se ek bache ko dimagh ki sozish hoti hai, aur un mein se kuch ko mustaqil nuqsan reh jata hai."},{"s":"B","de":"Und auf der anderen Seite?","en":"And on the other side?","ur":"Aur doosri taraf?"},{"s":"A","de":"Auf der Impfseite reden wir bei den schweren Ereignissen über einen Fall pro einer Million Dosen. Der Faktor liegt also bei etwa tausend.","en":"On the vaccine side, for severe events we are talking about one case per million doses. So the factor is around a thousand.","ur":"Teeke ki taraf sangeen waqiat das lakh khurakon mein ek hote hain. Yani farq taqreeban ek hazaar guna hai."},{"s":"B","de":"Das ist deutlich. Wie sicher sind diese Zahlen, gerade bei seltenen Ereignissen?","en":"That is clear. How reliable are these numbers, especially for rare events?","ur":"Yeh saaf hai. Yeh numbers kitne pukhta hain, khaas kar kam hone wale waqiat mein?"},{"s":"A","de":"Bei seltenen Ereignissen wird die Unsicherheit naturgemäß größer, deshalb werden Verdachtsfälle bundesweit erfasst und veröffentlicht.","en":"With rare events the uncertainty naturally becomes larger, which is why suspected cases are recorded and published nationwide.","ur":"Kam hone wale waqiat mein ghair yaqeeni surat qudrati tor par barh jati hai, isi liye shubah wale case poore mulk mein darj aur shaya kiye jate hain."},{"s":"B","de":"Das heißt, es gibt eine Stelle, an die Sie melden müssten, wenn bei Yusuf etwas auffällt?","en":"That means there is an office you would have to report to if something unusual happened with Yusuf?","ur":"Yani ek idara hai jise aap ko ittila deni hogi agar Yusuf mein kuch ghair mamooli ho?"},{"s":"A","de":"Genau, und ich würde es auch tun. Das gehört zum System dazu, sonst wären die Zahlen wertlos.","en":"Exactly, and I would do it too. That is part of the system, otherwise the numbers would be worthless.","ur":"Bilkul, aur main aisa karoonga bhi. Yeh nizam ka hissa hai, warna numbers bekaar hote."},{"s":"B","de":"Eine letzte Frage: Yusuf hatte vor drei Tagen leichten Schnupfen. Spricht das gegen den Termin heute?","en":"One last question: Yusuf had a slight runny nose three days ago. Does that speak against today's appointment?","ur":"Aakhri sawal: Yusuf ko teen din pehle halka zukam tha. Kya is wajah se aaj ka waqt theek nahi?"},{"s":"A","de":"Ein banaler Infekt ohne Fieber ist kein Hinderungsgrund. Wir verschieben nur bei akuten, fieberhaften Erkrankungen.","en":"A trivial infection without fever is no reason to postpone. We only postpone with acute, feverish illnesses.","ur":"Halka infection baghair bukhar ke rukawat nahi. Hum sirf tez bukhar wali beemari mein taal dete hain."},{"s":"B","de":"Dann ist alles geklärt. Ich unterschreibe die Einwilligung.","en":"Then everything is clarified. I'll sign the consent.","ur":"To sab baat saaf ho gayi. Main ijazat par dastakhat karti hoon."},{"s":"A","de":"Danke für das offene Gespräch. Ehrlich gesagt sind mir kritische Eltern lieber als gleichgültige.","en":"Thank you for the open conversation. To be honest I prefer critical parents to indifferent ones.","ur":"Khuli guftagu ka shukriya. Sach kahoon to mujhe sawal karne wale walidain la-taalluq walidain se behtar lagte hain."},{"s":"B","de":"Das höre ich zum ersten Mal von einem Arzt.","en":"That's the first time I've heard that from a doctor.","ur":"Yeh main ne kisi doctor se pehli baar suna hai."},{"s":"A","de":"Dann haben Sie bisher die falschen Ärzte getroffen. So, Yusuf, jetzt der Arm — es zwickt einmal kurz.","en":"Then you have met the wrong doctors so far. Right, Yusuf, now the arm — it will pinch once, briefly.","ur":"To ab tak aap ghalat doctors se mile hain. Acha Yusuf, ab baazu — ek dafa halki si chubhan hogi."},{"s":"B","de":"Er hat gar nicht geweint. Das hätte ich nicht gedacht.","en":"He didn't cry at all. I wouldn't have thought that.","ur":"Woh bilkul nahi roya. Main ne yeh socha bhi nahi tha."}]}},"roleplay":{"easy":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Yusuf hat heute die U8 und bekommt eine Impfung.","en":"Yusuf has his U8 check-up today and gets a vaccination.","ur":"Aaj Yusuf ka U8 check-up hai aur teeka bhi lagega."},"start":"n1","nodes":{"n1":{"say":"Guten Tag. Heute ist die U8. Wie geht es Yusuf?","goal":{"en":"Say he is well / healthy.","ur":"Kahein ke woh theek aur sehatmand hai."},"options":["Gut. Er ist gesund.","Es geht ihm gut. Er ist gesund."],"fallback":"Wie geht es ihm denn?","accept":[{"kw":["gut","gesund"],"next":"n2"},{"kw":["gesund"],"next":"n2"},{"kw":["gut"],"next":"n2"}]},"n2":{"say":"Zuerst messen wir Größe und Gewicht. Er ist einen Meter groß und wiegt siebzehn Kilo.","goal":{"en":"Ask whether that is normal.","ur":"Poochein ke kya yeh normal hai."},"options":["Ist das normal?","Ist das normal für sein Alter?"],"fallback":"Haben Sie eine Frage dazu?","accept":[{"kw":["normal"],"next":"n3"}]},"n3":{"say":"Ja, das ist sehr gut. Jetzt kommt die Impfung.","goal":{"en":"Ask whether it hurts.","ur":"Poochein ke kya is se dard hoga."},"options":["Tut das weh?","Tut die Impfung weh?"],"fallback":"Möchten Sie etwas fragen?","accept":[{"kw":["weh"],"next":"n4"},{"kw":["tut"],"next":"n4"}]},"n4":{"say":"Nur ganz kurz, wie ein kleiner Piks. — Fertig! Er war sehr tapfer.","goal":{"en":"Ask whether he needs anything else today.","ur":"Poochein ke kya aaj usay aur kuch chahiye."},"options":["Braucht er heute noch etwas?","Müssen wir heute noch etwas machen?"],"fallback":"Noch eine Frage?","accept":[{"kw":["braucht","etwas"],"next":"n5"},{"kw":["etwas"],"next":"n5"}]},"n5":{"say":"Nein. Der nächste Termin ist in zwei Jahren.","goal":{"en":"Thank the doctor and say goodbye.","ur":"Doctor ka shukriya karein aur khuda hafiz kahein."},"options":["Vielen Dank, Herr Doktor. Auf Wiedersehen.","Danke schön. Auf Wiedersehen."],"fallback":"Alles klar so weit?","accept":[{"kw":["danke","wiedersehen"],"reply":"Auf Wiedersehen, Frau Khan. Bis zum nächsten Mal!","next":"END"},{"kw":["danke"],"reply":"Auf Wiedersehen, Frau Khan!","next":"END"}]}}},"hard":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Die zweite Masernimpfung steht an. Sie sind unsicher und möchten Fragen stellen.","en":"The second measles vaccination is due. You are unsure and want to ask questions.","ur":"Khasre ka doosra teeka hai. Aap ko shak hai aur aap sawal poochna chahti hain."},"start":"n1","nodes":{"n1":{"say":"Heute wäre die zweite Masernimpfung dran. Haben Sie dazu noch Fragen?","goal":{"en":"Say honestly that you are unsure, because you read something on the internet.","ur":"Sach batayein ke aap ko shak hai kyunke aap ne internet par kuch parha."},"options":["Ehrlich gesagt bin ich unsicher. Im Internet steht etwas anderes.","Ich bin unsicher. Im Internet habe ich etwas anderes gelesen."],"fallback":"Gibt es etwas, das Sie beschäftigt?","accept":[{"kw":["unsicher","internet"],"next":"n2"},{"kw":["unsicher"],"next":"n2"},{"kw":["internet"],"next":"n2"}]},"n2":{"say":"Ich verstehe die Verunsicherung. Wichtig ist, woher die Information kommt und ob sie überprüfbar ist.","goal":{"en":"Ask how you can recognise whether a source is reliable.","ur":"Poochein ke qabil-e-aitbaar maloomat kaise pehchanein."},"options":["Woran erkenne ich, ob eine Quelle seriös ist?","Wie erkenne ich eine seriöse Quelle?"],"fallback":"Was genau möchten Sie wissen?","accept":[{"kw":["quelle","seriös"],"next":"n3"},{"kw":["erkenne"],"next":"n3"},{"kw":["quelle"],"next":"n3"}]},"n3":{"say":"Seriöse Stellen nennen ihre Daten und ihre Zweifel. Wer nur Angst macht und nichts belegt, will meist etwas verkaufen.","goal":{"en":"Ask what happens in the worst case after the vaccination.","ur":"Poochein ke teeke ke baad bad tareen soorat mein kya hota hai."},"options":["Was passiert im schlimmsten Fall nach der Impfung?","Was kann im schlimmsten Fall passieren?"],"fallback":"Möchten Sie über die Risiken sprechen?","accept":[{"kw":["schlimmsten","fall"],"next":"n4"},{"kw":["passiert"],"next":"n4"},{"kw":["risiko"],"next":"n4"}]},"n4":{"say":"Bei etwa fünf von hundert Kindern kommt es zu Fieber und einem leichten Ausschlag. Schwere Reaktionen liegen bei eins zu einer Million.","goal":{"en":"Ask how dangerous measles actually still is today.","ur":"Poochein ke khasra aaj kal waqai kitna khatarnak hai."},"options":["Wie gefährlich ist Masern denn heute noch?","Wie gefährlich sind Masern heute?"],"fallback":"Haben Sie noch eine Frage?","accept":[{"kw":["gefährlich","masern"],"next":"n5"},{"kw":["gefährlich"],"next":"n5"},{"kw":["masern"],"next":"n5"}]},"n5":{"say":"Genau deshalb hört man wenig davon: weil fast alle geimpft sind. Sobald die Impfquote sinkt, kommen die Ausbrüche zurück.","goal":{"en":"Ask whether there is an obligation in Germany.","ur":"Poochein ke kya Germany mein is ki pabandi hai."},"options":["Gibt es in Deutschland eine Pflicht?","Es gibt doch auch eine Pflicht, oder?"],"fallback":"Noch etwas unklar?","accept":[{"kw":["pflicht"],"next":"n6"},{"kw":["deutschland"],"next":"n6"}]},"n6":{"say":"Für Masern ja. Kinder in der Kita müssen den Schutz nachweisen. Ohne Nachweis kann die Einrichtung Ihr Kind ablehnen.","goal":{"en":"Say you didn't know that and that you'll do the vaccination today.","ur":"Kahein ke aap ko yeh nahi pata tha aur aaj teeka laga lenge."},"options":["Das wusste ich nicht. Dann machen wir die Impfung heute.","Das wusste ich nicht. Wir machen es heute."],"fallback":"Wie möchten Sie entscheiden?","accept":[{"kw":["impfung","heute"],"reply":"Ich lege Ihnen trotzdem den Aufklärungsbogen vor. Lesen Sie ihn in Ruhe.","next":"END"},{"kw":["heute"],"reply":"Gut. Lesen Sie bitte noch den Aufklärungsbogen in Ruhe.","next":"END"}]}}}}},{"id":"rezept","order":5,"icon":"💊","title":{"de":"Rezept und Apotheke","en":"Prescription and pharmacy","ur":"Nuskha aur pharmacy"},"angle":"Dosage, buying the medicine, questions at the pharmacy · Khurak, dawa lena, pharmacy ke sawal","words":["rezept","apotheke","löffel","packung","beipackzettel","kühlschrank","zäpfchen","einnehmen","wechselwirkung","kostenlos"],"dialogues":{"A1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Ich schreibe Ihnen ein Rezept.","en":"I'll write you a prescription.","ur":"Main aap ko nuskha likh deta hoon."},{"s":"B","de":"Was ist das für eine Medizin?","en":"What kind of medicine is that?","ur":"Yeh kaunsi dawa hai?"},{"s":"A","de":"Ein Saft gegen die Schmerzen.","en":"A syrup for the pain.","ur":"Dard ke liye ek syrup."},{"s":"B","de":"Wie oft soll er den Saft nehmen?","en":"How often should he take the syrup?","ur":"Usay syrup kitni baar leni hai?"},{"s":"A","de":"Dreimal am Tag, nach dem Essen.","en":"Three times a day, after meals.","ur":"Din mein teen baar, khane ke baad."},{"s":"B","de":"Wie viel jedes Mal?","en":"How much each time?","ur":"Har baar kitni?"},{"s":"A","de":"Fünf Milliliter. Der Löffel ist in der Packung.","en":"Five millilitres. The spoon is in the packet.","ur":"Paanch millilitre. Chamach dabbe mein hai."},{"s":"B","de":"Und wie lange?","en":"And for how long?","ur":"Aur kitne din?"},{"s":"A","de":"Fünf Tage lang.","en":"For five days.","ur":"Paanch din tak."},{"s":"B","de":"Wo kann ich das kaufen?","en":"Where can I buy that?","ur":"Main yeh kahan se le sakti hoon?"},{"s":"A","de":"In der Apotheke. Sie ist gleich neben der Praxis.","en":"At the pharmacy. It is right next to the practice.","ur":"Pharmacy se. Woh clinic ke bilkul saath hai."},{"s":"B","de":"Muss ich etwas bezahlen?","en":"Do I have to pay anything?","ur":"Kya mujhe kuch paise dene hain?"},{"s":"A","de":"Für Kinder ist das Medikament kostenlos.","en":"For children the medication is free.","ur":"Bachon ke liye dawa muft hai."},{"s":"B","de":"Das ist gut. Vielen Dank.","en":"That's good. Thank you very much.","ur":"Yeh acha hai. Bohat shukriya."},{"s":"A","de":"Gute Besserung, Yusuf!","en":"Get well soon, Yusuf!","ur":"Yusuf, jald theek ho jao!"},{"s":"B","de":"Auf Wiedersehen, Herr Doktor.","en":"Goodbye, doctor.","ur":"Khuda hafiz, doctor sahab."}]},"A2":{"speakers":{"A":"Apothekerin","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"B","de":"Guten Tag. Ich habe ein Rezept für meine Tochter.","en":"Hello. I have a prescription for my daughter.","ur":"Salam. Mere paas apni beti ka nuskha hai."},{"s":"A","de":"Guten Tag. Geben Sie es mir bitte. — Ah, ein Antibiotikum. Wie alt ist Ihre Tochter?","en":"Hello. Please give it to me. — Ah, an antibiotic. How old is your daughter?","ur":"Salam. Meherbani kar ke dijiye. — Acha, antibiotic. Aap ki beti kitne saal ki hai?"},{"s":"B","de":"Sie ist fünf.","en":"She is five.","ur":"Woh paanch saal ki hai."},{"s":"A","de":"Gut. Ich muss den Saft anmischen, das dauert zwei Minuten.","en":"Good. I have to mix the syrup, that takes two minutes.","ur":"Acha. Mujhe syrup banana hoga, do minute lagenge."},{"s":"B","de":"Kein Problem, ich warte.","en":"No problem, I'll wait.","ur":"Koi masla nahi, main intezaar karti hoon."},{"s":"A","de":"So, bitte schön. Wichtig: Die Flasche vor jeder Gabe gut schütteln.","en":"There you go. Important: shake the bottle well before every dose.","ur":"Yeh lijiye. Ahem baat: har khurak se pehle bottle achi tarah hilayein."},{"s":"B","de":"Wie oft muss sie den Saft nehmen?","en":"How often does she have to take the syrup?","ur":"Usay syrup kitni baar leni hai?"},{"s":"A","de":"Zweimal täglich, morgens und abends, jeweils fünf Milliliter.","en":"Twice daily, morning and evening, five millilitres each time.","ur":"Rozana do baar, subh aur sham, har baar paanch millilitre."},{"s":"B","de":"Muss ich den Saft in den Kühlschrank stellen?","en":"Do I have to put the syrup in the fridge?","ur":"Kya syrup fridge mein rakhni hogi?"},{"s":"A","de":"Ja, bei diesem Antibiotikum schon. Und nach zehn Tagen bitte wegwerfen, auch wenn noch etwas übrig ist.","en":"Yes, with this antibiotic you do. And after ten days please throw it away, even if some is left.","ur":"Ji haan, is antibiotic ke liye zaroori hai. Aur das din baad phenk dein, chahe kuch bacha ho."},{"s":"B","de":"Und wenn ich eine Gabe vergesse?","en":"And if I forget a dose?","ur":"Aur agar main koi khurak bhool jaoon?"},{"s":"A","de":"Dann geben Sie sie, sobald es Ihnen einfällt. Aber nie zwei Gaben auf einmal.","en":"Then give it as soon as you remember. But never two doses at once.","ur":"To jaise hi yaad aaye de dein. Lekin do khuraken ek saath kabhi nahi."},{"s":"B","de":"Verstanden. Sie hat auch etwas Fieber. Darf sie zusätzlich Fiebersaft bekommen?","en":"Understood. She also has a bit of a fever. Can she have fever syrup in addition?","ur":"Samajh gayi. Usay thora bukhar bhi hai. Kya sath mein bukhar ka syrup de sakti hoon?"},{"s":"A","de":"Ja, das passt zusammen. Achten Sie nur auf den Abstand von vier Stunden.","en":"Yes, that goes together. Just watch the four-hour gap.","ur":"Ji haan, yeh saath chalta hai. Bas chaar ghante ka waqfa rakhein."},{"s":"B","de":"Kostet das etwas?","en":"Does that cost anything?","ur":"Kya is ke paise lagenge?"},{"s":"A","de":"Das Antibiotikum ist auf Rezept, also frei. Den Fiebersaft müssen Sie selbst zahlen, er kostet vier Euro achtzig.","en":"The antibiotic is on prescription, so free. You have to pay for the fever syrup yourself, it costs four euros eighty.","ur":"Antibiotic nuskhe par hai, is liye muft. Bukhar ka syrup khud lena hoga, woh chaar euro assi cent ka hai."},{"s":"B","de":"Das nehme ich mit. Vielen Dank für die Erklärung.","en":"I'll take that too. Thank you very much for the explanation.","ur":"Woh bhi le loongi. Wazahat ka bohat shukriya."}]},"B1":{"speakers":{"A":"Apotheker","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"B","de":"Guten Tag. Ich hätte gern das hier, und ich habe ein paar Fragen dazu.","en":"Hello. I'd like this, and I have a few questions about it.","ur":"Salam. Mujhe yeh chahiye, aur is baare mein kuch sawal hain."},{"s":"A","de":"Fragen Sie ruhig. Dafür stehe ich hier.","en":"Go ahead and ask. That's what I'm here for.","ur":"Zaroor poochein. Main isi liye yahan hoon."},{"s":"B","de":"Im Beipackzettel steht eine ganze Liste von Nebenwirkungen. Muss ich mir Sorgen machen?","en":"The package insert lists a whole range of side effects. Do I need to worry?","ur":"Dawa ke parche par side effects ki poori list hai. Kya mujhe fikar karni chahiye?"},{"s":"A","de":"Auf dem Zettel steht alles, was jemals gemeldet wurde, auch wenn es nur einmal vorkam. Häufig sind bei diesem Mittel eigentlich nur weicher Stuhl und Bauchgrummeln.","en":"The leaflet lists everything that has ever been reported, even if it happened only once. With this medicine only loose stools and a rumbling tummy are actually common.","ur":"Us parche par woh sab likha hota hai jo kabhi bhi report hua, chahe ek hi baar. Is dawa ke saath asal mein sirf narm pakhana aur pait mein gurgurahat aam hai."},{"s":"B","de":"Das klingt harmloser, als ich befürchtet hatte. Und wenn sie doch Durchfall bekommt?","en":"That sounds more harmless than I feared. And if she does get diarrhoea?","ur":"Yeh us se kam khatarnak lagta hai jitna main dar rahi thi. Aur agar phir bhi dast lag jayein?"},{"s":"A","de":"Solange sie genug trinkt und munter ist, reicht Abwarten. Bei Blut im Stuhl oder starken Schmerzen rufen Sie den Arzt an.","en":"As long as she drinks enough and is lively, waiting is enough. With blood in the stool or severe pain, call the doctor.","ur":"Jab tak woh kaafi peeti rahe aur chust rahe, intezaar kaafi hai. Pakhane mein khoon ya shadeed dard par doctor ko phone karein."},{"s":"B","de":"Gut zu wissen. Eine andere Sache: Muss ich die Packung wirklich zu Ende geben, obwohl es ihr schon besser geht?","en":"Good to know. Another thing: do I really have to finish the packet even though she is already feeling better?","ur":"Acha maloom hua. Ek aur baat: kya mujhe poora course dena hoga jab ke woh pehle hi behtar hai?"},{"s":"A","de":"Bei diesem Antibiotikum ja. Die Dauer steht auf dem Etikett, und die gilt unabhängig davon, wie sie sich fühlt.","en":"With this antibiotic, yes. The duration is on the label, and it applies regardless of how she feels.","ur":"Is antibiotic mein haan. Muddat label par likhi hai, aur woh us ki tabiyat se alag lagoo hoti hai."},{"s":"B","de":"Warum eigentlich? Sie ist ja offensichtlich gesund.","en":"Why actually? She is obviously well again.","ur":"Aakhir kyun? Woh to zahir hai theek hai."},{"s":"A","de":"Weil die zähesten Keime zuletzt sterben. Brechen Sie zu früh ab, überleben genau die, gegen die das Mittel am schlechtesten wirkt.","en":"Because the toughest germs die last. If you stop too early, exactly those survive against which the medicine works worst.","ur":"Kyunke sab se sakht jaraseem aakhir mein marte hain. Jaldi band kar dein to wohi bach jate hain jin par dawa sab se kam asar karti hai."},{"s":"B","de":"So hat mir das noch niemand erklärt. Kann ich den Saft mit Milch mischen? Sie mag den Geschmack nicht.","en":"Nobody has ever explained it to me that way. Can I mix the syrup with milk? She doesn't like the taste.","ur":"Yeh mujhe kisi ne is tarah nahi samjhaya. Kya main syrup doodh mein mila sakti hoon? Usay swaad pasand nahi."},{"s":"A","de":"Bei diesem Wirkstoff besser nicht mit Milch. Geben Sie ihn pur und lassen Sie sie danach etwas Saft trinken.","en":"With this active ingredient better not with milk. Give it neat and let her drink some juice afterwards.","ur":"Is dawa ke saath doodh behtar nahi. Seedhi de dein aur us ke baad thora juice pila dein."},{"s":"B","de":"Alles klar. Und wo bewahre ich die Flasche auf?","en":"All right. And where do I store the bottle?","ur":"Theek hai. Aur bottle kahan rakhoon?"},{"s":"A","de":"Im Kühlschrank, aber nicht in der Tür — dort schwankt die Temperatur zu stark.","en":"In the fridge, but not in the door — the temperature fluctuates too much there.","ur":"Fridge mein, lekin darwaze mein nahi — wahan temperature bohat badalta hai."},{"s":"B","de":"Daran hätte ich nie gedacht. Vielen Dank, Sie haben mir sehr geholfen.","en":"I would never have thought of that. Thank you very much, you have helped me a lot.","ur":"Yeh mere zehen mein kabhi nahi aaya. Bohat shukriya, aap ne bohat madad ki."},{"s":"A","de":"Gern. Wenn etwas unklar ist, kommen Sie einfach vorbei, auch ohne Rezept.","en":"Gladly. If anything is unclear, just drop by, even without a prescription.","ur":"Zaroor. Agar kuch samajh na aaye to bas aa jayein, nuskhe ke baghair bhi."},{"s":"B","de":"Das werde ich machen. Auf Wiedersehen.","en":"I'll do that. Goodbye.","ur":"Main aisa hi karoongi. Khuda hafiz."},{"s":"A","de":"Auf Wiedersehen und gute Besserung für Ihre Tochter.","en":"Goodbye and get well soon to your daughter.","ur":"Khuda hafiz aur aap ki beti jald theek ho jaye."}]},"B2":{"speakers":{"A":"Apotheker","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Ich muss Ihnen leider sagen, dass ich Ihnen nicht genau das Präparat mitgeben kann, das auf dem Rezept steht.","en":"Unfortunately I have to tell you that I can't give you exactly the preparation that is on the prescription.","ur":"Afsos, mujhe kehna par raha hai ke main aap ko theek wohi dawa nahi de sakta jo nuskhe par likhi hai."},{"s":"B","de":"Ist das Mittel nicht lieferbar, oder steckt etwas anderes dahinter?","en":"Is the medicine unavailable, or is something else behind it?","ur":"Kya dawa dastiyab nahi, ya koi aur wajah hai?"},{"s":"A","de":"Beides trifft ein wenig zu. Ihre Kasse hat einen Rabattvertrag mit einem anderen Hersteller, und zusätzlich gibt es bei diesem Wirkstoff gerade einen Lieferengpass.","en":"Both apply a little. Your insurance has a rebate contract with another manufacturer, and on top of that there is currently a supply shortage for this active ingredient.","ur":"Dono baatein thori thori hain. Aap ke insurance ka doosre banane wale se muahida hai, aur is dawa ki supply mein bhi is waqt kami hai."},{"s":"B","de":"Heißt das, ich bekomme ein schlechteres Medikament, weil die Kasse sparen will?","en":"Does that mean I get a worse medication because the insurance wants to save money?","ur":"Kya iska matlab hai ke mujhe kam achi dawa milegi kyunke insurance paise bachana chahta hai?"},{"s":"A","de":"Nein. Der Wirkstoff, die Menge und die Freisetzung sind identisch, geprüft und gesetzlich vorgeschrieben. Unterschiedlich sind nur Hersteller, Farbe und manchmal der Geschmack.","en":"No. The active ingredient, the amount and the release are identical, tested and legally prescribed. Only the manufacturer, the colour and sometimes the taste differ.","ur":"Nahi. Dawa ka asal juzz, miqdar aur asar bilkul yaksan hain, jaanchay huay aur qanoonan zaroori. Sirf banane wala, rang aur kabhi swaad alag hota hai."},{"s":"B","de":"Der Geschmack ist bei einer Fünfjährigen leider kein Nebenaspekt.","en":"With a five-year-old the taste is unfortunately not a side issue.","ur":"Paanch saal ki bachi ke liye swaad afsos se mamooli baat nahi hai."},{"s":"A","de":"Da haben Sie völlig recht, und genau deshalb sage ich es Ihnen vorher. Wenn sie die Einnahme verweigert, nützt das billigste Präparat gar nichts.","en":"You are completely right there, and that is exactly why I'm telling you beforehand. If she refuses to take it, the cheapest preparation is of no use at all.","ur":"Aap bilkul theek kehti hain, isi liye main pehle bata raha hoon. Agar woh dawa lene se inkaar kare to sab se sasti dawa bhi bekaar hai."},{"s":"B","de":"Gibt es denn einen Weg, doch das gewohnte Präparat zu bekommen?","en":"Is there a way to get the familiar preparation after all?","ur":"Kya koi tareeqa hai ke wohi purani dawa mil jaye?"},{"s":"A","de":"Ja. Der Arzt kann auf dem Rezept das Aut-idem-Feld ankreuzen, dann ist der Austausch ausgeschlossen. Er muss das allerdings begründen können.","en":"Yes. The doctor can tick the aut-idem box on the prescription, then substitution is excluded. However, he has to be able to justify it.","ur":"Ji haan. Doctor nuskhe par aut-idem ka khana tick kar sakta hai, phir tabdeeli mumkin nahi. Lekin usay wajah deni hogi."},{"s":"B","de":"Würden Sie das an meiner Stelle veranlassen, oder halten Sie es für übertrieben?","en":"Would you arrange that in my position, or do you consider it excessive?","ur":"Kya aap meri jagah aisa karwate, ya aap ko yeh zaroorat se zyada lagta hai?"},{"s":"A","de":"Ich würde zunächst probieren. Wenn sie es nimmt, sparen Sie sich den Aufwand. Wenn nicht, rufe ich in der Praxis an und wir lösen das heute noch.","en":"I would try first. If she takes it, you save yourself the effort. If not, I'll call the practice and we'll sort it out today.","ur":"Main pehle azma kar dekhta. Agar woh le le to mehnat bach jaye. Warna main clinic phone kar ke aaj hi hal kar deta hoon."},{"s":"B","de":"Das ist ein faires Angebot. Eine letzte Frage: Sie nimmt seit dem Frühjahr täglich Vitamin D. Gibt es da eine Wechselwirkung?","en":"That's a fair offer. One last question: she has taken vitamin D daily since the spring. Is there an interaction?","ur":"Yeh munsifana pesh kash hai. Aakhri sawal: woh bahar se rozana Vitamin D leti hai. Kya koi taasur hoga?"},{"s":"A","de":"Mit diesem Antibiotikum nicht. Kritisch wären Kalzium, Eisen und Milchprodukte im selben Zeitfenster, weil sie die Aufnahme im Darm behindern.","en":"Not with this antibiotic. Calcium, iron and dairy products in the same time window would be critical, because they hinder absorption in the gut.","ur":"Is antibiotic ke saath nahi. Kalsiyam, loha aur doodh ki cheezein isi waqfe mein masla banti hain kyunke woh pait mein jazb hone se rokti hain."},{"s":"B","de":"Also Milch und Käse mindestens zwei Stunden vorher oder nachher.","en":"So milk and cheese at least two hours before or after.","ur":"To doodh aur cheese kam az kam do ghante pehle ya baad."},{"s":"A","de":"Genau so. Sie haben schnell verstanden, worauf es ankommt.","en":"Exactly. You quickly understood what matters.","ur":"Bilkul aisa hi. Aap ne foran samajh liya ke asal baat kya hai."},{"s":"B","de":"Ich habe gelernt, im Zweifel nachzufragen, statt zu Hause zu raten.","en":"I have learned to ask when in doubt, instead of guessing at home.","ur":"Main ne seekha hai ke shak ho to pooch lo, ghar par andaza mat lagao."},{"s":"A","de":"Wenn das alle täten, hätten wir hier deutlich weniger Probleme.","en":"If everyone did that, we would have considerably fewer problems here.","ur":"Agar sab aisa karein to yahan bohat kam masail hon."},{"s":"B","de":"Vielen Dank für Ihre Zeit. Auf Wiedersehen.","en":"Thank you for your time. Goodbye.","ur":"Aap ke waqt ka shukriya. Khuda hafiz."}]}},"roleplay":{"easy":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Der Arzt schreibt ein Rezept. Sie möchten wissen, wie Ihr Kind die Medizin nehmen soll.","en":"The doctor writes a prescription. You want to know how your child should take the medicine.","ur":"Doctor nuskha likh raha hai. Aap jan-na chahti hain ke bacha dawa kaise le."},"start":"n1","nodes":{"n1":{"say":"Ich schreibe Ihnen ein Rezept. Ein Saft gegen die Schmerzen.","goal":{"en":"Ask how often he should take the syrup.","ur":"Poochein ke syrup kitni baar leni hai."},"options":["Wie oft soll er den Saft nehmen?","Wie oft muss er den Saft nehmen?"],"fallback":"Haben Sie eine Frage zum Rezept?","accept":[{"kw":["wie","oft","saft"],"next":"n2"},{"kw":["oft"],"next":"n2"}]},"n2":{"say":"Dreimal am Tag, nach dem Essen.","goal":{"en":"Ask how much each time.","ur":"Poochein ke har baar kitni."},"options":["Wie viel jedes Mal?","Wie viel soll ich geben?"],"fallback":"Noch etwas unklar?","accept":[{"kw":["wie","viel"],"next":"n3"},{"kw":["viel"],"next":"n3"}]},"n3":{"say":"Fünf Milliliter. Der Löffel ist in der Packung.","goal":{"en":"Ask for how long.","ur":"Poochein ke kitne din."},"options":["Und wie lange?","Wie lange soll er das nehmen?"],"fallback":"Möchten Sie noch etwas wissen?","accept":[{"kw":["wie","lange"],"next":"n4"},{"kw":["lange"],"next":"n4"}]},"n4":{"say":"Fünf Tage lang.","goal":{"en":"Ask where you can buy it.","ur":"Poochein ke yeh kahan se milegi."},"options":["Wo kann ich das kaufen?","Wo bekomme ich das?"],"fallback":"Wissen Sie, wohin Sie damit gehen?","accept":[{"kw":["wo","kaufen"],"next":"n5"},{"kw":["kaufen"],"next":"n5"},{"kw":["bekomme"],"next":"n5"}]},"n5":{"say":"In der Apotheke, gleich neben der Praxis.","goal":{"en":"Ask whether you have to pay anything.","ur":"Poochein ke kya paise dene honge."},"options":["Muss ich etwas bezahlen?","Kostet das etwas?"],"fallback":"Noch eine Frage?","accept":[{"kw":["bezahlen"],"reply":"Für Kinder ist das Medikament kostenlos. Gute Besserung!","next":"END"},{"kw":["kostet"],"reply":"Für Kinder ist das Medikament kostenlos. Gute Besserung!","next":"END"}]}}},"hard":{"role":"Apotheker","you":"Vater oder Mutter","scene":{"de":"Sie sind in der Apotheke und lösen ein Rezept für ein Antibiotikum ein. Sie haben Fragen zu Nebenwirkungen und zur Einnahme.","en":"You are at the pharmacy collecting an antibiotic prescription. You have questions about side effects and how to take it.","ur":"Aap pharmacy mein antibiotic ka nuskha de rahi hain. Side effects aur khurak ke baare mein sawal hain."},"start":"n1","nodes":{"n1":{"say":"Guten Tag. Das Antibiotikum ist fertig. Haben Sie noch Fragen dazu?","goal":{"en":"Say the package insert lists many side effects and ask whether you need to worry.","ur":"Kahein ke parche par bohat side effects hain aur poochein ke kya fikar karni chahiye."},"options":["Im Beipackzettel steht eine ganze Liste von Nebenwirkungen. Muss ich mir Sorgen machen?","Der Beipackzettel macht mir Sorgen. Muss ich mir Sorgen machen?"],"fallback":"Was beschäftigt Sie denn?","accept":[{"kw":["beipackzettel","sorgen"],"next":"n2"},{"kw":["nebenwirkungen"],"next":"n2"},{"kw":["sorgen"],"next":"n2"}]},"n2":{"say":"Auf dem Zettel steht alles, was jemals gemeldet wurde. Häufig sind bei diesem Mittel nur weicher Stuhl und Bauchgrummeln.","goal":{"en":"Ask what to do if she does get diarrhoea.","ur":"Poochein ke agar phir bhi dast lag jayein to kya karein."},"options":["Und wenn sie doch Durchfall bekommt?","Was mache ich, wenn sie Durchfall bekommt?"],"fallback":"Haben Sie dazu noch eine Frage?","accept":[{"kw":["durchfall"],"next":"n3"}]},"n3":{"say":"Solange sie genug trinkt und munter ist, reicht Abwarten. Bei Blut im Stuhl rufen Sie den Arzt an.","goal":{"en":"Ask whether you really have to finish the packet although she is already better.","ur":"Poochein ke kya poora course dena zaroori hai jab ke woh behtar hai."},"options":["Muss ich die Packung wirklich zu Ende geben, obwohl es ihr besser geht?","Muss sie das Antibiotikum zu Ende nehmen?"],"fallback":"Noch etwas?","accept":[{"kw":["ende","geben"],"next":"n4"},{"kw":["packung"],"next":"n4"},{"kw":["ende"],"next":"n4"}]},"n4":{"say":"Ja, unbedingt. Die Dauer steht auf dem Etikett und gilt unabhängig davon, wie sie sich fühlt.","goal":{"en":"Ask why that is, since she is obviously well again.","ur":"Poochein ke aisa kyun hai, jab ke woh zahiri tor par theek hai."},"options":["Warum eigentlich? Sie ist ja offensichtlich gesund.","Warum ist das so wichtig?"],"fallback":"Möchten Sie wissen, warum?","accept":[{"kw":["warum"],"next":"n5"}]},"n5":{"say":"Weil die zähesten Keime zuletzt sterben. Brechen Sie zu früh ab, überleben genau die, gegen die das Mittel am schlechtesten wirkt.","goal":{"en":"Ask whether you can mix the syrup with milk, because she doesn't like the taste.","ur":"Poochein ke kya syrup doodh mein mila sakti hain, kyunke usay swaad pasand nahi."},"options":["Kann ich den Saft mit Milch mischen? Sie mag den Geschmack nicht.","Darf ich den Saft mit Milch mischen?"],"fallback":"Haben Sie noch eine Frage zur Einnahme?","accept":[{"kw":["milch","mischen"],"next":"n6"},{"kw":["milch"],"next":"n6"}]},"n6":{"say":"Bei diesem Wirkstoff besser nicht mit Milch. Geben Sie ihn pur und lassen Sie sie danach etwas Saft trinken.","goal":{"en":"Ask where you should store the bottle.","ur":"Poochein ke bottle kahan rakhni hai."},"options":["Und wo bewahre ich die Flasche auf?","Wo soll ich die Flasche aufbewahren?"],"fallback":"Noch etwas unklar?","accept":[{"kw":["flasche"],"reply":"Im Kühlschrank, aber nicht in der Tür. Gute Besserung für Ihre Tochter!","next":"END"},{"kw":["bewahre"],"reply":"Im Kühlschrank, aber nicht in der Tür. Gute Besserung!","next":"END"}]}}}}}]},{"id":"hausarzt","order":2,"icon":"🩻","title":{"de":"Beim Hausarzt","en":"At the family doctor","ur":"Family doctor ke paas"},"intro":"Termin, Beschwerden, Krankschreibung, Überweisung und Befund — die wichtigsten Gespräche für Erwachsene beim Hausarzt.","test":{"items":[{"type":"mc","q":"die Krankschreibung","opts":["sick note (for work)","prescription","referral","vaccination"],"a":0,"ur":"kaam ke liye medical chhutti","word":"krankschreibung"},{"type":"mc","q":"die Überweisung","opts":["referral to a specialist","money transfer only","prescription","diagnosis"],"a":0,"ur":"specialist ke liye referral","word":"überweisung"},{"type":"mc","q":"der Blutdruck","opts":["blood pressure","blood test","pulse","temperature"],"a":0,"ur":"blood pressure","word":"blutdruck"},{"type":"mc","q":"der Facharzt","opts":["specialist doctor","family doctor","dentist","pharmacist"],"a":0,"ur":"mahir doctor / specialist","word":"facharzt"},{"type":"mc","q":"der Befund","opts":["medical findings / result","appointment","sick note","waiting room"],"a":0,"ur":"test ka nateeja / report","word":"befund"},{"type":"mc","q":"die Beschwerden","opts":["symptoms / complaints","costs","documents","medicines"],"a":0,"ur":"takleef / shikayat","word":"beschwerden"},{"type":"gap","de":"Ich brauche eine ___ für meinen Arbeitgeber.","a":"Krankschreibung","hint":"sick note · medical chhutti","en":"I need a sick note for my employer.","word":"krankschreibung"},{"type":"gap","de":"Der Arzt misst zuerst den ___.","a":"Blutdruck","hint":"blood pressure","en":"The doctor measures the blood pressure first.","word":"blutdruck"},{"type":"gap","de":"Ich hätte gern einen ___ bei Doktor Schulz.","a":"Termin","hint":"appointment","en":"I'd like an appointment with Doctor Schulz.","word":"termin"},{"type":"order","a":"Ich fühle mich seit einer Woche schlapp","en":"I've been feeling weak for a week."},{"type":"order","a":"Können Sie mich zum Facharzt überweisen","en":"Can you refer me to a specialist?"},{"type":"order","a":"Wie lange bin ich krankgeschrieben","en":"How long am I signed off sick?"},{"type":"listen","a":"Ich habe seit drei Tagen Kopfschmerzen.","en":"I've had a headache for three days."},{"type":"listen","a":"Nehmen Sie regelmäßig Medikamente?","en":"Do you take any medication regularly?"},{"type":"listen","a":"Ich schreibe Sie bis Freitag krank.","en":"I'll sign you off sick until Friday."},{"type":"prod","en":"I would like an appointment this week.","ur":"Mujhe is hafte appointment chahiye.","a":"Ich hätte gern einen Termin in dieser Woche."},{"type":"prod","en":"I need a sick note for my employer.","ur":"Mujhe apne employer ke liye medical chhutti chahiye.","a":"Ich brauche eine Krankschreibung für meinen Arbeitgeber."},{"type":"prod","en":"Can you refer me to a specialist?","ur":"Kya aap mujhe specialist ke paas bhej sakte hain?","a":"Können Sie mich zum Facharzt überweisen?"},{"type":"prod","en":"I feel dizzy and tired.","ur":"Mujhe chakkar aate hain aur thakan hai.","a":"Mir ist schwindelig und ich bin müde."}]},"subs":[{"id":"termin","order":1,"icon":"📞","title":{"de":"Einen Termin machen","en":"Making an appointment","ur":"Appointment lena"},"angle":"Phoning the family doctor's practice · Family doctor ke clinic phone karna","voices":{"A":"Aoede","B":"Kore"},"words":["termin","hausarzt","beschwerden","krankschreibung","sprechstunde","gesetzlich","privat","dringend","wartezeit","überweisung"],"dialogues":{"A1":{"speakers":{"A":"Frau Neumann (Praxis)","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Hausarztpraxis Doktor Schulz, guten Tag.","en":"Doctor Schulz's family practice, hello.","ur":"Doctor Schulz ka clinic, salam."},{"s":"B","de":"Guten Tag. Ich möchte einen Termin.","en":"Hello. I would like an appointment.","ur":"Salam. Mujhe appointment chahiye."},{"s":"A","de":"Waren Sie schon bei uns?","en":"Have you been to us before?","ur":"Kya aap pehle yahan aayi hain?"},{"s":"B","de":"Ja, ich bin Patientin hier.","en":"Yes, I am a patient here.","ur":"Ji haan, main yahan ki patient hoon."},{"s":"A","de":"Wie heißen Sie?","en":"What is your name?","ur":"Aap ka naam kya hai?"},{"s":"B","de":"Mein Name ist Aylin Yilmaz.","en":"My name is Aylin Yilmaz.","ur":"Mera naam Aylin Yilmaz hai."},{"s":"A","de":"Was haben Sie für Beschwerden?","en":"What symptoms do you have?","ur":"Aap ko kya takleef hai?"},{"s":"B","de":"Ich habe seit drei Tagen Kopfschmerzen.","en":"I have had a headache for three days.","ur":"Mujhe teen din se sar dard hai."},{"s":"A","de":"Können Sie morgen um zehn Uhr kommen?","en":"Can you come tomorrow at ten o'clock?","ur":"Kya aap kal das baje aa sakti hain?"},{"s":"B","de":"Ja, das passt.","en":"Yes, that works.","ur":"Ji haan, theek hai."},{"s":"A","de":"Brauchen Sie eine Krankschreibung?","en":"Do you need a sick note?","ur":"Kya aap ko medical chhutti chahiye?"},{"s":"B","de":"Ja, für meine Arbeit.","en":"Yes, for my work.","ur":"Ji haan, apne kaam ke liye."},{"s":"A","de":"Gut. Bringen Sie die Versichertenkarte mit.","en":"Good. Bring your insurance card.","ur":"Acha. Insurance card saath layein."},{"s":"B","de":"Mache ich. Vielen Dank.","en":"I will. Thank you very much.","ur":"Zaroor. Bohat shukriya."},{"s":"A","de":"Bis morgen. Auf Wiederhören.","en":"See you tomorrow. Goodbye.","ur":"Kal milte hain. Khuda hafiz."}]},"A2":{"speakers":{"A":"Frau Neumann (Praxis)","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Praxis Doktor Schulz, Neumann am Apparat. Was kann ich für Sie tun?","en":"Doctor Schulz's practice, Neumann speaking. What can I do for you?","ur":"Doctor Schulz ka clinic, Neumann baat kar rahi hoon. Main kya madad karoon?"},{"s":"B","de":"Guten Tag. Ich hätte gern einen Termin in dieser Woche.","en":"Hello. I'd like an appointment this week.","ur":"Salam. Mujhe is hafte appointment chahiye."},{"s":"A","de":"Sind Sie gesetzlich oder privat versichert?","en":"Are you insured with statutory or private insurance?","ur":"Aap ka insurance sarkari hai ya private?"},{"s":"B","de":"Gesetzlich, bei der AOK.","en":"Statutory, with the AOK.","ur":"Sarkari, AOK ke saath."},{"s":"A","de":"In Ordnung. Worum geht es denn?","en":"All right. What is it about?","ur":"Theek hai. Baat kya hai?"},{"s":"B","de":"Ich fühle mich seit einer Woche schlapp und müde.","en":"I've been feeling weak and tired for a week.","ur":"Ek hafte se main nidhaal aur thaki hui hoon."},{"s":"A","de":"Haben Sie auch Fieber gemessen?","en":"Have you also measured your temperature?","ur":"Kya aap ne bukhar bhi naapa?"},{"s":"B","de":"Ja, achtunddreißig Grad. Nicht sehr hoch, aber es geht mir nicht gut.","en":"Yes, thirty-eight degrees. Not very high, but I don't feel well.","ur":"Ji haan, athtees degree. Zyada nahi, lekin tabiyat theek nahi."},{"s":"A","de":"Am Donnerstag um Viertel vor neun ist etwas frei. Passt Ihnen das?","en":"On Thursday at quarter to nine something is free. Does that suit you?","ur":"Jumeraat ko paune nau baje kuch khali hai. Theek rahega?"},{"s":"B","de":"Geht es vielleicht etwas später? Ich muss vorher meine Kinder in die Schule bringen.","en":"Could it be a bit later maybe? I have to take my children to school first.","ur":"Thora baad ho sakta hai? Pehle bachon ko school chhorna hai."},{"s":"A","de":"Dann nehmen wir zehn Uhr dreißig.","en":"Then let's take ten thirty.","ur":"To saarhe das baje le lete hain."},{"s":"B","de":"Perfekt. Und brauche ich für die Arbeit eine Krankschreibung?","en":"Perfect. And do I need a sick note for work?","ur":"Bohat acha. Aur kaam ke liye medical chhutti chahiye?"},{"s":"A","de":"Das entscheidet der Arzt beim Termin. Sagen Sie ihm einfach Bescheid.","en":"The doctor decides that at the appointment. Just let him know.","ur":"Woh doctor appointment par tay karega. Bas usay bata dein."},{"s":"B","de":"Mache ich. Muss ich etwas mitbringen?","en":"I will. Do I have to bring anything?","ur":"Zaroor. Kya kuch lana hoga?"},{"s":"A","de":"Die Versichertenkarte und eine Liste Ihrer Medikamente, falls Sie welche nehmen.","en":"Your insurance card and a list of your medications, if you take any.","ur":"Insurance card aur apni dawaon ki list, agar aap koi leti hain."},{"s":"B","de":"Alles klar. Vielen Dank und bis Donnerstag.","en":"All right. Thank you and see you Thursday.","ur":"Theek hai. Shukriya aur Jumeraat ko milte hain."}]},"B1":{"speakers":{"A":"Frau Neumann (Praxis)","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Praxis Doktor Schulz, guten Morgen.","en":"Doctor Schulz's practice, good morning.","ur":"Doctor Schulz ka clinic, subh bakhair."},{"s":"B","de":"Guten Morgen. Yilmaz mein Name. Ich brauche relativ dringend einen Termin.","en":"Good morning. Yilmaz is my name. I need an appointment fairly urgently.","ur":"Subh bakhair. Mera naam Yilmaz. Mujhe kaafi jaldi appointment chahiye."},{"s":"A","de":"Was ist denn los? Wenn es dringend ist, schaue ich, ob wir Sie heute noch dazwischenschieben können.","en":"What's wrong? If it's urgent, I'll see whether we can fit you in today.","ur":"Kya masla hai? Agar zaroori hai to main dekhti hoon ke aaj hi kahin daal dein."},{"s":"B","de":"Ich habe seit gestern starke Bauchschmerzen, die immer wiederkommen, und mir ist mehrmals übel geworden.","en":"I've had strong stomach pains since yesterday that keep coming back, and I've felt sick several times.","ur":"Kal se mujhe tez pait dard hai jo baar baar aata hai, aur mujhe kai baar matli hui."},{"s":"A","de":"Haben Sie Fieber oder Durchfall dazu?","en":"Do you have a fever or diarrhoea as well?","ur":"Kya saath mein bukhar ya dast bhi hain?"},{"s":"B","de":"Fieber nicht, aber ich konnte heute kaum etwas essen.","en":"No fever, but I could hardly eat anything today.","ur":"Bukhar nahi, lekin aaj main mushkil se kuch kha saki."},{"s":"A","de":"Das sollten wir uns ansehen. Kommen Sie um dreizehn Uhr, dann nimmt der Arzt Sie in der offenen Sprechstunde dran.","en":"We should take a look at that. Come at one o'clock, then the doctor will see you in the open surgery.","ur":"Isay dekhna chahiye. Ek baje aa jayein, doctor aap ko open waqt mein dekh lega."},{"s":"B","de":"Muss ich dann mit einer langen Wartezeit rechnen?","en":"Should I expect a long wait then?","ur":"To kya lambe intezaar ki tawaqqo karoon?"},{"s":"A","de":"Mittags ist meistens weniger los als morgens, aber ganz ohne Wartezeit geht es in der offenen Sprechstunde selten.","en":"At midday it's usually less busy than in the morning, but the open surgery is rarely completely without a wait.","ur":"Dopahar aksar subh se kam bheer hoti hai, lekin open waqt mein bilkul bina intezaar shaz hi hota hai."},{"s":"B","de":"Das ist in Ordnung, Hauptsache ich werde heute noch untersucht.","en":"That's fine, the main thing is that I get examined today.","ur":"Theek hai, ahem yeh hai ke aaj muaina ho jaye."},{"s":"A","de":"Falls die Schmerzen vorher stärker werden oder Sie Blut bemerken, fahren Sie bitte sofort in die Notaufnahme.","en":"If the pain gets worse beforehand or you notice blood, please go straight to the emergency department.","ur":"Agar us se pehle dard barh jaye ya khoon nazar aaye to seedha emergency chali jayein."},{"s":"B","de":"Verstanden. Woran erkenne ich, dass es ernst ist?","en":"Understood. How do I recognise that it's serious?","ur":"Samajh gayi. Kaise pata chale ke sangeen hai?"},{"s":"A","de":"Bei sehr starken Schmerzen, hohem Fieber oder wenn der Bauch hart wird, warten Sie nicht auf uns.","en":"With very severe pain, high fever, or if the abdomen becomes hard, don't wait for us.","ur":"Bohat tez dard, tez bukhar, ya pait sakht ho jaye to hamara intezaar na karein."},{"s":"B","de":"Gut zu wissen. Bringe ich außer der Karte noch etwas mit?","en":"Good to know. Besides the card, should I bring anything else?","ur":"Acha maloom hua. Card ke ilawa kuch aur lana hai?"},{"s":"A","de":"Notieren Sie sich, wann die Schmerzen anfangen und ob sie mit dem Essen zusammenhängen. Das hilft dem Arzt.","en":"Note down when the pains start and whether they are linked to eating. That helps the doctor.","ur":"Likh lein ke dard kab shuru hota hai aur khane se taalluq hai ya nahi. Isse doctor ko madad milegi."},{"s":"B","de":"Das mache ich. Vielen Dank für Ihre Hilfe.","en":"I'll do that. Thank you for your help.","ur":"Zaroor. Aap ki madad ka shukriya."},{"s":"A","de":"Gern. Bis später, und gute Besserung schon mal.","en":"You're welcome. See you later, and get well soon in the meantime.","ur":"Koi baat nahi. Baad mein milte hain, aur abhi se jald sehatyabi."}]},"B2":{"speakers":{"A":"Frau Neumann (Praxis)","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Praxis Doktor Schulz, Neumann, guten Tag.","en":"Doctor Schulz's practice, Neumann, hello.","ur":"Doctor Schulz ka clinic, Neumann, salam."},{"s":"B","de":"Guten Tag, Frau Neumann. Ich bräuchte einen Termin, würde aber vorher gern klären, ob ich beim Hausarzt überhaupt richtig bin.","en":"Hello, Mrs Neumann. I'd need an appointment, but first I'd like to clarify whether the family doctor is even the right place for me.","ur":"Salam, Frau Neumann. Mujhe appointment chahiye, lekin pehle jan-na chahti hoon ke family doctor sahi jagah hai bhi ya nahi."},{"s":"A","de":"Schildern Sie mir kurz, worum es geht, dann sage ich Ihnen, ob wir das übernehmen oder überweisen.","en":"Briefly describe what it's about, then I'll tell you whether we handle it or refer you.","ur":"Mukhtasar batayein ke masla kya hai, phir main bataoongi ke hum karein ya referral dein."},{"s":"B","de":"Ich habe seit einigen Wochen immer wieder Herzstolpern, vor allem abends, und manchmal ist mir dabei schwindelig.","en":"For some weeks I've repeatedly had heart palpitations, especially in the evenings, and sometimes I feel dizzy with it.","ur":"Kuch hafton se mujhe baar baar dil ki dharkan ki be-tarteebi hoti hai, khaas kar sham ko, aur kabhi saath mein chakkar aata hai."},{"s":"A","de":"So etwas gehört zunächst zum Hausarzt. Er macht ein EKG und entscheidet dann, ob eine Überweisung zum Kardiologen nötig ist.","en":"Something like that belongs with the family doctor first. He does an ECG and then decides whether a referral to a cardiologist is necessary.","ur":"Aisi baat pehle family doctor ke paas jati hai. Woh ECG karta hai aur phir tay karta hai ke dil ke doctor ki referral chahiye ya nahi."},{"s":"B","de":"Das leuchtet mir ein. Wie schnell bekomme ich denn einen Termin mit EKG?","en":"That makes sense to me. How quickly can I get an appointment with an ECG?","ur":"Yeh samajh aa gaya. ECG wala appointment kitni jaldi milega?"},{"s":"A","de":"Für ein Ruhe-EKG brauchen wir etwas mehr Zeit im Kalender. Nächste Woche Dienstag um acht Uhr hätte ich einen längeren Termin.","en":"For a resting ECG we need a bit more time in the calendar. Next Tuesday at eight o'clock I'd have a longer appointment.","ur":"Aaram wale ECG ke liye calendar mein thora zyada waqt chahiye. Agle Mangal aath baje ek lamba appointment hai."},{"s":"B","de":"Können Sie das nicht früher unterbringen? Die Beschwerden machen mir ehrlich gesagt Sorgen.","en":"Can't you fit it in earlier? To be honest, the symptoms worry me.","ur":"Kya is se pehle nahi ho sakta? Sach kahoon to yeh takleef mujhe pareshan karti hai."},{"s":"A","de":"Ich verstehe das. Wenn Sie akut Herzrasen mit Luftnot oder Schmerzen in der Brust haben, ist das ein Notfall und Sie rufen die 112.","en":"I understand. If you acutely have a racing heart with shortness of breath or chest pain, that's an emergency and you call 112.","ur":"Main samajhti hoon. Agar achanak dil tez ho aur saans ki tangi ya seene mein dard ho to yeh emergency hai aur aap 112 karein."},{"s":"B","de":"So schlimm ist es im Moment nicht, es kommt und geht.","en":"It's not that bad at the moment, it comes and goes.","ur":"Abhi itna bura nahi, aata jata rehta hai."},{"s":"A","de":"Dann schlage ich vor: Ich trage Sie für Dienstag ein, und wenn wir kurzfristig etwas frei bekommen, rufe ich Sie an.","en":"Then I suggest: I'll book you for Tuesday, and if something frees up at short notice, I'll call you.","ur":"To main tajweez karti hoon: aap ko Mangal likh deti hoon, aur agar jaldi kuch khali ho to phone kar loongi."},{"s":"B","de":"Das wäre sehr nett. Führen Sie bitte auch, dass die Beschwerden vor allem unter Stress auftreten.","en":"That would be very kind. Please also note that the symptoms occur mainly under stress.","ur":"Yeh bohat meherbani hogi. Meherbani kar ke yeh bhi likh lein ke takleef khaas kar stress mein hoti hai."},{"s":"A","de":"Notiere ich. Trinken Sie viel Kaffee oder haben Sie in letzter Zeit weniger geschlafen?","en":"I'll note it. Do you drink a lot of coffee or have you slept less recently?","ur":"Likh leti hoon. Kya aap zyada coffee peeti hain ya haal mein kam soyi hain?"},{"s":"B","de":"Beides, ehrlich gesagt. Vielleicht hängt es ja damit zusammen.","en":"Both, to be honest. Maybe it's related to that.","ur":"Dono, sach kahoon to. Shayad isi se taalluq ho."},{"s":"A","de":"Das kann gut sein, aber das klärt der Arzt. Bringen Sie am Dienstag bitte nüchtern nichts Dringendes vor, das EKG selbst dauert nur wenige Minuten.","en":"That may well be, but the doctor will clarify that. On Tuesday, don't schedule anything urgent right after; the ECG itself only takes a few minutes.","ur":"Ho sakta hai, lekin yeh doctor dekhega. Mangal ko us ke foran baad koi zaroori kaam na rakhein; ECG khud sirf chand minute leta hai."},{"s":"B","de":"Gut, dann plane ich genug Zeit ein. Ich danke Ihnen für die ausführliche Auskunft.","en":"Good, then I'll allow enough time. Thank you for the detailed information.","ur":"Acha, to main kaafi waqt rakhoongi. Tafseeli maloomat ka shukriya."},{"s":"A","de":"Sehr gern. Melden Sie sich, wenn sich vorher etwas verändert. Bis Dienstag, Frau Yilmaz.","en":"You're very welcome. Get in touch if anything changes beforehand. See you Tuesday, Mrs Yilmaz.","ur":"Bohat khushi se. Agar pehle kuch badle to rabta karein. Mangal ko milte hain, Frau Yilmaz."}]}},"roleplay":{"easy":{"role":"Frau Neumann, Praxis","you":"Patient / Patientin","scene":{"de":"Sie rufen beim Hausarzt an. Sie haben seit drei Tagen Kopfschmerzen und möchten einen Termin.","en":"You call the family doctor. You've had a headache for three days and want an appointment.","ur":"Aap family doctor ko phone karte hain. Teen din se sar dard hai aur appointment chahiye."},"start":"n1","nodes":{"n1":{"say":"Hausarztpraxis Doktor Schulz, guten Tag.","goal":{"en":"Greet and say you'd like an appointment.","ur":"Salam karein aur kahein ke appointment chahiye."},"options":["Guten Tag. Ich möchte einen Termin.","Guten Tag, ich hätte gern einen Termin."],"fallback":"Entschuldigung, was möchten Sie?","accept":[{"kw":["guten","termin"],"next":"n2"},{"kw":["termin"],"next":"n2"}]},"n2":{"say":"Waren Sie schon bei uns?","goal":{"en":"Say yes, you're a patient here.","ur":"Kahein: haan, main yahan ki patient hoon."},"options":["Ja, ich bin Patientin hier.","Ja, ich bin schon Patient hier."],"fallback":"Sind Sie bei uns in Behandlung?","accept":[{"kw":["ja","patient"],"next":"n3"},{"kw":["ja"],"next":"n3"}]},"n3":{"say":"Was haben Sie für Beschwerden?","goal":{"en":"Say you've had a headache for three days.","ur":"Kahein ke teen din se sar dard hai."},"options":["Ich habe seit drei Tagen Kopfschmerzen.","Seit drei Tagen habe ich Kopfschmerzen."],"fallback":"Was tut Ihnen weh?","accept":[{"kw":["kopfschmerzen"],"next":"n4"},{"kw":["drei","tagen"],"next":"n4"}]},"n4":{"say":"Können Sie morgen um zehn Uhr kommen?","goal":{"en":"Say yes, that works.","ur":"Kahein: haan, theek hai."},"options":["Ja, das passt.","Ja, um zehn Uhr ist gut."],"fallback":"Passt Ihnen der Termin?","accept":[{"kw":["ja","passt"],"next":"n5"},{"kw":["ja"],"next":"n5"}]},"n5":{"say":"Brauchen Sie eine Krankschreibung?","goal":{"en":"Say yes, for your work.","ur":"Kahein: haan, apne kaam ke liye."},"options":["Ja, für meine Arbeit.","Ja, ich brauche eine Krankschreibung für die Arbeit."],"fallback":"Möchten Sie eine Krankschreibung?","accept":[{"kw":["ja","arbeit"],"next":"n6"},{"kw":["ja"],"next":"n6"}]},"n6":{"say":"Gut. Bringen Sie die Versichertenkarte mit.","goal":{"en":"Say you will and thank her and say goodbye.","ur":"Kahein zaroor, shukriya aur khuda hafiz."},"options":["Mache ich. Vielen Dank. Auf Wiederhören.","Gut. Danke schön. Auf Wiederhören."],"fallback":"Haben Sie das notiert?","accept":[{"kw":["danke","wiederhören"],"reply":"Bis morgen. Auf Wiederhören.","next":"END"},{"kw":["danke"],"reply":"Bis morgen. Auf Wiederhören.","next":"END"}]}}},"hard":{"role":"Frau Neumann, Praxis","you":"Patient / Patientin","scene":{"de":"Sie haben seit gestern starke, wiederkehrende Bauchschmerzen und Übelkeit. Sie rufen morgens beim Hausarzt an und möchten dringend einen Termin.","en":"You've had strong, recurring stomach pains and nausea since yesterday. You call the family doctor in the morning and want an urgent appointment.","ur":"Kal se aap ko tez, baar baar aane wala pait dard aur matli hai. Aap subh family doctor ko phone karte hain aur foran appointment chahte hain."},"start":"n1","nodes":{"n1":{"say":"Praxis Doktor Schulz, guten Morgen.","goal":{"en":"Greet, give your name, and say you urgently need an appointment.","ur":"Salam karein, naam batayein aur kahein ke foran appointment chahiye."},"options":["Guten Morgen, Yilmaz mein Name. Ich brauche dringend einen Termin.","Guten Morgen, mein Name ist Yilmaz. Ich brauche dringend einen Termin."],"fallback":"Worum geht es, bitte?","accept":[{"kw":["guten","dringend","termin"],"next":"n2"},{"kw":["dringend"],"next":"n2"},{"kw":["termin"],"next":"n2"}]},"n2":{"say":"Was ist denn los? Wenn es dringend ist, versuche ich, Sie heute dazwischenzuschieben.","goal":{"en":"Say you've had strong stomach pains since yesterday that keep coming back, and you've felt sick.","ur":"Kahein ke kal se tez pait dard hai jo baar baar aata hai, aur matli hui."},"options":["Ich habe seit gestern starke Bauchschmerzen, die immer wiederkommen, und mir ist übel geworden.","Seit gestern habe ich starke Bauchschmerzen und mir ist übel."],"fallback":"Können Sie die Beschwerden beschreiben?","accept":[{"kw":["bauchschmerzen","übel"],"next":"n3"},{"kw":["bauchschmerzen"],"next":"n3"}]},"n3":{"say":"Haben Sie Fieber oder Durchfall dazu?","goal":{"en":"Say no fever, but you could hardly eat today.","ur":"Kahein bukhar nahi, lekin aaj mushkil se kuch khaya."},"options":["Fieber nicht, aber ich konnte heute kaum etwas essen.","Kein Fieber, aber ich habe kaum gegessen."],"fallback":"Fieber? Durchfall?","accept":[{"kw":["fieber","essen"],"next":"n4"},{"kw":["kaum"],"next":"n4"},{"kw":["nicht","essen"],"next":"n4"}]},"n4":{"say":"Das sollten wir uns ansehen. Kommen Sie um dreizehn Uhr in die offene Sprechstunde.","goal":{"en":"Ask whether you should expect a long wait.","ur":"Poochein ke kya lambe intezaar ki tawaqqo karein."},"options":["Muss ich mit einer langen Wartezeit rechnen?","Wie lange ist die Wartezeit ungefähr?"],"fallback":"Haben Sie dazu eine Frage?","accept":[{"kw":["wartezeit"],"next":"n5"},{"kw":["lange","warten"],"next":"n5"},{"kw":["warten"],"next":"n5"}]},"n5":{"say":"Mittags ist meistens weniger los, aber ganz ohne Wartezeit geht es selten. Falls die Schmerzen stärker werden oder Sie Blut bemerken, fahren Sie sofort in die Notaufnahme.","goal":{"en":"Ask how you recognise that it's serious.","ur":"Poochein ke kaise pata chale ke sangeen hai."},"options":["Woran erkenne ich, dass es ernst ist?","Wie merke ich, dass es ernst wird?"],"fallback":"Ist das so weit klar?","accept":[{"kw":["woran","ernst"],"next":"n6"},{"kw":["ernst"],"next":"n6"},{"kw":["merke"],"next":"n6"}]},"n6":{"say":"Bei sehr starken Schmerzen, hohem Fieber oder wenn der Bauch hart wird, warten Sie nicht auf uns.","goal":{"en":"Say understood, thank her, and say see you later.","ur":"Kahein samajh gayi, shukriya, aur baad mein milte hain."},"options":["Verstanden. Vielen Dank. Bis später.","Alles klar. Danke schön. Bis später."],"fallback":"Haben Sie noch eine Frage?","accept":[{"kw":["danke","später"],"reply":"Bis später, und gute Besserung schon mal.","next":"END"},{"kw":["danke"],"reply":"Bis später, und gute Besserung.","next":"END"}]}}}}},{"id":"beschwerden","order":2,"icon":"🤒","title":{"de":"Beschwerden schildern","en":"Describing your symptoms","ur":"Takleef batana"},"angle":"In the consulting room with the doctor · Doctor ke kamre mein","voices":{"A":"Puck","B":"Kore"},"words":["beschwerden","müde","schwindelig","appetit","schlafen","stress","untersuchen","blutdruck","blutabnahme","erschöpft"],"dialogues":{"A1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Yilmaz. Bitte setzen Sie sich.","en":"Hello, Mrs Yilmaz. Please sit down.","ur":"Salam, Frau Yilmaz. Baith jayein."},{"s":"A","de":"Was fehlt Ihnen?","en":"What's wrong with you?","ur":"Aap ko kya takleef hai?"},{"s":"B","de":"Ich bin sehr müde und schlapp.","en":"I am very tired and run-down.","ur":"Main bohat thaki aur nidhaal hoon."},{"s":"A","de":"Seit wann geht das so?","en":"How long has this been going on?","ur":"Yeh kab se hai?"},{"s":"B","de":"Seit ungefähr zwei Wochen.","en":"For about two weeks.","ur":"Taqreeban do hafte se."},{"s":"A","de":"Schlafen Sie gut?","en":"Do you sleep well?","ur":"Kya aap achi tarah soti hain?"},{"s":"B","de":"Nein, ich wache oft auf.","en":"No, I often wake up.","ur":"Nahi, main aksar jaag jati hoon."},{"s":"A","de":"Haben Sie Appetit?","en":"Do you have an appetite?","ur":"Kya aap ko bhook lagti hai?"},{"s":"B","de":"Nicht so viel wie früher.","en":"Not as much as before.","ur":"Pehle jitni nahi."},{"s":"A","de":"Ich messe zuerst den Blutdruck.","en":"I'll measure your blood pressure first.","ur":"Pehle main blood pressure naapta hoon."},{"s":"B","de":"In Ordnung.","en":"All right.","ur":"Theek hai."},{"s":"A","de":"Der Blutdruck ist normal. Wir machen eine Blutabnahme.","en":"The blood pressure is normal. We'll do a blood test.","ur":"Blood pressure normal hai. Hum khoon ka test karte hain."},{"s":"B","de":"Ist das schlimm?","en":"Is that serious?","ur":"Kya yeh serious hai?"},{"s":"A","de":"Nein. Wir schauen, ob Ihnen etwas fehlt, zum Beispiel Eisen.","en":"No. We'll check whether you're lacking something, for example iron.","ur":"Nahi. Hum dekhte hain ke kisi cheez ki kami to nahi, jaise loha."},{"s":"B","de":"Danke, Herr Doktor.","en":"Thank you, doctor.","ur":"Shukriya, doctor sahab."}]},"A2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Yilmaz. Am Telefon hieß es, Sie fühlen sich seit einer Weile schlapp.","en":"Hello, Mrs Yilmaz. On the phone you said you've felt run-down for a while.","ur":"Salam, Frau Yilmaz. Phone par kaha tha ke aap kuch arse se nidhaal hain."},{"s":"B","de":"Genau. Ich bin ständig müde, obwohl ich früh ins Bett gehe.","en":"Exactly. I'm constantly tired, even though I go to bed early.","ur":"Bilkul. Main hamesha thaki rehti hoon, chahe jaldi so jaoon."},{"s":"A","de":"Sind Sie auch tagsüber erschöpft, oder nur morgens?","en":"Are you exhausted during the day too, or only in the mornings?","ur":"Kya din bhar bhi thakan hoti hai, ya sirf subh?"},{"s":"B","de":"Den ganzen Tag. Manchmal ist mir sogar schwindelig, wenn ich aufstehe.","en":"The whole day. Sometimes I even feel dizzy when I stand up.","ur":"Poora din. Kabhi to uthte waqt chakkar bhi aata hai."},{"s":"A","de":"Hat sich in Ihrem Leben etwas verändert? Mehr Stress bei der Arbeit oder zu Hause?","en":"Has something changed in your life? More stress at work or at home?","ur":"Kya aap ki zindagi mein kuch badla? Kaam ya ghar par zyada stress?"},{"s":"B","de":"Auf der Arbeit ist gerade sehr viel los, und ich schlafe schlecht.","en":"There's a lot going on at work right now, and I sleep badly.","ur":"Kaam par is waqt bohat kuch chal raha hai, aur main buri tarah soti hoon."},{"s":"A","de":"Trinken Sie genug und essen Sie regelmäßig?","en":"Do you drink enough and eat regularly?","ur":"Kya aap kaafi peeti hain aur waqt par khati hain?"},{"s":"B","de":"Ehrlich gesagt vergesse ich das oft, weil ich viel zu tun habe.","en":"To be honest I often forget, because I have a lot to do.","ur":"Sach kahoon to aksar bhool jati hoon, kyunke bohat kaam hota hai."},{"s":"A","de":"Das kann schon eine Rolle spielen. Trotzdem messe ich den Blutdruck und nehme Blut ab.","en":"That can already play a role. Still, I'll measure your blood pressure and take blood.","ur":"Yeh bhi asar dal sakta hai. Phir bhi main blood pressure naapta hoon aur khoon leta hoon."},{"s":"B","de":"Wonach schauen Sie im Blut?","en":"What are you looking for in the blood?","ur":"Khoon mein aap kya dekhte hain?"},{"s":"A","de":"Vor allem Eisen, den Blutzucker und die Schilddrüse. Das sind häufige Ursachen für Müdigkeit.","en":"Mainly iron, blood sugar and the thyroid. Those are common causes of tiredness.","ur":"Khaas kar loha, sugar aur thyroid. Yeh thakan ki aam wajahat hain."},{"s":"B","de":"Und wenn alles normal ist?","en":"And if everything is normal?","ur":"Aur agar sab normal ho?"},{"s":"A","de":"Dann liegt es wahrscheinlich am Stress und am Schlaf. Daran können wir dann gezielt arbeiten.","en":"Then it's probably the stress and sleep. We can then work on that specifically.","ur":"To ghaliban stress aur neend ki wajah se hai. Phir hum us par kaam kar sakte hain."},{"s":"B","de":"Wann bekomme ich die Ergebnisse?","en":"When do I get the results?","ur":"Nateeje kab milenge?"},{"s":"A","de":"In zwei bis drei Tagen. Die Praxis ruft Sie an oder Sie kommen kurz vorbei.","en":"In two to three days. The practice will call you or you drop by briefly.","ur":"Do teen din mein. Clinic aap ko phone karega ya aap aa jayein."},{"s":"B","de":"Gut, danke für die Erklärung.","en":"Good, thank you for the explanation.","ur":"Acha, wazahat ka shukriya."}]},"B1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Setzen Sie sich, Frau Yilmaz. Erzählen Sie mir in Ruhe, was los ist.","en":"Have a seat, Mrs Yilmaz. Tell me calmly what's going on.","ur":"Baith jayein, Frau Yilmaz. Itminan se batayein ke kya masla hai."},{"s":"B","de":"Ich schleppe mich seit Wochen durch den Tag. Selbst kleine Dinge strengen mich an.","en":"I've been dragging myself through the day for weeks. Even small things exhaust me.","ur":"Kai hafton se main mushkil se din guzarti hoon. Chhoti cheezein bhi thaka deti hain."},{"s":"A","de":"Ist die Erschöpfung eher körperlich, oder fühlen Sie sich auch niedergeschlagen?","en":"Is the exhaustion more physical, or do you also feel low?","ur":"Thakan zyada jismani hai, ya aap dil bhi udaas mehsoos karti hain?"},{"s":"B","de":"Beides, glaube ich. Ich habe zu nichts mehr Lust und bin schnell gereizt.","en":"Both, I think. I don't feel like doing anything anymore and I get irritable quickly.","ur":"Dono, mere khayal mein. Kisi cheez ka dil nahi karta aur jaldi chirh jati hoon."},{"s":"A","de":"Das nehme ich ernst. Solche Beschwerden können körperliche Ursachen haben, aber auch mit der Psyche zusammenhängen.","en":"I take that seriously. Such symptoms can have physical causes, but can also be linked to mental health.","ur":"Main isay sanjidgi se leta hoon. Aisi takleef ki jismani wajah bhi ho sakti hai aur zehni bhi."},{"s":"B","de":"Ich hätte lieber eine körperliche Erklärung, ehrlich gesagt.","en":"I'd honestly prefer a physical explanation.","ur":"Sach kahoon to mujhe jismani wajah zyada pasand hogi."},{"s":"A","de":"Das verstehe ich, aber wir sollten beides im Blick behalten. Zuerst schließe ich körperliche Ursachen aus.","en":"I understand, but we should keep an eye on both. First I'll rule out physical causes.","ur":"Samajhta hoon, lekin dono par nazar rakhni chahiye. Pehle main jismani wajahat khaarij karta hoon."},{"s":"B","de":"Was heißt das konkret?","en":"What does that mean concretely?","ur":"Is ka amli matlab kya hai?"},{"s":"A","de":"Blutabnahme, Blutdruck, und ein paar Fragen zum Schlaf und zur Stimmung. Danach sehen wir weiter.","en":"A blood test, blood pressure, and a few questions about sleep and mood. Then we'll see.","ur":"Khoon ka test, blood pressure, aur neend aur mizaj ke kuch sawal. Phir aage dekhte hain."},{"s":"B","de":"Und falls im Blut nichts gefunden wird?","en":"And if nothing is found in the blood?","ur":"Aur agar khoon mein kuch na mile?"},{"s":"A","de":"Dann reden wir offen über Stress, Schlaf und mögliche Unterstützung. Das ist kein Zeichen von Schwäche.","en":"Then we'll talk openly about stress, sleep and possible support. That's not a sign of weakness.","ur":"To hum khul kar stress, neend aur mumkin madad par baat karenge. Yeh kamzori ki alamat nahi."},{"s":"B","de":"Das zu hören tut gut. Ich dachte, ich müsste einfach durchhalten.","en":"It's good to hear that. I thought I just had to push through.","ur":"Yeh sun kar tasalli hui. Main samjhti thi ke bas bardasht karna hai."},{"s":"A","de":"Durchhalten allein hilft selten. Führen Sie bis nächste Woche ein kleines Tagebuch: Schlaf, Essen, Stimmung.","en":"Pushing through alone rarely helps. Keep a small diary until next week: sleep, food, mood.","ur":"Sirf bardasht karna kam hi madad karta hai. Agle hafte tak ek chhoti diary rakhein: neend, khana, mizaj."},{"s":"B","de":"Das mache ich. Wie schnell habe ich die Blutergebnisse?","en":"I'll do that. How soon will I have the blood results?","ur":"Zaroor. Khoon ke nateeje kitni jaldi milenge?"},{"s":"A","de":"In wenigen Tagen. Wenn etwas Auffälliges dabei ist, melde ich mich sofort bei Ihnen.","en":"In a few days. If there's anything abnormal, I'll contact you immediately.","ur":"Chand din mein. Agar koi ghair mamooli baat hui to main foran rabta karoonga."},{"s":"B","de":"Vielen Dank, dass Sie sich Zeit genommen haben.","en":"Thank you for taking the time.","ur":"Waqt dene ka bohat shukriya."}]},"B2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Frau Yilmaz, Sie sagten am Empfang, die Müdigkeit halte schon länger an. Ordnen wir das mal ein.","en":"Mrs Yilmaz, you said at reception the tiredness has lasted a while now. Let's put it in context.","ur":"Frau Yilmaz, aap ne reception par kaha ke thakan kaafi arse se hai. Isay tarteeb se dekhte hain."},{"s":"B","de":"Es ist schwer zu greifen. Ich funktioniere, aber ich bin nie richtig erholt, egal wie viel ich schlafe.","en":"It's hard to pin down. I function, but I'm never properly rested, no matter how much I sleep.","ur":"Isay samajhna mushkil hai. Main kaam kar leti hoon, lekin kabhi poori tarah taaza nahi hoti, chahe kitna bhi soun."},{"s":"A","de":"Nicht erholsamer Schlaf ist ein wichtiger Hinweis. Schnarchen Sie, oder wurde Ihnen gesagt, dass Sie im Schlaf Atemaussetzer haben?","en":"Non-restorative sleep is an important clue. Do you snore, or have you been told you have breathing pauses in your sleep?","ur":"Aisi neend jo taazgi na de ahem ishara hai. Kya aap kharraatay leti hain, ya kisi ne kaha ke neend mein saans rukti hai?"},{"s":"B","de":"Mein Mann sagt, ich schnarche und setze manchmal kurz aus. Ich dachte, das sei normal.","en":"My husband says I snore and sometimes stop briefly. I thought that was normal.","ur":"Mere shohar kehte hain main kharraatay leti hoon aur kabhi saans ruk jati hai. Main samjhti thi yeh normal hai."},{"s":"A","de":"Das ist es nicht unbedingt. Atemaussetzer im Schlaf können die Erholung massiv stören und tagsüber müde machen.","en":"It isn't necessarily. Breathing pauses in sleep can severely disturb recovery and cause daytime tiredness.","ur":"Zaroori nahi. Neend mein saans rukna aaram ko buri tarah kharab kar sakta hai aur din mein thaka deta hai."},{"s":"B","de":"Heißt das, meine Erschöpfung kommt vielleicht gar nicht vom Stress, sondern vom Schlaf selbst?","en":"Does that mean my exhau
