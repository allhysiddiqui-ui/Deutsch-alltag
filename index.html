w.","ur":"Kahein sirf bukhar ka syrup jo woh pehle bhi le chuka hai, aur kuch naya nahi."},"options":["Nur Fiebersaft, den er schon oft bekommen hat. Sonst nichts Neues.","Nur Fiebersaft. Sonst nichts Neues."],"fallback":"Ein neues Medikament? Ein neues Lebensmittel?","accept":[{"kw":["fiebersaft","nichts"],"next":"n5"},{"kw":["fiebersaft"],"next":"n5"},{"kw":["nichts"],"next":"n5"}]},"n5":{"say":"Die Flecken sind blass und verschwinden, wenn ich draufdrücke.","goal":{"en":"Ask whether that is a good or a bad sign.","ur":"Poochein ke yeh acha ishara hai ya bura."},"options":["Ist das ein gutes oder ein schlechtes Zeichen?","Ist das gut oder schlecht?"],"fallback":"Möchten Sie wissen, was das bedeutet?","accept":[{"kw":["gutes","zeichen"],"next":"n6"},{"kw":["zeichen"],"next":"n6"},{"kw":["gut"],"next":"n6"}]},"n6":{"say":"Ein gutes. Flecken, die beim Drücken bleiben, wären ein Warnzeichen. Dahinter steckt hier ein Virus.","goal":{"en":"Ask whether you need an antibiotic then.","ur":"Poochein ke kya phir antibiotic chahiye."},"options":["Brauchen wir dann ein Antibiotikum?","Also brauchen wir kein Antibiotikum?"],"fallback":"Haben Sie eine Frage zur Behandlung?","accept":[{"kw":["antibiotikum"],"next":"n7"},{"kw":["antibiotika"],"next":"n7"}]},"n7":{"say":"Nein, Antibiotika wirken gegen Viren überhaupt nicht. Gegen das Jucken gebe ich Ihnen eine Lotion mit.","goal":{"en":"Ask whether he is allowed back at daycare.","ur":"Poochein ke kya woh dobara kita ja sakta hai."},"options":["Darf er wieder in die Kita?","Wann darf er wieder in die Kita?"],"fallback":"Noch eine Frage?","accept":[{"kw":["kita"],"reply":"Sobald er vierundzwanzig Stunden fieberfrei ist, ja. Gute Besserung!","next":"END"},{"kw":["darf"],"reply":"Sobald er vierundzwanzig Stunden fieberfrei ist, ja. Gute Besserung!","next":"END"}]}}}}},{"id":"impfung","order":4,"icon":"💉","title":{"de":"Vorsorge und Impfung","en":"Check-up and vaccination","ur":"Check-up aur teeka"},"angle":"The U check-up, measuring, and the vaccination · U check-up, napna aur teeka","words":["impfung","impfpass","gesund","größe","wiegen","spritze","nebenwirkung","masern","aufklärung","einwilligung"],"dialogues":{"A1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag. Heute ist die U8. Wie geht es Yusuf?","en":"Hello. Today is the U8 check-up. How is Yusuf?","ur":"Salam. Aaj U8 check-up hai. Yusuf kaisa hai?"},{"s":"B","de":"Gut. Er ist gesund.","en":"Good. He is healthy.","ur":"Acha. Woh theek hai."},{"s":"A","de":"Zuerst messen wir Größe und Gewicht.","en":"First we measure height and weight.","ur":"Pehle hum qad aur wazan naapte hain."},{"s":"B","de":"Yusuf, stell dich bitte hierhin.","en":"Yusuf, please stand here.","ur":"Yusuf, yahan khare ho jao."},{"s":"A","de":"Er ist einen Meter groß und wiegt siebzehn Kilo.","en":"He is one metre tall and weighs seventeen kilos.","ur":"Woh ek meter lamba hai aur sattarah kilo ka hai."},{"s":"B","de":"Ist das normal?","en":"Is that normal?","ur":"Kya yeh normal hai?"},{"s":"A","de":"Ja, das ist sehr gut.","en":"Yes, that is very good.","ur":"Ji haan, yeh bohat acha hai."},{"s":"A","de":"Yusuf, kannst du auf einem Bein stehen?","en":"Yusuf, can you stand on one leg?","ur":"Yusuf, kya tum ek taang par khare ho sakte ho?"},{"s":"B","de":"Ja, das kann er gut.","en":"Yes, he can do that well.","ur":"Ji haan, woh yeh acha kar leta hai."},{"s":"A","de":"Sehr schön. Jetzt kommt die Impfung.","en":"Very nice. Now comes the vaccination.","ur":"Bohat khoob. Ab teeka lagega."},{"s":"B","de":"Tut das weh?","en":"Does that hurt?","ur":"Kya is se dard hoga?"},{"s":"A","de":"Nur ganz kurz. Wie ein kleiner Piks.","en":"Only very briefly. Like a small prick.","ur":"Sirf thori dair. Ek chhoti si chubhan jaisa."},{"s":"B","de":"Yusuf, halt bitte den Arm still.","en":"Yusuf, please keep your arm still.","ur":"Yusuf, baazu ko sakit rakho."},{"s":"A","de":"Fertig! Du warst sehr tapfer.","en":"Done! You were very brave.","ur":"Ho gaya! Tum bohat bahadur ho."},{"s":"B","de":"Braucht er heute noch etwas?","en":"Does he need anything else today?","ur":"Kya aaj usay aur kuch chahiye?"},{"s":"A","de":"Nein. Der nächste Termin ist in zwei Jahren.","en":"No. The next appointment is in two years.","ur":"Nahi. Agla appointment do saal baad hai."},{"s":"B","de":"Vielen Dank, Herr Doktor.","en":"Thank you very much, doctor.","ur":"Bohat shukriya, doctor sahab."}]},"A2":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Khan. Haben Sie den Impfpass und das Untersuchungsheft dabei?","en":"Hello, Mrs Khan. Do you have the vaccination record and the check-up booklet with you?","ur":"Salam, Frau Khan. Kya teeka card aur check-up copy saath hai?"},{"s":"B","de":"Ja, beides. Hier bitte.","en":"Yes, both. Here you are.","ur":"Ji haan, dono. Yeh lijiye."},{"s":"A","de":"Danke. Bei der U8 prüfen wir Sehen, Hören, Sprache und Bewegung.","en":"Thank you. At the U8 we check vision, hearing, speech and movement.","ur":"Shukriya. U8 mein hum nazar, sunna, bolna aur harkat dekhte hain."},{"s":"B","de":"Beim Sehen bin ich nicht sicher. Er sitzt sehr nah vor dem Fernseher.","en":"About the vision I'm not sure. He sits very close to the television.","ur":"Nazar ke baare mein mujhe yaqeen nahi. Woh TV ke bohat qareeb baithta hai."},{"s":"A","de":"Gut, dass Sie das sagen. Wir machen gleich einen Sehtest.","en":"Good that you say that. We'll do an eye test right away.","ur":"Acha hua aap ne bataya. Hum abhi nazar ka test karte hain."},{"s":"B","de":"Und wenn er die Bilder nicht erkennt?","en":"And if he doesn't recognise the pictures?","ur":"Aur agar woh tasveerein na pehchane?"},{"s":"A","de":"Dann schicke ich Sie zum Augenarzt. Das ist in diesem Alter ganz normal.","en":"Then I'll send you to the eye doctor. That is completely normal at this age.","ur":"To main aap ko aankhon ke doctor ke paas bhej doonga. Is umar mein yeh aam hai."},{"s":"B","de":"Verstanden. Und die Sprache? Er mischt Deutsch und Urdu.","en":"Understood. And speech? He mixes German and Urdu.","ur":"Samajh gayi. Aur bolna? Woh German aur Urdu mila deta hai."},{"s":"A","de":"Das ist kein Problem, sondern ein Vorteil. Zweisprachige Kinder machen das fast alle.","en":"That is not a problem but an advantage. Almost all bilingual children do that.","ur":"Yeh masla nahi balke faida hai. Do zabanon wale bachay tqreeban sab yehi karte hain."},{"s":"B","de":"Das beruhigt mich. In der Kita hat man mir gesagt, ich soll zu Hause nur Deutsch sprechen.","en":"That reassures me. At daycare I was told I should only speak German at home.","ur":"Is se tasalli hui. Kita mein mujhe kaha gaya ke ghar par sirf German bolein."},{"s":"A","de":"Das ist ein alter Rat und er stimmt nicht. Sprechen Sie zu Hause die Sprache, die Sie am besten können.","en":"That is old advice and it isn't correct. At home speak the language you know best.","ur":"Yeh purani baat hai aur theek nahi. Ghar par wohi zaban bolein jo aap sab se behtar jaanti hain."},{"s":"B","de":"Das mache ich gern. Und heute steht auch eine Impfung an, oder?","en":"I'll gladly do that. And there is also a vaccination due today, right?","ur":"Yeh main khushi se karoongi. Aur aaj teeka bhi hai, na?"},{"s":"A","de":"Genau, die Auffrischung gegen Masern, Mumps und Röteln.","en":"Exactly, the booster against measles, mumps and rubella.","ur":"Bilkul, khasra, kanpere aur rubella ka booster."},{"s":"B","de":"Kann er danach Fieber bekommen?","en":"Can he get a fever afterwards?","ur":"Kya us ke baad bukhar ho sakta hai?"},{"s":"A","de":"Manche Kinder bekommen nach einer Woche leichtes Fieber. Das ist normal und geht von allein weg.","en":"Some children get a slight fever after a week. That is normal and goes away by itself.","ur":"Kuch bachon ko ek hafte baad halka bukhar hota hai. Yeh normal hai aur khud theek ho jata hai."},{"s":"B","de":"Soll ich ihm dann Fiebersaft geben?","en":"Should I give him fever syrup then?","ur":"To kya main usay bukhar ka syrup doon?"},{"s":"A","de":"Nur wenn er sich unwohl fühlt. Nicht vorbeugend.","en":"Only if he feels unwell. Not as a precaution.","ur":"Sirf agar usay takleef ho. Pehle se nahi."},{"s":"B","de":"Alles klar. Dann machen wir das so.","en":"All right. Then we'll do it that way.","ur":"Theek hai. To hum aisa hi karte hain."}]},"B1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Heute wäre die zweite Masernimpfung dran. Haben Sie dazu noch Fragen?","en":"Today the second measles vaccination would be due. Do you have any questions about it?","ur":"Aaj khasre ka doosra teeka hai. Kya is baare mein koi sawal hai?"},{"s":"B","de":"Ehrlich gesagt bin ich unsicher. In einer Gruppe im Internet steht, dass die Impfung zu früh kommt.","en":"To be honest I'm unsure. In a group on the internet it says the vaccination comes too early.","ur":"Sach kahoon to mujhe shak hai. Internet ke ek group mein likha hai ke teeka bohat jaldi lagta hai."},{"s":"A","de":"Ich verstehe die Verunsicherung. Wichtig ist, woher die Information kommt und ob sie überprüfbar ist.","en":"I understand the uncertainty. What matters is where the information comes from and whether it can be checked.","ur":"Main pareshani samajhta hoon. Ahem yeh hai ke maloomat kahan se aayi aur kya us ki tasdeeq ho sakti hai."},{"s":"B","de":"Woran erkenne ich denn, ob eine Quelle seriös ist?","en":"How do I recognise whether a source is reliable?","ur":"Mujhe kaise pata chale ke maloomat qabil-e-aitbaar hai?"},{"s":"A","de":"Seriöse Stellen nennen ihre Daten und ihre Zweifel. Wer nur Angst macht und nichts belegt, will meist etwas verkaufen.","en":"Reliable sources name their data and their doubts. Whoever only creates fear and proves nothing usually wants to sell something.","ur":"Qabil-e-aitbaar log apna data aur apne shukook batate hain. Jo sirf darata hai aur saboot nahi deta woh aksar kuch bechna chahta hai."},{"s":"B","de":"Das leuchtet mir ein. Trotzdem: Was passiert im schlimmsten Fall nach der Impfung?","en":"That makes sense to me. Still: what happens in the worst case after the vaccination?","ur":"Yeh baat samajh aati hai. Phir bhi: teeke ke baad bad tareen soorat mein kya hota hai?"},{"s":"A","de":"Bei etwa fünf von hundert Kindern kommt es zu Fieber und einem leichten Ausschlag, meist in der zweiten Woche.","en":"In about five out of a hundred children fever and a mild rash occur, usually in the second week.","ur":"Taqreeban har sau mein se paanch bachon ko bukhar aur halke dane hote hain, aksar doosre hafte."},{"s":"B","de":"Und wirklich schwere Reaktionen?","en":"And really severe reactions?","ur":"Aur waqai sangeen rad-e-amal?"},{"s":"A","de":"Die sind sehr selten, in der Größenordnung von eins zu einer Million. Eine echte Masernerkrankung ist um ein Vielfaches gefährlicher.","en":"Those are very rare, in the order of one in a million. An actual measles infection is many times more dangerous.","ur":"Woh bohat kam hain, das lakh mein ek jitna. Asli khasra kai guna zyada khatarnak hai."},{"s":"B","de":"Wie gefährlich ist Masern denn heute noch? Man hört ja kaum davon.","en":"How dangerous are measles nowadays? You hardly hear about them.","ur":"Aaj kal khasra kitna khatarnak hai? Sunne mein bohat kam aata hai."},{"s":"A","de":"Genau deshalb hört man wenig davon: weil fast alle geimpft sind. Sobald die Impfquote sinkt, kommen die Ausbrüche zurück.","en":"That is exactly why you hear little about it: because almost everyone is vaccinated. As soon as the vaccination rate falls, the outbreaks come back.","ur":"Isi liye kam sunte hain: kyunke taqreeban sab ko teeka laga hai. Jaise hi teeke kam hon, beemari wapis aa jati hai."},{"s":"B","de":"Das habe ich so noch nie gehört. Es gibt in Deutschland doch auch eine Pflicht, oder?","en":"I've never heard it put that way. There is also an obligation in Germany, isn't there?","ur":"Main ne yeh is tarah kabhi nahi suna. Germany mein is ki pabandi bhi hai, na?"},{"s":"A","de":"Für Masern ja. Kinder in der Kita müssen den Schutz nachweisen. Ohne Nachweis kann die Einrichtung Ihr Kind ablehnen.","en":"For measles yes. Children at daycare have to prove protection. Without proof the facility can turn your child away.","ur":"Khasre ke liye haan. Kita ke bachon ko saboot dena hota hai. Baghair saboot ke idara bache ko mana kar sakta hai."},{"s":"B","de":"Das wusste ich nicht. Dann machen wir die Impfung heute.","en":"I didn't know that. Then let's do the vaccination today.","ur":"Yeh mujhe nahi pata tha. To hum aaj teeka laga dete hain."},{"s":"A","de":"Ich lege Ihnen trotzdem den Aufklärungsbogen vor. Lesen Sie ihn in Ruhe, ich habe Zeit.","en":"I'll still give you the information sheet. Read it calmly, I have time.","ur":"Phir bhi main aap ko maloomati form deta hoon. Itminan se parhein, mere paas waqt hai."},{"s":"B","de":"Danke, dass Sie mich nicht gedrängt haben.","en":"Thank you for not pushing me.","ur":"Shukriya ke aap ne dabao nahi dala."},{"s":"A","de":"Eine Entscheidung, die man versteht, hält länger als eine, zu der man überredet wurde.","en":"A decision you understand lasts longer than one you were talked into.","ur":"Jo faisla samajh kar kiya jaye woh us se behtar hai jo baaton mein aa kar kiya jaye."},{"s":"B","de":"Da haben Sie recht. Ich unterschreibe.","en":"You're right there. I'll sign.","ur":"Aap theek kehte hain. Main dastakhat karti hoon."}]},"B2":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Bevor wir impfen, muss ich Sie formal aufklären. Das ist keine Formalität, sondern Ihre Grundlage für die Einwilligung.","en":"Before we vaccinate I have to inform you formally. That is not a formality but the basis for your consent.","ur":"Teeke se pehle mujhe aap ko baqaida maloomat deni hain. Yeh sirf rasm nahi balke aap ki ijazat ki bunyaad hai."},{"s":"B","de":"Gut. Mich interessiert vor allem, wie Sie den Nutzen gegen das Risiko abwägen.","en":"Good. What interests me above all is how you weigh the benefit against the risk.","ur":"Acha. Mujhe sab se zyada yeh jan-na hai ke aap faide aur nuqsan ka moazna kaise karte hain."},{"s":"A","de":"Nüchtern gesagt: Der Nutzen ist gut belegt, die Risiken sind quantifiziert und beide stehen in keinem Verhältnis zueinander.","en":"Put soberly: the benefit is well documented, the risks are quantified, and the two are in no proportion to each other.","ur":"Saaf kahoon: faida saabit shuda hai, khatrat ginay ja chuke hain, aur dono ka koi moazna hi nahi banta."},{"s":"B","de":"Können Sie das an Zahlen festmachen? Ich arbeite selbst mit Statistik und Prozentangaben helfen mir mehr als Beruhigung.","en":"Can you pin that down in numbers? I work with statistics myself, and percentages help me more than reassurance.","ur":"Kya aap yeh numbers mein bata sakte hain? Main khud statistics mein kaam karti hoon, mujhe percentage tasalli se zyada madad deti hai."},{"s":"A","de":"Sehr gern. Bei Masern erkrankt eines von tausend Kindern an einer Gehirnentzündung, und ein Teil davon behält bleibende Schäden.","en":"Gladly. With measles, one in a thousand children develops encephalitis, and some of them retain permanent damage.","ur":"Zaroor. Khasre mein har hazaar mein se ek bache ko dimagh ki sozish hoti hai, aur un mein se kuch ko mustaqil nuqsan reh jata hai."},{"s":"B","de":"Und auf der anderen Seite?","en":"And on the other side?","ur":"Aur doosri taraf?"},{"s":"A","de":"Auf der Impfseite reden wir bei den schweren Ereignissen über einen Fall pro einer Million Dosen. Der Faktor liegt also bei etwa tausend.","en":"On the vaccine side, for severe events we are talking about one case per million doses. So the factor is around a thousand.","ur":"Teeke ki taraf sangeen waqiat das lakh khurakon mein ek hote hain. Yani farq taqreeban ek hazaar guna hai."},{"s":"B","de":"Das ist deutlich. Wie sicher sind diese Zahlen, gerade bei seltenen Ereignissen?","en":"That is clear. How reliable are these numbers, especially for rare events?","ur":"Yeh saaf hai. Yeh numbers kitne pukhta hain, khaas kar kam hone wale waqiat mein?"},{"s":"A","de":"Bei seltenen Ereignissen wird die Unsicherheit naturgemäß größer, deshalb werden Verdachtsfälle bundesweit erfasst und veröffentlicht.","en":"With rare events the uncertainty naturally becomes larger, which is why suspected cases are recorded and published nationwide.","ur":"Kam hone wale waqiat mein ghair yaqeeni surat qudrati tor par barh jati hai, isi liye shubah wale case poore mulk mein darj aur shaya kiye jate hain."},{"s":"B","de":"Das heißt, es gibt eine Stelle, an die Sie melden müssten, wenn bei Yusuf etwas auffällt?","en":"That means there is an office you would have to report to if something unusual happened with Yusuf?","ur":"Yani ek idara hai jise aap ko ittila deni hogi agar Yusuf mein kuch ghair mamooli ho?"},{"s":"A","de":"Genau, und ich würde es auch tun. Das gehört zum System dazu, sonst wären die Zahlen wertlos.","en":"Exactly, and I would do it too. That is part of the system, otherwise the numbers would be worthless.","ur":"Bilkul, aur main aisa karoonga bhi. Yeh nizam ka hissa hai, warna numbers bekaar hote."},{"s":"B","de":"Eine letzte Frage: Yusuf hatte vor drei Tagen leichten Schnupfen. Spricht das gegen den Termin heute?","en":"One last question: Yusuf had a slight runny nose three days ago. Does that speak against today's appointment?","ur":"Aakhri sawal: Yusuf ko teen din pehle halka zukam tha. Kya is wajah se aaj ka waqt theek nahi?"},{"s":"A","de":"Ein banaler Infekt ohne Fieber ist kein Hinderungsgrund. Wir verschieben nur bei akuten, fieberhaften Erkrankungen.","en":"A trivial infection without fever is no reason to postpone. We only postpone with acute, feverish illnesses.","ur":"Halka infection baghair bukhar ke rukawat nahi. Hum sirf tez bukhar wali beemari mein taal dete hain."},{"s":"B","de":"Dann ist alles geklärt. Ich unterschreibe die Einwilligung.","en":"Then everything is clarified. I'll sign the consent.","ur":"To sab baat saaf ho gayi. Main ijazat par dastakhat karti hoon."},{"s":"A","de":"Danke für das offene Gespräch. Ehrlich gesagt sind mir kritische Eltern lieber als gleichgültige.","en":"Thank you for the open conversation. To be honest I prefer critical parents to indifferent ones.","ur":"Khuli guftagu ka shukriya. Sach kahoon to mujhe sawal karne wale walidain la-taalluq walidain se behtar lagte hain."},{"s":"B","de":"Das höre ich zum ersten Mal von einem Arzt.","en":"That's the first time I've heard that from a doctor.","ur":"Yeh main ne kisi doctor se pehli baar suna hai."},{"s":"A","de":"Dann haben Sie bisher die falschen Ärzte getroffen. So, Yusuf, jetzt der Arm — es zwickt einmal kurz.","en":"Then you have met the wrong doctors so far. Right, Yusuf, now the arm — it will pinch once, briefly.","ur":"To ab tak aap ghalat doctors se mile hain. Acha Yusuf, ab baazu — ek dafa halki si chubhan hogi."},{"s":"B","de":"Er hat gar nicht geweint. Das hätte ich nicht gedacht.","en":"He didn't cry at all. I wouldn't have thought that.","ur":"Woh bilkul nahi roya. Main ne yeh socha bhi nahi tha."}]}},"roleplay":{"easy":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Yusuf hat heute die U8 und bekommt eine Impfung.","en":"Yusuf has his U8 check-up today and gets a vaccination.","ur":"Aaj Yusuf ka U8 check-up hai aur teeka bhi lagega."},"start":"n1","nodes":{"n1":{"say":"Guten Tag. Heute ist die U8. Wie geht es Yusuf?","goal":{"en":"Say he is well / healthy.","ur":"Kahein ke woh theek aur sehatmand hai."},"options":["Gut. Er ist gesund.","Es geht ihm gut. Er ist gesund."],"fallback":"Wie geht es ihm denn?","accept":[{"kw":["gut","gesund"],"next":"n2"},{"kw":["gesund"],"next":"n2"},{"kw":["gut"],"next":"n2"}]},"n2":{"say":"Zuerst messen wir Größe und Gewicht. Er ist einen Meter groß und wiegt siebzehn Kilo.","goal":{"en":"Ask whether that is normal.","ur":"Poochein ke kya yeh normal hai."},"options":["Ist das normal?","Ist das normal für sein Alter?"],"fallback":"Haben Sie eine Frage dazu?","accept":[{"kw":["normal"],"next":"n3"}]},"n3":{"say":"Ja, das ist sehr gut. Jetzt kommt die Impfung.","goal":{"en":"Ask whether it hurts.","ur":"Poochein ke kya is se dard hoga."},"options":["Tut das weh?","Tut die Impfung weh?"],"fallback":"Möchten Sie etwas fragen?","accept":[{"kw":["weh"],"next":"n4"},{"kw":["tut"],"next":"n4"}]},"n4":{"say":"Nur ganz kurz, wie ein kleiner Piks. — Fertig! Er war sehr tapfer.","goal":{"en":"Ask whether he needs anything else today.","ur":"Poochein ke kya aaj usay aur kuch chahiye."},"options":["Braucht er heute noch etwas?","Müssen wir heute noch etwas machen?"],"fallback":"Noch eine Frage?","accept":[{"kw":["braucht","etwas"],"next":"n5"},{"kw":["etwas"],"next":"n5"}]},"n5":{"say":"Nein. Der nächste Termin ist in zwei Jahren.","goal":{"en":"Thank the doctor and say goodbye.","ur":"Doctor ka shukriya karein aur khuda hafiz kahein."},"options":["Vielen Dank, Herr Doktor. Auf Wiedersehen.","Danke schön. Auf Wiedersehen."],"fallback":"Alles klar so weit?","accept":[{"kw":["danke","wiedersehen"],"reply":"Auf Wiedersehen, Frau Khan. Bis zum nächsten Mal!","next":"END"},{"kw":["danke"],"reply":"Auf Wiedersehen, Frau Khan!","next":"END"}]}}},"hard":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Die zweite Masernimpfung steht an. Sie sind unsicher und möchten Fragen stellen.","en":"The second measles vaccination is due. You are unsure and want to ask questions.","ur":"Khasre ka doosra teeka hai. Aap ko shak hai aur aap sawal poochna chahti hain."},"start":"n1","nodes":{"n1":{"say":"Heute wäre die zweite Masernimpfung dran. Haben Sie dazu noch Fragen?","goal":{"en":"Say honestly that you are unsure, because you read something on the internet.","ur":"Sach batayein ke aap ko shak hai kyunke aap ne internet par kuch parha."},"options":["Ehrlich gesagt bin ich unsicher. Im Internet steht etwas anderes.","Ich bin unsicher. Im Internet habe ich etwas anderes gelesen."],"fallback":"Gibt es etwas, das Sie beschäftigt?","accept":[{"kw":["unsicher","internet"],"next":"n2"},{"kw":["unsicher"],"next":"n2"},{"kw":["internet"],"next":"n2"}]},"n2":{"say":"Ich verstehe die Verunsicherung. Wichtig ist, woher die Information kommt und ob sie überprüfbar ist.","goal":{"en":"Ask how you can recognise whether a source is reliable.","ur":"Poochein ke qabil-e-aitbaar maloomat kaise pehchanein."},"options":["Woran erkenne ich, ob eine Quelle seriös ist?","Wie erkenne ich eine seriöse Quelle?"],"fallback":"Was genau möchten Sie wissen?","accept":[{"kw":["quelle","seriös"],"next":"n3"},{"kw":["erkenne"],"next":"n3"},{"kw":["quelle"],"next":"n3"}]},"n3":{"say":"Seriöse Stellen nennen ihre Daten und ihre Zweifel. Wer nur Angst macht und nichts belegt, will meist etwas verkaufen.","goal":{"en":"Ask what happens in the worst case after the vaccination.","ur":"Poochein ke teeke ke baad bad tareen soorat mein kya hota hai."},"options":["Was passiert im schlimmsten Fall nach der Impfung?","Was kann im schlimmsten Fall passieren?"],"fallback":"Möchten Sie über die Risiken sprechen?","accept":[{"kw":["schlimmsten","fall"],"next":"n4"},{"kw":["passiert"],"next":"n4"},{"kw":["risiko"],"next":"n4"}]},"n4":{"say":"Bei etwa fünf von hundert Kindern kommt es zu Fieber und einem leichten Ausschlag. Schwere Reaktionen liegen bei eins zu einer Million.","goal":{"en":"Ask how dangerous measles actually still is today.","ur":"Poochein ke khasra aaj kal waqai kitna khatarnak hai."},"options":["Wie gefährlich ist Masern denn heute noch?","Wie gefährlich sind Masern heute?"],"fallback":"Haben Sie noch eine Frage?","accept":[{"kw":["gefährlich","masern"],"next":"n5"},{"kw":["gefährlich"],"next":"n5"},{"kw":["masern"],"next":"n5"}]},"n5":{"say":"Genau deshalb hört man wenig davon: weil fast alle geimpft sind. Sobald die Impfquote sinkt, kommen die Ausbrüche zurück.","goal":{"en":"Ask whether there is an obligation in Germany.","ur":"Poochein ke kya Germany mein is ki pabandi hai."},"options":["Gibt es in Deutschland eine Pflicht?","Es gibt doch auch eine Pflicht, oder?"],"fallback":"Noch etwas unklar?","accept":[{"kw":["pflicht"],"next":"n6"},{"kw":["deutschland"],"next":"n6"}]},"n6":{"say":"Für Masern ja. Kinder in der Kita müssen den Schutz nachweisen. Ohne Nachweis kann die Einrichtung Ihr Kind ablehnen.","goal":{"en":"Say you didn't know that and that you'll do the vaccination today.","ur":"Kahein ke aap ko yeh nahi pata tha aur aaj teeka laga lenge."},"options":["Das wusste ich nicht. Dann machen wir die Impfung heute.","Das wusste ich nicht. Wir machen es heute."],"fallback":"Wie möchten Sie entscheiden?","accept":[{"kw":["impfung","heute"],"reply":"Ich lege Ihnen trotzdem den Aufklärungsbogen vor. Lesen Sie ihn in Ruhe.","next":"END"},{"kw":["heute"],"reply":"Gut. Lesen Sie bitte noch den Aufklärungsbogen in Ruhe.","next":"END"}]}}}}},{"id":"rezept","order":5,"icon":"💊","title":{"de":"Rezept und Apotheke","en":"Prescription and pharmacy","ur":"Nuskha aur pharmacy"},"angle":"Dosage, buying the medicine, questions at the pharmacy · Khurak, dawa lena, pharmacy ke sawal","words":["rezept","apotheke","löffel","packung","beipackzettel","kühlschrank","zäpfchen","einnehmen","wechselwirkung","kostenlos"],"dialogues":{"A1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Ich schreibe Ihnen ein Rezept.","en":"I'll write you a prescription.","ur":"Main aap ko nuskha likh deta hoon."},{"s":"B","de":"Was ist das für eine Medizin?","en":"What kind of medicine is that?","ur":"Yeh kaunsi dawa hai?"},{"s":"A","de":"Ein Saft gegen die Schmerzen.","en":"A syrup for the pain.","ur":"Dard ke liye ek syrup."},{"s":"B","de":"Wie oft soll er den Saft nehmen?","en":"How often should he take the syrup?","ur":"Usay syrup kitni baar leni hai?"},{"s":"A","de":"Dreimal am Tag, nach dem Essen.","en":"Three times a day, after meals.","ur":"Din mein teen baar, khane ke baad."},{"s":"B","de":"Wie viel jedes Mal?","en":"How much each time?","ur":"Har baar kitni?"},{"s":"A","de":"Fünf Milliliter. Der Löffel ist in der Packung.","en":"Five millilitres. The spoon is in the packet.","ur":"Paanch millilitre. Chamach dabbe mein hai."},{"s":"B","de":"Und wie lange?","en":"And for how long?","ur":"Aur kitne din?"},{"s":"A","de":"Fünf Tage lang.","en":"For five days.","ur":"Paanch din tak."},{"s":"B","de":"Wo kann ich das kaufen?","en":"Where can I buy that?","ur":"Main yeh kahan se le sakti hoon?"},{"s":"A","de":"In der Apotheke. Sie ist gleich neben der Praxis.","en":"At the pharmacy. It is right next to the practice.","ur":"Pharmacy se. Woh clinic ke bilkul saath hai."},{"s":"B","de":"Muss ich etwas bezahlen?","en":"Do I have to pay anything?","ur":"Kya mujhe kuch paise dene hain?"},{"s":"A","de":"Für Kinder ist das Medikament kostenlos.","en":"For children the medication is free.","ur":"Bachon ke liye dawa muft hai."},{"s":"B","de":"Das ist gut. Vielen Dank.","en":"That's good. Thank you very much.","ur":"Yeh acha hai. Bohat shukriya."},{"s":"A","de":"Gute Besserung, Yusuf!","en":"Get well soon, Yusuf!","ur":"Yusuf, jald theek ho jao!"},{"s":"B","de":"Auf Wiedersehen, Herr Doktor.","en":"Goodbye, doctor.","ur":"Khuda hafiz, doctor sahab."}]},"A2":{"speakers":{"A":"Apothekerin","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"B","de":"Guten Tag. Ich habe ein Rezept für meine Tochter.","en":"Hello. I have a prescription for my daughter.","ur":"Salam. Mere paas apni beti ka nuskha hai."},{"s":"A","de":"Guten Tag. Geben Sie es mir bitte. — Ah, ein Antibiotikum. Wie alt ist Ihre Tochter?","en":"Hello. Please give it to me. — Ah, an antibiotic. How old is your daughter?","ur":"Salam. Meherbani kar ke dijiye. — Acha, antibiotic. Aap ki beti kitne saal ki hai?"},{"s":"B","de":"Sie ist fünf.","en":"She is five.","ur":"Woh paanch saal ki hai."},{"s":"A","de":"Gut. Ich muss den Saft anmischen, das dauert zwei Minuten.","en":"Good. I have to mix the syrup, that takes two minutes.","ur":"Acha. Mujhe syrup banana hoga, do minute lagenge."},{"s":"B","de":"Kein Problem, ich warte.","en":"No problem, I'll wait.","ur":"Koi masla nahi, main intezaar karti hoon."},{"s":"A","de":"So, bitte schön. Wichtig: Die Flasche vor jeder Gabe gut schütteln.","en":"There you go. Important: shake the bottle well before every dose.","ur":"Yeh lijiye. Ahem baat: har khurak se pehle bottle achi tarah hilayein."},{"s":"B","de":"Wie oft muss sie den Saft nehmen?","en":"How often does she have to take the syrup?","ur":"Usay syrup kitni baar leni hai?"},{"s":"A","de":"Zweimal täglich, morgens und abends, jeweils fünf Milliliter.","en":"Twice daily, morning and evening, five millilitres each time.","ur":"Rozana do baar, subh aur sham, har baar paanch millilitre."},{"s":"B","de":"Muss ich den Saft in den Kühlschrank stellen?","en":"Do I have to put the syrup in the fridge?","ur":"Kya syrup fridge mein rakhni hogi?"},{"s":"A","de":"Ja, bei diesem Antibiotikum schon. Und nach zehn Tagen bitte wegwerfen, auch wenn noch etwas übrig ist.","en":"Yes, with this antibiotic you do. And after ten days please throw it away, even if some is left.","ur":"Ji haan, is antibiotic ke liye zaroori hai. Aur das din baad phenk dein, chahe kuch bacha ho."},{"s":"B","de":"Und wenn ich eine Gabe vergesse?","en":"And if I forget a dose?","ur":"Aur agar main koi khurak bhool jaoon?"},{"s":"A","de":"Dann geben Sie sie, sobald es Ihnen einfällt. Aber nie zwei Gaben auf einmal.","en":"Then give it as soon as you remember. But never two doses at once.","ur":"To jaise hi yaad aaye de dein. Lekin do khuraken ek saath kabhi nahi."},{"s":"B","de":"Verstanden. Sie hat auch etwas Fieber. Darf sie zusätzlich Fiebersaft bekommen?","en":"Understood. She also has a bit of a fever. Can she have fever syrup in addition?","ur":"Samajh gayi. Usay thora bukhar bhi hai. Kya sath mein bukhar ka syrup de sakti hoon?"},{"s":"A","de":"Ja, das passt zusammen. Achten Sie nur auf den Abstand von vier Stunden.","en":"Yes, that goes together. Just watch the four-hour gap.","ur":"Ji haan, yeh saath chalta hai. Bas chaar ghante ka waqfa rakhein."},{"s":"B","de":"Kostet das etwas?","en":"Does that cost anything?","ur":"Kya is ke paise lagenge?"},{"s":"A","de":"Das Antibiotikum ist auf Rezept, also frei. Den Fiebersaft müssen Sie selbst zahlen, er kostet vier Euro achtzig.","en":"The antibiotic is on prescription, so free. You have to pay for the fever syrup yourself, it costs four euros eighty.","ur":"Antibiotic nuskhe par hai, is liye muft. Bukhar ka syrup khud lena hoga, woh chaar euro assi cent ka hai."},{"s":"B","de":"Das nehme ich mit. Vielen Dank für die Erklärung.","en":"I'll take that too. Thank you very much for the explanation.","ur":"Woh bhi le loongi. Wazahat ka bohat shukriya."}]},"B1":{"speakers":{"A":"Apotheker","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"B","de":"Guten Tag. Ich hätte gern das hier, und ich habe ein paar Fragen dazu.","en":"Hello. I'd like this, and I have a few questions about it.","ur":"Salam. Mujhe yeh chahiye, aur is baare mein kuch sawal hain."},{"s":"A","de":"Fragen Sie ruhig. Dafür stehe ich hier.","en":"Go ahead and ask. That's what I'm here for.","ur":"Zaroor poochein. Main isi liye yahan hoon."},{"s":"B","de":"Im Beipackzettel steht eine ganze Liste von Nebenwirkungen. Muss ich mir Sorgen machen?","en":"The package insert lists a whole range of side effects. Do I need to worry?","ur":"Dawa ke parche par side effects ki poori list hai. Kya mujhe fikar karni chahiye?"},{"s":"A","de":"Auf dem Zettel steht alles, was jemals gemeldet wurde, auch wenn es nur einmal vorkam. Häufig sind bei diesem Mittel eigentlich nur weicher Stuhl und Bauchgrummeln.","en":"The leaflet lists everything that has ever been reported, even if it happened only once. With this medicine only loose stools and a rumbling tummy are actually common.","ur":"Us parche par woh sab likha hota hai jo kabhi bhi report hua, chahe ek hi baar. Is dawa ke saath asal mein sirf narm pakhana aur pait mein gurgurahat aam hai."},{"s":"B","de":"Das klingt harmloser, als ich befürchtet hatte. Und wenn sie doch Durchfall bekommt?","en":"That sounds more harmless than I feared. And if she does get diarrhoea?","ur":"Yeh us se kam khatarnak lagta hai jitna main dar rahi thi. Aur agar phir bhi dast lag jayein?"},{"s":"A","de":"Solange sie genug trinkt und munter ist, reicht Abwarten. Bei Blut im Stuhl oder starken Schmerzen rufen Sie den Arzt an.","en":"As long as she drinks enough and is lively, waiting is enough. With blood in the stool or severe pain, call the doctor.","ur":"Jab tak woh kaafi peeti rahe aur chust rahe, intezaar kaafi hai. Pakhane mein khoon ya shadeed dard par doctor ko phone karein."},{"s":"B","de":"Gut zu wissen. Eine andere Sache: Muss ich die Packung wirklich zu Ende geben, obwohl es ihr schon besser geht?","en":"Good to know. Another thing: do I really have to finish the packet even though she is already feeling better?","ur":"Acha maloom hua. Ek aur baat: kya mujhe poora course dena hoga jab ke woh pehle hi behtar hai?"},{"s":"A","de":"Bei diesem Antibiotikum ja. Die Dauer steht auf dem Etikett, und die gilt unabhängig davon, wie sie sich fühlt.","en":"With this antibiotic, yes. The duration is on the label, and it applies regardless of how she feels.","ur":"Is antibiotic mein haan. Muddat label par likhi hai, aur woh us ki tabiyat se alag lagoo hoti hai."},{"s":"B","de":"Warum eigentlich? Sie ist ja offensichtlich gesund.","en":"Why actually? She is obviously well again.","ur":"Aakhir kyun? Woh to zahir hai theek hai."},{"s":"A","de":"Weil die zähesten Keime zuletzt sterben. Brechen Sie zu früh ab, überleben genau die, gegen die das Mittel am schlechtesten wirkt.","en":"Because the toughest germs die last. If you stop too early, exactly those survive against which the medicine works worst.","ur":"Kyunke sab se sakht jaraseem aakhir mein marte hain. Jaldi band kar dein to wohi bach jate hain jin par dawa sab se kam asar karti hai."},{"s":"B","de":"So hat mir das noch niemand erklärt. Kann ich den Saft mit Milch mischen? Sie mag den Geschmack nicht.","en":"Nobody has ever explained it to me that way. Can I mix the syrup with milk? She doesn't like the taste.","ur":"Yeh mujhe kisi ne is tarah nahi samjhaya. Kya main syrup doodh mein mila sakti hoon? Usay swaad pasand nahi."},{"s":"A","de":"Bei diesem Wirkstoff besser nicht mit Milch. Geben Sie ihn pur und lassen Sie sie danach etwas Saft trinken.","en":"With this active ingredient better not with milk. Give it neat and let her drink some juice afterwards.","ur":"Is dawa ke saath doodh behtar nahi. Seedhi de dein aur us ke baad thora juice pila dein."},{"s":"B","de":"Alles klar. Und wo bewahre ich die Flasche auf?","en":"All right. And where do I store the bottle?","ur":"Theek hai. Aur bottle kahan rakhoon?"},{"s":"A","de":"Im Kühlschrank, aber nicht in der Tür — dort schwankt die Temperatur zu stark.","en":"In the fridge, but not in the door — the temperature fluctuates too much there.","ur":"Fridge mein, lekin darwaze mein nahi — wahan temperature bohat badalta hai."},{"s":"B","de":"Daran hätte ich nie gedacht. Vielen Dank, Sie haben mir sehr geholfen.","en":"I would never have thought of that. Thank you very much, you have helped me a lot.","ur":"Yeh mere zehen mein kabhi nahi aaya. Bohat shukriya, aap ne bohat madad ki."},{"s":"A","de":"Gern. Wenn etwas unklar ist, kommen Sie einfach vorbei, auch ohne Rezept.","en":"Gladly. If anything is unclear, just drop by, even without a prescription.","ur":"Zaroor. Agar kuch samajh na aaye to bas aa jayein, nuskhe ke baghair bhi."},{"s":"B","de":"Das werde ich machen. Auf Wiedersehen.","en":"I'll do that. Goodbye.","ur":"Main aisa hi karoongi. Khuda hafiz."},{"s":"A","de":"Auf Wiedersehen und gute Besserung für Ihre Tochter.","en":"Goodbye and get well soon to your daughter.","ur":"Khuda hafiz aur aap ki beti jald theek ho jaye."}]},"B2":{"speakers":{"A":"Apotheker","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Ich muss Ihnen leider sagen, dass ich Ihnen nicht genau das Präparat mitgeben kann, das auf dem Rezept steht.","en":"Unfortunately I have to tell you that I can't give you exactly the preparation that is on the prescription.","ur":"Afsos, mujhe kehna par raha hai ke main aap ko theek wohi dawa nahi de sakta jo nuskhe par likhi hai."},{"s":"B","de":"Ist das Mittel nicht lieferbar, oder steckt etwas anderes dahinter?","en":"Is the medicine unavailable, or is something else behind it?","ur":"Kya dawa dastiyab nahi, ya koi aur wajah hai?"},{"s":"A","de":"Beides trifft ein wenig zu. Ihre Kasse hat einen Rabattvertrag mit einem anderen Hersteller, und zusätzlich gibt es bei diesem Wirkstoff gerade einen Lieferengpass.","en":"Both apply a little. Your insurance has a rebate contract with another manufacturer, and on top of that there is currently a supply shortage for this active ingredient.","ur":"Dono baatein thori thori hain. Aap ke insurance ka doosre banane wale se muahida hai, aur is dawa ki supply mein bhi is waqt kami hai."},{"s":"B","de":"Heißt das, ich bekomme ein schlechteres Medikament, weil die Kasse sparen will?","en":"Does that mean I get a worse medication because the insurance wants to save money?","ur":"Kya iska matlab hai ke mujhe kam achi dawa milegi kyunke insurance paise bachana chahta hai?"},{"s":"A","de":"Nein. Der Wirkstoff, die Menge und die Freisetzung sind identisch, geprüft und gesetzlich vorgeschrieben. Unterschiedlich sind nur Hersteller, Farbe und manchmal der Geschmack.","en":"No. The active ingredient, the amount and the release are identical, tested and legally prescribed. Only the manufacturer, the colour and sometimes the taste differ.","ur":"Nahi. Dawa ka asal juzz, miqdar aur asar bilkul yaksan hain, jaanchay huay aur qanoonan zaroori. Sirf banane wala, rang aur kabhi swaad alag hota hai."},{"s":"B","de":"Der Geschmack ist bei einer Fünfjährigen leider kein Nebenaspekt.","en":"With a five-year-old the taste is unfortunately not a side issue.","ur":"Paanch saal ki bachi ke liye swaad afsos se mamooli baat nahi hai."},{"s":"A","de":"Da haben Sie völlig recht, und genau deshalb sage ich es Ihnen vorher. Wenn sie die Einnahme verweigert, nützt das billigste Präparat gar nichts.","en":"You are completely right there, and that is exactly why I'm telling you beforehand. If she refuses to take it, the cheapest preparation is of no use at all.","ur":"Aap bilkul theek kehti hain, isi liye main pehle bata raha hoon. Agar woh dawa lene se inkaar kare to sab se sasti dawa bhi bekaar hai."},{"s":"B","de":"Gibt es denn einen Weg, doch das gewohnte Präparat zu bekommen?","en":"Is there a way to get the familiar preparation after all?","ur":"Kya koi tareeqa hai ke wohi purani dawa mil jaye?"},{"s":"A","de":"Ja. Der Arzt kann auf dem Rezept das Aut-idem-Feld ankreuzen, dann ist der Austausch ausgeschlossen. Er muss das allerdings begründen können.","en":"Yes. The doctor can tick the aut-idem box on the prescription, then substitution is excluded. However, he has to be able to justify it.","ur":"Ji haan. Doctor nuskhe par aut-idem ka khana tick kar sakta hai, phir tabdeeli mumkin nahi. Lekin usay wajah deni hogi."},{"s":"B","de":"Würden Sie das an meiner Stelle veranlassen, oder halten Sie es für übertrieben?","en":"Would you arrange that in my position, or do you consider it excessive?","ur":"Kya aap meri jagah aisa karwate, ya aap ko yeh zaroorat se zyada lagta hai?"},{"s":"A","de":"Ich würde zunächst probieren. Wenn sie es nimmt, sparen Sie sich den Aufwand. Wenn nicht, rufe ich in der Praxis an und wir lösen das heute noch.","en":"I would try first. If she takes it, you save yourself the effort. If not, I'll call the practice and we'll sort it out today.","ur":"Main pehle azma kar dekhta. Agar woh le le to mehnat bach jaye. Warna main clinic phone kar ke aaj hi hal kar deta hoon."},{"s":"B","de":"Das ist ein faires Angebot. Eine letzte Frage: Sie nimmt seit dem Frühjahr täglich Vitamin D. Gibt es da eine Wechselwirkung?","en":"That's a fair offer. One last question: she has taken vitamin D daily since the spring. Is there an interaction?","ur":"Yeh munsifana pesh kash hai. Aakhri sawal: woh bahar se rozana Vitamin D leti hai. Kya koi taasur hoga?"},{"s":"A","de":"Mit diesem Antibiotikum nicht. Kritisch wären Kalzium, Eisen und Milchprodukte im selben Zeitfenster, weil sie die Aufnahme im Darm behindern.","en":"Not with this antibiotic. Calcium, iron and dairy products in the same time window would be critical, because they hinder absorption in the gut.","ur":"Is antibiotic ke saath nahi. Kalsiyam, loha aur doodh ki cheezein isi waqfe mein masla banti hain kyunke woh pait mein jazb hone se rokti hain."},{"s":"B","de":"Also Milch und Käse mindestens zwei Stunden vorher oder nachher.","en":"So milk and cheese at least two hours before or after.","ur":"To doodh aur cheese kam az kam do ghante pehle ya baad."},{"s":"A","de":"Genau so. Sie haben schnell verstanden, worauf es ankommt.","en":"Exactly. You quickly understood what matters.","ur":"Bilkul aisa hi. Aap ne foran samajh liya ke asal baat kya hai."},{"s":"B","de":"Ich habe gelernt, im Zweifel nachzufragen, statt zu Hause zu raten.","en":"I have learned to ask when in doubt, instead of guessing at home.","ur":"Main ne seekha hai ke shak ho to pooch lo, ghar par andaza mat lagao."},{"s":"A","de":"Wenn das alle täten, hätten wir hier deutlich weniger Probleme.","en":"If everyone did that, we would have considerably fewer problems here.","ur":"Agar sab aisa karein to yahan bohat kam masail hon."},{"s":"B","de":"Vielen Dank für Ihre Zeit. Auf Wiedersehen.","en":"Thank you for your time. Goodbye.","ur":"Aap ke waqt ka shukriya. Khuda hafiz."}]}},"roleplay":{"easy":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Der Arzt schreibt ein Rezept. Sie möchten wissen, wie Ihr Kind die Medizin nehmen soll.","en":"The doctor writes a prescription. You want to know how your child should take the medicine.","ur":"Doctor nuskha likh raha hai. Aap jan-na chahti hain ke bacha dawa kaise le."},"start":"n1","nodes":{"n1":{"say":"Ich schreibe Ihnen ein Rezept. Ein Saft gegen die Schmerzen.","goal":{"en":"Ask how often he should take the syrup.","ur":"Poochein ke syrup kitni baar leni hai."},"options":["Wie oft soll er den Saft nehmen?","Wie oft muss er den Saft nehmen?"],"fallback":"Haben Sie eine Frage zum Rezept?","accept":[{"kw":["wie","oft","saft"],"next":"n2"},{"kw":["oft"],"next":"n2"}]},"n2":{"say":"Dreimal am Tag, nach dem Essen.","goal":{"en":"Ask how much each time.","ur":"Poochein ke har baar kitni."},"options":["Wie viel jedes Mal?","Wie viel soll ich geben?"],"fallback":"Noch etwas unklar?","accept":[{"kw":["wie","viel"],"next":"n3"},{"kw":["viel"],"next":"n3"}]},"n3":{"say":"Fünf Milliliter. Der Löffel ist in der Packung.","goal":{"en":"Ask for how long.","ur":"Poochein ke kitne din."},"options":["Und wie lange?","Wie lange soll er das nehmen?"],"fallback":"Möchten Sie noch etwas wissen?","accept":[{"kw":["wie","lange"],"next":"n4"},{"kw":["lange"],"next":"n4"}]},"n4":{"say":"Fünf Tage lang.","goal":{"en":"Ask where you can buy it.","ur":"Poochein ke yeh kahan se milegi."},"options":["Wo kann ich das kaufen?","Wo bekomme ich das?"],"fallback":"Wissen Sie, wohin Sie damit gehen?","accept":[{"kw":["wo","kaufen"],"next":"n5"},{"kw":["kaufen"],"next":"n5"},{"kw":["bekomme"],"next":"n5"}]},"n5":{"say":"In der Apotheke, gleich neben der Praxis.","goal":{"en":"Ask whether you have to pay anything.","ur":"Poochein ke kya paise dene honge."},"options":["Muss ich etwas bezahlen?","Kostet das etwas?"],"fallback":"Noch eine Frage?","accept":[{"kw":["bezahlen"],"reply":"Für Kinder ist das Medikament kostenlos. Gute Besserung!","next":"END"},{"kw":["kostet"],"reply":"Für Kinder ist das Medikament kostenlos. Gute Besserung!","next":"END"}]}}},"hard":{"role":"Apotheker","you":"Vater oder Mutter","scene":{"de":"Sie sind in der Apotheke und lösen ein Rezept für ein Antibiotikum ein. Sie habe <script>/* Deutsch Alltag — app engine. No network calls, no dependencies. */
(function () {
'use strict';

var D = window.__DATA__ || { topics: [], dictionary: {}, forms: {} };
var DICT = D.dictionary, FORMS = D.forms, TOPICS = D.topics;
var LEVELS = ['A1', 'A2', 'B1', 'B2'];
var LVNAME = { A1: 'Anfänger', A2: 'Grundlage', B1: 'Mittel', B2: 'Fortgeschr.' };

/* ---------------- storage ---------------- */
function ls(k, d) { try { var v = localStorage.getItem('dg.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function ss(k, v) { try { localStorage.setItem('dg.' + k, JSON.stringify(v)); } catch (e) {} }

var S = Object.assign({ level: 'A1', en: true, ur: true, theme: 'auto', rate: 1.0, mic: true, voice: '', aiUrl: '', aiKey: '', aiVoice: true }, ls('set', {}));
var SAVED = ls('saved', {});     // { wordKey: {t:timestamp, box:0} }
var PROG = ls('prog', {});       // { read:{'top/sub/lvl':1}, test:{topicId:pct}, rp:{'top/sub':1} }
if (!PROG.read) PROG.read = {}; if (!PROG.test) PROG.test = {}; if (!PROG.rp) PROG.rp = {};

function saveSet() { ss('set', S); applyTheme(); }
function saveProg() { ss('prog', PROG); }
function saveWords() { ss('saved', SAVED); }

/* "auto" leaves data-theme off entirely, so the CSS media query decides and any host
   page that stamps data-theme keeps control. An explicit choice sets the attribute. */
function applyTheme() {
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', S.theme);
}
applyTheme();

/* ---------------- utils ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) {
  return String(s).toLowerCase().replace(/[^a-zäöüß'’\-]/g, '');
}
function plain(s) {
  return String(s).toLowerCase()
    .replace(/[.,!?;:„“"'’\-–—()]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  if (!m) return n; if (!n) return m;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur[0] = i;
    for (j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur.slice();
  }
  return prev[n];
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function topicById(id) { for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].id === id) return TOPICS[i]; return null; }
function subById(t, id) { if (!t) return null; for (var i = 0; i < t.subtopics.length; i++) if (t.subtopics[i].id === id) return t.subtopics[i]; return null; }

/* ---------------- speech ---------------- */
var VOICE = null, VOICES = [];
function voiceId(v) { return v.voiceURI || v.name; }
/* Higher = more natural. The good voices are the cloud/"enhanced" ones — the plain
   offline default is the robotic one, so it must NOT win by default. */
function rankVoice(v) {
  var n = (v.name || '').toLowerCase(), s = 0;
  if ((v.lang || '').toLowerCase() === 'de-de') s += 2; else s += 1;
  if (n.indexOf('google') > -1) s += 4;
  if (/enhanced|premium|neural|natural|siri/.test(n)) s += 4;
  if (!v.localService) s += 1;
  if (/compact|espeak|pico|eloquence/.test(n)) s -= 4;
  return s;
}
function loadVoices() {
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices() || [];
  VOICES = vs.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('de') === 0; })
    .sort(function (a, b) { return rankVoice(b) - rankVoice(a); });
  pickVoice();
  // voices load asynchronously — if Settings is already open, refresh the list
  if ((location.hash || '') === '#/set' && typeof vSet === 'function') vSet();
}
function pickVoice() {
  VOICE = null;
  if (S.voice) for (var i = 0; i < VOICES.length; i++) if (voiceId(VOICES[i]) === S.voice) { VOICE = VOICES[i]; break; }
  if (!VOICE && VOICES.length) VOICE = VOICES[0];
}
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function sampleVoice(id) {
  if (!window.speechSynthesis) return;
  var v = null;
  for (var i = 0; i < VOICES.length; i++) if (voiceId(VOICES[i]) === id) { v = VOICES[i]; break; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance('Guten Tag! Ich helfe dir, Deutsch zu lernen.');
    u.lang = 'de-DE'; u.rate = Number(S.rate) || 0.9; if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function say(text, cb) {
  if (!window.speechSynthesis) { if (cb) cb(); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'de-DE'; u.rate = Number(S.rate) || 0.85;
    if (VOICE) u.voice = VOICE;
    if (cb) { u.onend = cb; u.onerror = cb; }
    speechSynthesis.speak(u);
  } catch (e) { if (cb) cb(); }
}
function hasMic() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

/* ---------------- AI backend (optional, free Cloudflare Worker) ---------------- */
function aiConfigured() { return !!(S.aiUrl && S.aiKey); }
function aiFetch(path, body) {
  return fetch(S.aiUrl.replace(/\/+$/, '') + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Pass': S.aiKey },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    });
  });
}
function aiChat(system, history) { return aiFetch('/chat', { system: system, history: history }).then(function (d) { return d.reply || ''; }); }
/* ---- natural voice with a permanent local cache ----
   Each unique German line is generated by the AI once, stored in IndexedDB, and
   replayed from there forever — free, instant, and works offline after the first play. */
var TTSDB = null;
function ttsDbOpen() {
  return new Promise(function (res) {
    if (TTSDB) return res(TTSDB);
    var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
    try {
      var rq = indexedDB.open('dg-tts', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('audio'); };
      rq.onsuccess = function () { TTSDB = rq.result; fin(TTSDB); };
      rq.onerror = function () { fin(null); };
      rq.onblocked = function () { fin(null); };
      setTimeout(function () { fin(null); }, 1500); // never let a stuck open freeze speech
    } catch (e) { fin(null); }
  });
}
function ttsGet(key) {
  return ttsDbOpen().then(function (db) {
    if (!db) return null;
    return new Promise(function (res) {
      try { var r = db.transaction('audio', 'readonly').objectStore('audio').get(key); r.onsuccess = function () { res(r.result || null); }; r.onerror = function () { res(null); }; }
      catch (e) { res(null); }
    });
  });
}
function ttsPut(key, val) { return ttsDbOpen().then(function (db) { if (db) try { db.transaction('audio', 'readwrite').objectStore('audio').put(val, key); } catch (e) {} }); }
function ttsClear() { return ttsDbOpen().then(function (db) { if (db) try { db.transaction('audio', 'readwrite').objectStore('audio').clear(); } catch (e) {} }); }
function ttsKey(text, voice) { return 'v2|' + (voice || '') + '|' + String(text).trim(); }

// one voice per speaker so a two-person dialogue sounds like two people
var VOICE_A = 'Kore', VOICE_B = 'Puck';
function voiceFor(speaker) { return speaker === 'B' ? VOICE_B : VOICE_A; }

var AUDIO = null;
function stopAudio() {
  if (AUDIO) { try { AUDIO.pause(); } catch (e) {} AUDIO = null; }
  if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {}
}
function playB64(b64, mime, done) {
  try {
    var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: mime || 'audio/wav' }));
    var a = new Audio(url); AUDIO = a; var fired = false;
    var end = function () { if (fired) return; fired = true; try { URL.revokeObjectURL(url); } catch (e) {} if (done) done(); };
    a.onended = end; a.onerror = end;
    a.play().catch(end);
  } catch (e) { if (done) done(); }
}
/* speak via AI voice (cached), falling back to the device voice on any problem */
function aiSpeak(text, voice, done) {
  if (typeof voice === 'function') { done = voice; voice = null; }
  text = String(text || '').trim(); if (!text) { if (done) done(); return; }
  var key = ttsKey(text, voice);
  ttsGet(key).then(function (cached) {
    if (cached) { playB64(cached, 'audio/wav', done); return; }
    aiFetch('/tts', { text: text, voice: voice }).then(function (d) {
      if (d && d.audio) { ttsPut(key, d.audio); playB64(d.audio, d.mime || 'audio/wav', done); }
      else say(text, done);
    }).catch(function () { say(text, done); });
  }).catch(function () { say(text, done); });
}
/* the app's one speech entry point: AI voice when available, else device voice */
function speakAuto(text, voice, done) {
  if (typeof voice === 'function') { done = voice; voice = null; }
  stopAudio();
  if (S.aiVoice && aiConfigured()) aiSpeak(text, voice, done);
  else say(text, done);
}
function aiSystemPrompt(sc, level) {
  return 'Du spielst die Rolle: ' + sc.role + '. Der Nutzer ist: ' + sc.you + '. ' +
    'Szene: ' + sc.scene.de + ' ' +
    'Sprich ausschließlich Deutsch auf dem Niveau ' + level + '. ' +
    'Antworte kurz und natürlich, ein bis zwei Sätze, bleib in der Rolle und beim Thema. ' +
    'Wenn der Nutzer einen Fehler macht, benutze beiläufig die richtige Formulierung, ohne zu belehren. ' +
    'Wenn der Nutzer nicht weiterkommt, hilf mit einer einfacheren Frage. ' +
    'Bleibe freundlich und geduldig, wie mit einem Kind oder einem Deutschlerner.';
}

/* ---------------- dictionary lookup ---------------- */
var LINES = [];   // current render registry for per-line overrides
function lookup(tok, over) {
  var n = norm(tok);
  if (over) {
    if (over[tok] && DICT[over[tok]]) return DICT[over[tok]];
    if (over[n] && DICT[over[n]]) return DICT[over[n]];
  }
  if (DICT[n]) return DICT[n];
  if (FORMS[n] && DICT[FORMS[n]]) return DICT[FORMS[n]];
  if (n.indexOf('-') > -1) {
    var p = n.split('-');
    for (var i = 0; i < p.length; i++) { if (DICT[p[i]]) return DICT[p[i]]; if (FORMS[p[i]]) return DICT[FORMS[p[i]]]; }
  }
  return null;
}
function keyOf(entry) {
  for (var k in DICT) if (DICT[k] === entry) return k;
  return null;
}

var WORD_RE = /[A-Za-zÄÖÜäöüßéÉ]+(?:[’'\-][A-Za-zÄÖÜäöüß]+)*/g;
function tapText(text, lineIdx) {
  var out = '', last = 0, m;
  WORD_RE.lastIndex = 0;
  var over = (lineIdx != null && LINES[lineIdx]) ? LINES[lineIdx].w : null;
  while ((m = WORD_RE.exec(text)) !== null) {
    out += esc(text.slice(last, m.index));
    var t = m[0], e = lookup(t, over);
    out += '<button class="w' + (e ? '' : ' miss') + '" data-w="' + esc(t) + '" data-li="' + (lineIdx == null ? '' : lineIdx) + '">' + esc(t) + '</button>';
    last = m.index + t.length;
  }
  out += esc(text.slice(last));
  return out;
}

/* ---------------- word sheet ---------------- */
function openWord(tok, lineIdx) {
  var over = (lineIdx !== '' && LINES[lineIdx]) ? LINES[lineIdx].w : null;
  var e = lookup(tok, over);
  var body;
  if (!e) {
    body = '<div class="wh"><div><div class="lem">' + esc(tok) + '</div></div></div>' +
      '<p class="muted small" style="margin-top:14px">Dieses Wort ist noch nicht im Wörterbuch. / This word is not in the dictionary yet.</p>';
  } else {
    var k = keyOf(e);
    var head = (e.gender ? '<span class="art">' + esc(e.gender) + '</span> ' : '') + esc(e.lemma);
    var meta = [];
    if (e.pos) meta.push(e.pos);
    if (e.plural) meta.push('Pl. ' + e.plural);
    if (e.aux) meta.push(e.aux);
    var starred = !!SAVED[k];
    body =
      '<div class="wh">' +
        '<div style="flex:1"><div class="lem">' + head + '</div>' +
          (meta.length ? '<div class="forms">' + esc(meta.join(' · ')) + '</div>' : '') +
        '</div>' +
        '<button class="ico" data-act="sayw" data-t="' + esc(e.lemma) + '">🔊</button>' +
        '<button class="ico" data-act="star" data-k="' + esc(k) + '">' + (starred ? '★' : '☆') + '</button>' +
      '</div>' +
      (e.note ? '<div class="tag" style="margin-top:8px;display:inline-block">' + esc(e.note) + '</div>' : '') +
      '<div style="margin-top:10px">' +
        '<div class="mrow"><div class="k">EN</div><div class="v">' + esc(e.en) + '</div></div>' +
        '<div class="mrow" style="border-bottom:0"><div class="k">UR</div><div class="v">' + esc(e.ur) + '</div></div>' +
      '</div>' +
      (e.ex ? '<div class="ex">' +
        '<div class="exde">' + esc(e.ex.de) + ' <button class="mini" data-act="sayw" data-t="' + esc(e.ex.de) + '">🔊</button></div>' +
        '<div class="exen">' + esc(e.ex.en) + '</div>' +
        '<div class="exur">' + esc(e.ex.ur) + '</div>' +
      '</div>' : '');
  }
  document.getElementById('sheetBody').innerHTML = body;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}

/* ---------------- shell ---------------- */
function view(o) {
  var hd = document.getElementById('hd');
  hd.innerHTML =
    (o.back ? '<button class="ico" data-act="back">‹</button>' : '<div class="ico">📘</div>') +
    '<div class="ttl">' + esc(o.title) + (o.sub ? '<span class="sub">' + esc(o.sub) + '</span>' : '') + '</div>' +
    (o.chip ? '<button class="chip" data-act="lvl">' + esc(o.chip) + '</button>' : '') +
    (o.right || '');
  document.getElementById('app').innerHTML = '<div class="wrap">' + o.body + '</div>';
  window.scrollTo(0, 0);
  var nav = document.getElementById('nav');
  var h = location.hash || '#/';
  [['#/', 'n1'], ['#/words', 'n2'], ['#/search', 'n3'], ['#/set', 'n4']].forEach(function (p) {
    var a = document.getElementById(p[1]);
    if (a) a.className = (h === p[0] || (p[0] === '#/' && h.indexOf('#/t/') === 0) ||
      (p[0] === '#/' && (h.indexOf('#/d/') === 0 || h.indexOf('#/test') === 0 || h.indexOf('#/rp/') === 0))) ? 'on' : '';
  });
  nav.style.display = '';
}

/* ---------------- roleplay ---------------- */
var RP = null, REC = null;
var RP_FALLBACKS = [
  'Wie bitte?',
  'Entschuldigung, das habe ich nicht ganz verstanden.',
  'Können Sie das noch einmal sagen?',
  'Wie meinen Sie das?'
];
var RP_PHASE_LABEL = {
  idle: 'Tippe die Taste und sprich',
  speaking: '…',
  listening: 'Sprich jetzt',
  thinking: 'einen Moment…'
};
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function rpSayText(node) { return Array.isArray(node.say) ? pick(node.say) : node.say; }

function vRoleplay(tid, sid) {
  var t = topicById(tid), s = subById(t, sid); if (!s || !s.roleplay) return go('#/');

    showOpts: false, mode: 'manual', phase: 'idle', misses: 0, noSpeech: 0, hint: '', timer: null };
}
function rpStart() {
  var n = RP.sc.nodes[RP.node];
  if (n && n.say) RP.log.push({ me: false, text: rpSayText(n) });
  rpRender(true);
}

    b += '<div class="btns"><button class="btn sec" data-act="rplivestop">⏸ Stopp</button>' +

  }

  if (RP.mode !== 'ai' && RP.showOpts && n.options) {

/* evaluate one answer, mutate state, return {grade, newApp, ended} */
function rpEval(txt) {
  txt = String(txt || '').trim(); if (!txt) return null;
  var n = RP.sc.nodes[RP.node];
  var words = plain(txt).split(' ');
  var best = null;
  (n.accept || []).forEach(function (a) {
    var hits = 0;
    a.kw.forEach(function (k) {
      var kk = plain(k);
      for (var i = 0; i < words.length; i++) {
        if (words[i] === kk || (kk.length > 3 && lev(words[i], kk) <= Math.max(1, Math.floor(kk.length / 5)))) { hits++; return; }
      }
    });
    var sc = a.kw.length ? hits / a.kw.length : 0;
    if (!best || sc > best.sc) best = { a: a, sc: sc };
  });
  RP.turns++;
  var newApp = [];
  if (best && best.sc >= 0.55) {
    var grade = best.sc >= 0.999 ? 'good' : 'ok';
    if (grade === 'good') RP.good++;
    RP.misses = 0; RP.hint = '';
    RP.log.push({ me: true, text: txt, grade: grade });
    if (best.a.reply) { RP.log.push({ me: false, text: best.a.reply }); newApp.push(best.a.reply); }
    RP.node = best.a.next;
    var nx = RP.sc.nodes[RP.node];
    if (nx && nx.say) { var st = rpSayText(nx); RP.log.push({ me: false, text: st }); newApp.push(st); }
    RP.showOpts = false;
    return { grade: grade, newApp: newApp, ended: !RP.sc.nodes[RP.node] };
  }
  RP.misses++;
  RP.log.push({ me: true, text: txt, grade: 'bad' });
  var fb = (RP.misses >= 2 || !n.fallback) ? pick(RP_FALLBACKS) : n.fallback;
  RP.log.push({ me: false, text: fb }); newApp.push(fb);
  if (RP.misses >= 2 && n.options) RP.showOpts = true;
  return { grade: 'bad', newApp: newApp, ended: false };
}

/* send an answer from anywhere (typed, option-tap, or voice) */
function rpDeliver(txt) {
  txt = String(txt || '').trim(); if (!txt) return;
  rpStopRec();
  if (RP.mode === 'ai') { rpSubmitAi(txt); }
  else if (RP.mode === 'live') { rpSubmitLive(txt); }
  else { if (rpEval(txt)) rpRender(true); }
}
function rpAnswer(txt) { rpDeliver(txt); }

/* ---- live (hands-free) mode ---- */
function rpSetPhase(phase, label) {
  RP.phase = phase;
  var orb = document.getElementById('rporb'); if (orb) orb.className = 'orb ' + phase;
  var ic = document.getElementById('rporbic');
  if (ic) ic.textContent = phase === 'listening' ? '🎙️' : phase === 'speaking' ? '🔊' : phase === 'thinking' ? '…' : '▶';
  var lab = document.getElementById('rporblab'); if (lab) lab.textContent = label || RP_PHASE_LABEL[phase] || '';
}
function rpTrailingApp() {
  var out = [];
  for (var i = RP.log.length - 1; i >= 0; i--) { if (RP.log[i].me) break; out.unshift(RP.log[i].text); }
  return out;
}
function rpSpeakSequence(texts, done) {
  if (!texts || !texts.length) { if (done) done(); return; }
  rpSetPhase('speaking');
  var i = 0;
  (function nxt() {
    if (RP.mode !== 'live' && RP.mode !== 'ai') return;
    if (i >= texts.length) { if (done) done(); return; }
    var t = texts[i++], fired = false;
    var step = function () { if (fired) return; fired = true; clearTimeout(RP.timer); RP.timer = setTimeout(nxt, 240); };
    // watchdog: some browsers (notably iOS Safari) drop the speech-ended event,
    // so advance anyway after an estimate rather than freezing the conversation.
    var ms = Math.max(1600, String(t).split(/\s+/).length * 400 / (Number(S.rate) || 0.85));
    RP.timer = setTimeout(step, ms);
    say(t, step);
  })();
}
function rpBeginLive() {
  if (!hasMic() || !S.mic) return;
  RP.mode = 'live'; RP.hint = ''; RP.noSpeech = 0;
  rpRender(false);
  rpSpeakSequence(rpTrailingApp(), function () { rpListen(); });
}
function rpStopRec() { if (REC) { try { REC.abort(); } catch (e) {} REC = null; } }
function rpListen() {
  if (RP.mode !== 'live' && RP.mode !== 'ai') return;
  var C = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!C) {
    if (RP.mode === 'ai') { rpSetPhase('idle', 'Tippe deine Antwort'); return; }
    rpDropToManual('Sprechen wird in diesem Browser nicht unterstützt — bitte tippen.'); return;
  }
  rpSetPhase('listening', RP_PHASE_LABEL.listening);
  rpStopRec();
  REC = new C(); REC.lang = 'de-DE'; REC.interimResults = false; REC.maxAlternatives = 3;
  var got = false;
  REC.onresult = function (ev) { got = true; var txt = ev.results[0][0].transcript; rpStopRec(); rpDeliver(txt); };
  REC.onerror = function (ev) {
    rpStopRec();
    if (RP.mode === 'ai' && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'network')) {
      RP.hint = 'Mikrofon nicht verfügbar — tippe deine Antwort.'; rpSetPhase('idle', 'Tippe deine Antwort'); return;
    }
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') rpDropToManual('Bitte das Mikrofon erlauben. Danach die runde Taste drücken oder tippen.');
    else if (ev.error === 'network') rpDropToManual('Spracherkennung braucht Internet — bitte tippen.');
    else if (ev.error === 'no-speech') {
      RP.noSpeech++;
      if (RP.noSpeech >= 2) { rpSetPhase('idle'); RP.hint = 'Ich habe nichts gehört. Drück die grüne Taste und sprich, oder tippe.'; var l = document.getElementById('rporblab'); if (l) l.textContent = RP_PHASE_LABEL.idle; }
      else rpSetPhase('idle', 'Ich höre dich nicht — Taste drücken und sprechen');
    } else rpSetPhase('idle');
  };
  REC.onend = function () { if (!got && RP.phase === 'listening') rpSetPhase('idle'); };
  try { REC.start(); } catch (e) { rpSetPhase('idle', 'Taste drücken und sprechen'); }
}
function rpSubmitLive(txt) {
  RP.noSpeech = 0;
  rpSetPhase('thinking');
  clearTimeout(RP.timer);
  RP.timer = setTimeout(function () {
    var r = rpEval(txt);
    rpRender(false);
    if (!r) { rpSetPhase('idle'); return; }
    if (r.ended) { RP.mode = 'live'; rpSpeakSequence(r.newApp, function () { RP.mode = 'manual'; }); }
    else rpSpeakSequence(r.newApp, function () { rpListen(); });
  }, 520);
}
function rpDropToManual(msg) {
  rpStopLive(true);
  RP.mode = 'manual'; RP.hint = msg || ''; RP.showOpts = true;
  rpRender(false);
}
function rpStopLive(silent) {
  stopAudio();
  rpStopRec();
  if (RP) { clearTimeout(RP.timer); RP.mode = 'manual'; RP.phase = 'idle'; if (!silent) rpRender(false); }
}
function rpOrbTap() {
  if (RP.phase === 'listening') { rpStopRec(); rpSetPhase('idle'); }
  else if (RP.phase === 'idle') { RP.hint = ''; rpListen(); }
}

/* ---- AI mode: free conversation via the Worker backend ---- */
function rpPlay(text, done) {
  if (RP.mode !== 'ai') { if (done) done(); return; }
  rpSetPhase('speaking');
  var fired = false;
  var step = function () { if (fired) return; fired = true; clearTimeout(RP.timer); if (done) done(); };
  // watchdog covers network + playback so a dropped event can't freeze the turn
  RP.timer = setTimeout(step, Math.max(3000, String(text).split(/\s+/).length * 500) + 8000);
  if (S.aiVoice && aiConfigured()) aiSpeak(text, VOICE_A, step); else say(text, step);
}
function rpAiContinue() {
  if (RP.mode !== 'ai') return;
  if (hasMic() && S.mic) rpListen();
  else rpSetPhase('idle', 'Tippe deine Antwort');
}
function rpBeginAi() {
  if (!aiConfigured()) { RP.hint = 'Bitte zuerst in „Mehr" die KI einrichten.'; rpRender(false); return; }
  RP.mode = 'ai'; RP.hint = ''; RP.log = []; RP.turns = 0;
  RP.ai = { system: aiSystemPrompt(RP.sc, S.level), history: [] };
  rpRender(false);
  rpSetPhase('thinking', 'einen Moment…');
  aiChat(RP.ai.system, [{ role: 'user', text: '(Beginne das Gespräch mit einer kurzen Begrüßung.)' }]).then(function (reply) {
    if (RP.mode !== 'ai') return;
    reply = reply || 'Guten Tag!';
    RP.ai.history.push({ role: 'model', text: reply });
    RP.log.push({ me: false, text: reply }); rpRender(false);
    rpPlay(reply, rpAiContinue);
  }).catch(function (e) {
    RP.hint = 'KI nicht erreichbar: ' + e.message + '. Prüfe die Einstellungen.';
    rpStopLive(false);
  });
}
function rpSubmitAi(txt) {
  txt = String(txt || '').trim(); if (!txt) return;
  RP.noSpeech = 0;
  RP.ai.history.push({ role: 'user', text: txt });
  RP.log.push({ me: true, text: txt, grade: 'ok' }); RP.turns++;
  rpRender(false); rpSetPhase('thinking', 'einen Moment…');
  aiChat(RP.ai.system, RP.ai.history).then(function (reply) {
    if (RP.mode !== 'ai') return;
    reply = reply || 'Wie bitte?';
    RP.ai.history.push({ role: 'model', text: reply });
    RP.log.push({ me: false, text: reply }); rpRender(false);
    rpPlay(reply, rpAiContinue);
  }).catch(function (e) {
    RP.hint = 'KI-Fehler: ' + e.message; rpSetPhase('idle', 'Tippe deine Antwort'); rpRender(false);
  });
}

/* ---------------- test ---------------- */
var T = null;
function vTest(tid) {
  var t = topicById(tid); if (!t || !t.test) return go('#/');
  T = { t: t, items: shuffle(t.test.items), i: 0, right: 0, state: 'ask', pick: null, built: [], pool: [] };
  tRender();
}
function tRender() {
  var it = T.items[T.i];
  if (!it) return tDone();
  var pct = Math.round(T.i / T.items.length * 100);
  var b = '<div class="prog"><i style="width:' + pct + '%"></i></div>' +
    '<div class="small muted" style="margin-bottom:12px">Aufgabe ' + (T.i + 1) + ' von ' + T.items.length + '</div>';

  if (it.type === 'mc') {
    b += '<div class="q">' + esc(it.q) + '</div><div class="qh">Was bedeutet das? / Iska matlab kya hai?</div>';
    (it._opts || (it._opts = shuffle(it.opts.map(function (o, i) { return { o: o, i: i }; })))).forEach(function (o, idx) {
      var cls = 'opt';
      if (T.state === 'done') { if (o.i === it.a) cls += ' good'; else if (T.pick === idx) cls += ' bad'; }
      else if (T.pick === idx) cls += ' sel';
      b += '<button class="' + cls + '" data-act="tpick" data-i="' + idx + '">' + esc(o.o) + '</button>';
    });
  } else if (it.type === 'gap') {
    b += '<div class="q">' + esc(it.de.replace('___', '_____')) + '</div><div class="qh">' + esc(it.hint || '') + '</div>' +
      '<input class="inp" id="tin" placeholder="Fehlendes Wort…" autocomplete="off"' + (T.state === 'done' ? ' disabled' : '') + '>';
  } else if (it.type === 'order') {
    b += '<div class="q">' + esc(it.en) + '</div><div class="qh">Baue den deutschen Satz. / German jumla banayein.</div>';
    if (!it._pool) { it._pool = shuffle(it.a.replace(/[.?!]$/, '').split(' ')); T.built = []; }
    b += '<div class="tiles">' + T.built.map(function (w, i) { return '<button class="tk" data-act="tunbuild" data-i="' + i + '">' + esc(w) + '</button>'; }).join('') + '</div>';
    b += '<div class="tiles" style="background:transparent;padding:0">' + it._pool.map(function (w, i) {
      return T.built.indexOf(i) > -1 ? '' : '<button class="tk" data-act="tbuild" data-i="' + i + '">' + esc(w) + '</button>';
    }).join('') + '</div>';
  } else if (it.type === 'listen') {
    b += '<div class="q">Hör zu und schreib den Satz.</div><div class="qh">Suno aur likho.</div>' +
      '<div class="btns" style="margin-bottom:12px"><button class="btn gh" data-act="sayw" data-t="' + esc(it.a) + '">🔊 Nochmal hören</button></div>' +
      '<input class="inp" id="tin" placeholder="Satz auf Deutsch…" autocomplete="off"' + (T.state === 'done' ? ' disabled' : '') + '>';
  } else if (it.type === 'prod') {
    b += '<div class="q">' + esc(it.en) + '</div><div class="qh">' + esc(it.ur || '') + '</div>' +
      '<input class="inp" id="tin" placeholder="Auf Deutsch schreiben…" autocomplete="off"' + (T.state === 'done' ? ' disabled' : '') + '>';
  }

  if (T.state === 'done') {
    var fb = T.last;
    b += '<div class="fb ' + fb.cls + '"><b>' + esc(fb.head) + '</b>' + esc(fb.msg) + '</div>';
    b += '<div class="btns"><button class="btn" data-act="tnext">Weiter ›</button></div>';
  } else {
    b += '<div class="btns"><button class="btn" data-act="tcheck">Prüfen</button></div>';
  }
  view({ title: 'Test: ' + T.t.title.de, body: b, back: 1, chip: S.level });
  var inp = document.getElementById('tin');
  if (inp && T.state !== 'done') inp.focus();
}
function tCheck() {
  var it = T.items[T.i], ok = false, given = '';
  if (it.type === 'mc') {
    if (T.pick == null) return;
    ok = it._opts[T.pick].i === it.a;
    given = it._opts[T.pick].o;
  } else if (it.type === 'order') {
    given = T.built.map(function (i) { return it._pool[i]; }).join(' ');
    ok = plain(given) === plain(it.a);
  } else {
    var el = document.getElementById('tin');
    given = el ? el.value : '';
    var a = plain(it.type === 'gap' ? it.a : it.a), g = plain(given);
    ok = g === a;
    if (!ok && g && lev(g, a) <= Math.max(1, Math.round(a.length / 12))) {
      T.last = { cls: 'warn', head: 'Fast richtig!', msg: 'Richtig: ' + it.a + (it.en ? '  —  ' + it.en : '') };
      T.right += 0.5; T.state = 'done'; tRender(); return;
    }
  }
  if (ok) { T.right++; T.last = { cls: 'good', head: 'Richtig!', msg: (it.a && it.type !== 'mc' ? it.a : '') + (it.en ? '  —  ' + it.en : '') }; }
  else {
    var corr = it.type === 'mc' ? it.opts[it.a] : it.a;
    T.last = { cls: 'bad', head: 'Nicht ganz.', msg: 'Richtig: ' + corr + (it.ur ? '  ·  ' + it.ur : '') };
    if (it.word && DICT[it.word] && !SAVED[it.word]) { SAVED[it.word] = { t: Date.now(), box: 0 }; saveWords(); }
  }
  T.state = 'done'; tRender();
}
function tDone() {
  var pct = Math.round(T.right / T.items.length * 100);
  PROG.test[T.t.id] = pct; saveProg();
  var msg = pct >= 80 ? 'Sehr gut! / Bohat acha!' : pct >= 50 ? 'Gut — üb die falschen Wörter.' : 'Weiter üben. Lies das Gespräch nochmal.';
  var b = '<div class="card" style="padding:22px"><div class="score">' + pct + '%</div>' +
    '<div class="center muted small">' + T.right + ' / ' + T.items.length + ' richtig</div>' +
    '<p class="center" style="margin:16px 0 0">' + esc(msg) + '</p>' +
    '<div class="btns"><button class="btn sec" data-act="tagain">Nochmal</button>' +
    '<button class="btn" data-go="#/t/' + T.t.id + '">Fertig</button></div></div>' +
    '<p class="small muted center" style="margin-top:14px">Falsche Wörter sind jetzt bei „Meine Wörter“.</p>';
  view({ title: 'Ergebnis', body: b, back: 1, chip: S.level });
}

/* ---------------- search ---------------- */
function vSearch(q) {
  q = q || '';
  var b = '<input class="inp" id="sq" placeholder="Suchen: Deutsch, English, Roman Urdu…" value="' + esc(q) + '" autocomplete="off">';
  var n = plain(q);
  if (n.length >= 2) {
    var res = [];
    TOPICS.forEach(function (t) {
      t.subtopics.forEach(function (s) {
        LEVELS.forEach(function (lv) {
          var d = s.dialogues && s.dialogues[lv]; if (!d) return;
          d.lines.forEach(function (l) {
            if (plain(l.de).indexOf(n) > -1 || plain(l.en).indexOf(n) > -1 || plain(l.ur).indexOf(n) > -1) {
              if (res.length < 40) res.push({ t: t, s: s, lv: lv, l: l });
            }
          });
        });
      });
    });
    var wres = [];
    for (var k in DICT) {
      var e = DICT[k];
      if (plain(e.lemma).indexOf(n) > -1 || plain(e.en).indexOf(n) > -1 || plain(e.ur).indexOf(n) > -1) {
        if (wres.length < 20) wres.push(k);
      }
    }
    if (wres.length) {
      b += '<div class="sec">Wörter</div><div class="card">';
      wres.forEach(function (k) {
        var e = DICT[k];
        b += '<div class="wc"><div class="g"><div class="l">' + (e.gender ? e.gender + ' ' : '') + esc(e.lemma) + '</div>' +
          '<div class="m">' + esc(e.en) + ' · ' + esc(e.ur) + '</div></div>' +
          '<button class="mini" data-act="star" data-k="' + esc(k) + '">' + (SAVED[k] ? '★' : '☆') + '</button></div>';
      });
      b += '</div>';
    }
    if (res.length) {
      b += '<div class="sec">Sätze (' + res.length + ')</div><div class="rowlist">';
      res.forEach(function (r) {
        b += '<button class="row" data-go="#/d/' + r.t.id + '/' + r.s.id + '">' +
          '<div class="g"><div class="t" style="font-weight:500">' + esc(r.l.de) + '</div>' +
          '<div class="s">' + esc(r.t.title.de) + ' · ' + esc(r.s.title.de) + ' · ' + r.lv + '</div></div><div class="ar">›</div></button>';

    el.oninput = function () { clearTimeout(tmr); tmr = setTimeout(function () { vSearch(el.value); }, 220); };

}

/* ---------------- router ---------------- */
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function route() {
  closeSheet();
  stopAudio();               // stop any playing speech (device or cached AI) on navigation
  if (RP) rpStopLive(true);  // stop any live audio/mic when leaving the roleplay
  var p = (location.hash || '#/').replace(/^#\/?/, '').split('/');
  if (!p[0]) return vHome();
  if (p[0] === 't') return vTopic(p[1]);
  if (p[0] === 'd') return vDialogue(p[1], p[2]);
  if (p[0] === 'rp') { vRoleplay(p[1], p[2]); rpStart(); return; }
  if (p[0] === 'test') return vTest(p[1]);
  if (p[0] === 'words') return vWords();
  if (p[0] === 'fc') return vFC();
  if (p[0] === 'search') return vSearch('');
  if (p[0] === 'set') return vSet();
  return vHome();
}
window.addEventListener('hashchange', route);

/* ---------------- events ---------------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act],[data-go],.w,.bub') : null;
  if (!el) return;
  var act = el.getAttribute('data-act');
  var goh = el.getAttribute('data-go');

  if (el.classList.contains('w')) {
    ev.stopPropagation();
    openWord(el.getAttribute('data-w'), el.getAttribute('data-li'));
    return;
  }
  if (goh) { go(goh); return; }

  switch (act) {
    case 'back': history.back(); return;
    case 'lvl': levelSheet(); return;
    case 'setlvl':
      S.level = el.getAttribute('data-l'); saveSet(); closeSheet(); route(); return;
    case 'sayw': speakAuto(el.getAttribute('data-t'), VOICE_A); return;
    case 'sayline': { var ln = LINES[el.getAttribute('data-i')]; speakAuto(ln.de, voiceFor(ln.s)); return; }
    case 'tr': {
      var bub = el.closest('.bub'); if (bub) bub.classList.toggle('open'); return;
    }
    case 'playall': {
      var i = 0;
      (function nxt() { if (i >= LINES.length) return; var ln = LINES[i++]; speakAuto(ln.de, voiceFor(ln.s), function () { setTimeout(nxt, 150); }); })();
      return;
    }
    case 'star': case 'unstar': {
      var k = el.getAttribute('data-k');
      if (SAVED[k]) delete SAVED[k]; else SAVED[k] = { t: Date.now(), box: 0 };
      saveWords();
      if (act === 'unstar') { route(); }
      else { el.textContent = SAVED[k] ? '★' : '☆'; }
      return;
    }
    /* roleplay */
    case 'rpsend': { var i2 = document.getElementById('rpin'); var v = i2 ? i2.value : ''; if (i2) i2.value = ''; rpDeliver(v); return; }
    case 'rppick': rpDeliver(el.getAttribute('data-o')); return;
    case 'rphelp': RP.showOpts = !RP.showOpts; rpRender(false); return;
    case 'rpstartlive': rpBeginLive(); return;
    case 'rpstartai': rpBeginAi(); return;
    case 'rporbtap': rpOrbTap(); return;
    case 'rplivestop': case 'rptype': rpStopLive(false); return;
    case 'rprep': {
      stopAudio();
      for (var j = RP.log.length - 1; j >= 0; j--) if (!RP.log[j].me) { speakAuto(RP.log[j].text, VOICE_A); break; }
      return;
    }
    case 'rpagain': vRoleplay(RP.t.id, RP.s.id); rpStart(); return;
    /* test */
    case 'tpick': if (T.state !== 'done') { T.pick = Number(el.getAttribute('data-i')); tRender(); } return;
    case 'tbuild': T.built.push(Number(el.getAttribute('data-i'))); tRender(); return;
    case 'tunbuild': T.built.splice(Number(el.getAttribute('data-i')), 1); tRender(); return;
    case 'tcheck': tCheck(); return;
    case 'tnext': T.i++; T.state = 'ask'; T.pick = null; T.built = []; tRender(); return;
    case 'tagain': vTest(T.t.id); return;
    /* flashcards */
    case 'fcflip': FC.rev = true; vFC(); return;
    case 'fcok': case 'fcno':
      if (act === 'fcok') FC.ok++;
      FC.i++; FC.rev = false;
      if (FC.i >= FC.q.length) { FC = null; go('#/words'); } else vFC();
      return;
    /* settings */
    case 'tgen': S.en = !S.en; saveSet(); vSet(); return;
    case 'tgur': S.ur = !S.ur; saveSet(); vSet(); return;
    case 'tgmic': S.mic = !S.mic; saveSet(); vSet(); return;
