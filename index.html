<title>Deutsch Alltag</title>
<style>/* Deutsch Alltag — mobile-first stylesheet */
:root{
  --bg:#f4f6f9; --card:#ffffff; --card2:#eef1f6; --line:#dde2ea;
  --tx:#161a21; --tx2:#5b6472; --acc:#2f5fe0; --acc-s:#e6ecfd;
  --ok:#1a7f4b; --ok-s:#e3f5ec; --warn:#a3690a; --warn-s:#fdf2dd;
  --bad:#b3261e; --bad-s:#fbe6e5;
  --r:14px; --sh:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
  --hd:56px; --nav:60px;
}
/* Dark tokens are defined twice on purpose: once for "no explicit choice, follow the
   OS", once for an explicit data-theme. That way a host page (or our own settings
   screen) can stamp data-theme and win in both directions. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0e1116; --card:#171b22; --card2:#1f242d; --line:#2a313c;
    --tx:#e7eaef; --tx2:#98a2b3; --acc:#7aa0ff; --acc-s:#1b2740;
    --ok:#5fd39b; --ok-s:#14301f; --warn:#e0b25a; --warn-s:#33280f;
    --bad:#ff8a80; --bad-s:#3a1c1a;
    --sh:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --card2:#1f242d; --line:#2a313c;
  --tx:#e7eaef; --tx2:#98a2b3; --acc:#7aa0ff; --acc-s:#1b2740;
  --ok:#5fd39b; --ok-s:#14301f; --warn:#e0b25a; --warn-s:#33280f;
  --bad:#ff8a80; --bad-s:#3a1c1a;
  --sh:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}

/* ---------- header ---------- */
.hd{
  position:sticky;top:0;z-index:40;height:var(--hd);
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--card);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);height:calc(var(--hd) + env(safe-area-inset-top));
}
.hd .ttl{font-size:17px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .sub{display:block;font-size:12px;font-weight:400;color:var(--tx2)}
.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none;font-size:20px}
.ico:active{background:var(--card2)}
.chip{
  font-size:13px;font-weight:650;padding:6px 11px;border-radius:999px;
  background:var(--acc-s);color:var(--acc);flex:none
}

/* ---------- layout ---------- */
.wrap{padding:14px 12px 24px;max-width:760px;margin:0 auto}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:20px 2px 8px}
.sec:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.muted{color:var(--tx2)}
.small{font-size:13px}
.center{text-align:center}

/* ---------- home ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;text-align:left;box-shadow:var(--sh);min-height:104px;
  display:flex;flex-direction:column;gap:6px
}
.tile:active{transform:scale(.985)}
.tile .em{font-size:26px;line-height:1}
.tile .t{font-weight:640;font-size:15px}
.tile .s{font-size:12.5px;color:var(--tx2)}
.tile .bar{margin-top:auto;height:4px;border-radius:2px;background:var(--card2);overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--ok)}
.tile.locked{opacity:.55}

.rowlist{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;box-shadow:var(--sh)
}
.row:active{background:var(--card2)}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{font-size:12.5px;color:var(--tx2);margin-top:2px}
.row .ar{color:var(--tx2);font-size:18px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:12px;font-weight:640;font-size:15px;
  background:var(--acc);color:#fff;border:1px solid transparent
}
.btn:active{filter:brightness(.93)}
.btn.sec{background:var(--card);color:var(--tx);border-color:var(--line)}
.btn.gh{background:var(--acc-s);color:var(--acc)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:10px;margin-top:12px}

/* ---------- level picker ---------- */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{
  padding:11px 4px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  font-weight:700;font-size:15px;text-align:center
}
.lv.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.lv .n{display:block;font-size:10.5px;font-weight:500;opacity:.75;margin-top:2px}

/* ---------- dialogue ---------- */
.bub{margin:0 0 12px;max-width:88%}
.bub.r{margin-left:auto}
.who{font-size:11.5px;font-weight:650;color:var(--tx2);margin:0 4px 3px;letter-spacing:.02em}
.bub.r .who{text-align:right}
.bl{
  background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;
  padding:11px 13px;box-shadow:var(--sh)
}
.bub.r .bl{background:var(--acc-s);border-color:transparent;border-radius:16px 16px 4px 16px}
.de{font-size:16.5px;line-height:1.62}
.tr{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
.bub.open .tr{display:block}
.tr .en{font-size:14px;color:var(--tx2)}
.tr .ur{font-size:14px;color:var(--tx2);margin-top:3px;font-style:italic}
.blact{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.mini{
  font-size:12px;padding:5px 9px;border-radius:8px;background:var(--card2);color:var(--tx2);
  font-weight:600
}
.mini:active{background:var(--acc-s);color:var(--acc)}

/* tappable word */
.w{
  display:inline;padding:1px 0;border-radius:4px;font:inherit;color:inherit;
  border-bottom:1px solid transparent
}
.w:active{background:var(--acc-s);color:var(--acc)}
.w.miss{border-bottom-color:var(--bad)}

/* ---------- bottom sheet ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(8,11,16,.45);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--card);border-radius:20px 20px 0 0;
  box-shadow:0 -6px 24px rgba(8,11,16,.22);
  transform:translateY(101%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:82vh;overflow-y:auto;
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));
  max-width:760px;margin:0 auto
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.wh{display:flex;align-items:flex-start;gap:10px}
.wh .lem{font-size:23px;font-weight:700;line-height:1.2}
.wh .art{color:var(--acc)}
.tag{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 7px;border-radius:6px;background:var(--card2);color:var(--tx2);white-space:nowrap
}
.mrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.mrow .k{font-size:11px;font-weight:700;color:var(--tx2);width:42px;flex:none;padding-top:3px;letter-spacing:.04em}
.mrow .v{font-size:15.5px;flex:1}
.ex{background:var(--card2);border-radius:12px;padding:12px;margin-top:14px}
.ex .exde{font-size:15.5px;line-height:1.55}
.ex .exen,.ex .exur{font-size:13.5px;color:var(--tx2);margin-top:5px}
.ex .exur{font-style:italic}
.forms{font-size:13px;color:var(--tx2);margin-top:6px}

/* ---------- test ---------- */
.q{font-size:17px;font-weight:600;line-height:1.45;margin-bottom:4px}
.qh{font-size:13.5px;color:var(--tx2);margin-bottom:14px}
.opt{
  display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);margin-bottom:9px;font-size:15px
}
.opt.sel{border-color:var(--acc);background:var(--acc-s)}
.opt.good{border-color:var(--ok);background:var(--ok-s)}
.opt.bad{border-color:var(--bad);background:var(--bad-s)}
.inp{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font:16px/1.4 inherit
}
.inp:focus{outline:2px solid var(--acc);outline-offset:-1px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;
  background:var(--card2);border-radius:12px;margin-bottom:10px}
.tk{padding:9px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:15px}
.tk:active{border-color:var(--acc)}
.fb{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:14.5px;line-height:1.5}
.fb.good{background:var(--ok-s);color:var(--ok)}
.fb.warn{background:var(--warn-s);color:var(--warn)}
.fb.bad{background:var(--bad-s);color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.prog{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.score{font-size:52px;font-weight:750;text-align:center;line-height:1.1;margin:10px 0 2px}

/* ---------- roleplay ---------- */
.rp{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.rpb{max-width:88%;padding:11px 13px;border-radius:16px 16px 16px 4px;
  background:var(--card);border:1px solid var(--line);font-size:16px;line-height:1.55}
.rpb.me{margin-left:auto;background:var(--acc-s);border-color:transparent;border-radius:16px 16px 4px 16px}
.rpb.me.ok{background:var(--ok-s)}
.rpb.me.no{background:var(--bad-s)}
.goal{background:var(--warn-s);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:14.5px;margin-bottom:10px}
.goal b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.8;margin-bottom:3px}
.mic{width:64px;height:64px;border-radius:50%;background:var(--acc);color:#fff;font-size:26px;
  display:grid;place-items:center;margin:0 auto;box-shadow:var(--sh);flex:none}
.mic.rec{background:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* live-conversation orb: one control that shows whose turn it is */
.orbwrap{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0 2px}
.orb{width:104px;height:104px;border-radius:50%;border:0;color:#fff;font-size:40px;
  display:grid;place-items:center;background:var(--acc);box-shadow:var(--sh);
  transition:background .2s,transform .15s}
.orb:active{transform:scale(.96)}
.orb.speaking{background:var(--acc)}
.orb.listening{background:var(--bad);animation:pulse 1.15s infinite}
.orb.thinking{background:var(--warn)}
.orb.idle{background:var(--ok)}
.orblabel{font-size:13.5px;font-weight:600;color:var(--tx2);min-height:19px;text-align:center}
.livehint{font-size:12.5px;color:var(--tx2);text-align:center;margin-top:10px;line-height:1.5}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
.nav a{
  flex:1;text-align:center;padding:9px 0 8px;text-decoration:none;color:var(--tx2);
  font-size:10.5px;font-weight:600;display:block
}
.nav a i{display:block;font-size:20px;font-style:normal;line-height:1.2}
.nav a.on{color:var(--acc)}

/* ---------- misc ---------- */
.sw{display:flex;align-items:center;justify-content:space-between;padding:14px;gap:12px}
.sw + .sw{border-top:1px solid var(--line)}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .18s}
.tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:var(--acc)}
.tog.on i{left:23px}
.empty{text-align:center;color:var(--tx2);padding:48px 20px;font-size:14.5px}
.empty .em{font-size:38px;display:block;margin-bottom:10px}
.hl{background:var(--warn-s);color:var(--warn);border-radius:3px;padding:0 2px}
.wc{display:flex;align-items:center;gap:10px;padding:12px 14px}
.wc + .wc{border-top:1px solid var(--line)}
.wc .g{flex:1;min-width:0}
.wc .l{font-weight:620}
.wc .m{font-size:13px;color:var(--tx2);margin-top:1px}
.fc{min-height:190px;display:grid;place-items:center;padding:26px 18px;text-align:center}
.fc .big{font-size:27px;font-weight:700;line-height:1.3}
.fc .rev{margin-top:12px;font-size:16px;color:var(--tx2)}
@media(min-width:600px){ .grid{grid-template-columns:repeat(3,1fr)} }
</style>

<main id="app"></main>

ctor Weber's practice, hello.","ur":"Doctor Weber ka clinic, salam."},{"s":"B","de":"Guten Tag. Ich heiße Fatima Khan.","en":"Hello. My name is Fatima Khan.","ur":"Salam. Mera naam Fatima Khan hai."},{"s":"B","de":"Ich brauche einen Termin für meinen Sohn.","en":"I need an appointment for my son.","ur":"Mujhe apne bete ke liye appointment chahiye."},{"s":"A","de":"Wie alt ist Ihr Sohn?","en":"How old is your son?","ur":"Aap ka beta kitne saal ka hai?"},{"s":"B","de":"Er ist vier Jahre alt.","en":"He is four years old.","ur":"Woh chaar saal ka hai."},{"s":"A","de":"Was hat er denn?","en":"What's wrong with him?","ur":"Usay kya hua hai?"},{"s":"B","de":"Er hat Fieber. Und er hustet viel.","en":"He has a fever. And he coughs a lot.","ur":"Usay bukhar hai. Aur woh bohat khansta hai."},{"s":"A","de":"Seit wann hat er Fieber?","en":"Since when has he had a fever?","ur":"Bukhar kab se hai?"},{"s":"B","de":"Seit zwei Tagen.","en":"For two days.","ur":"Do din se."},{"s":"A","de":"Können Sie heute um fünfzehn Uhr kommen?","en":"Can you come today at three o'clock?","ur":"Kya aap aaj teen baje aa sakti hain?"},{"s":"B","de":"Ja, das geht. Um fünfzehn Uhr ist gut.","en":"Yes, that works. Three o'clock is fine.","ur":"Ji haan, theek hai. Teen baje acha hai."},{"s":"A","de":"Wie heißt Ihr Sohn?","en":"What is your son's name?","ur":"Aap ke bete ka naam kya hai?"},{"s":"B","de":"Er heißt Yusuf Khan.","en":"His name is Yusuf Khan.","ur":"Us ka naam Yusuf Khan hai."},{"s":"A","de":"Bitte bringen Sie die Versichertenkarte mit.","en":"Please bring the insurance card with you.","ur":"Meherbani kar ke insurance card saath lein."},{"s":"B","de":"Ja, natürlich. Vielen Dank.","en":"Yes, of course. Thank you very much.","ur":"Ji zaroor. Bohat shukriya."},{"s":"A","de":"Bis später. Auf Wiederhören.","en":"See you later. Goodbye.","ur":"Baad mein milte hain. Khuda hafiz."}]},"A2":{"speakers":{"A":"Frau Baumann (Praxis)","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Kinderarztpraxis Doktor Weber, Baumann am Apparat. Was kann ich für Sie tun?","en":"Doctor Weber's pediatric practice, Baumann speaking. What can I do for you?","ur":"Doctor Weber ka bachon ka clinic, Baumann baat kar rahi hoon. Main aap ki kya madad kar sakti hoon?"},{"s":"B","de":"Guten Tag, Frau Baumann. Mein Name ist Fatima Khan.","en":"Hello, Mrs Baumann. My name is Fatima Khan.","ur":"Salam, Frau Baumann. Mera naam Fatima Khan hai."},{"s":"B","de":"Ich möchte einen Termin für meine Tochter vereinbaren.","en":"I would like to make an appointment for my daughter.","ur":"Main apni beti ke liye appointment lena chahti hoon."},{"s":"A","de":"Ist Ihre Tochter schon bei uns in Behandlung?","en":"Is your daughter already a patient with us?","ur":"Kya aap ki beti pehle se hamare paas ilaaj karwa rahi hai?"},{"s":"B","de":"Ja, sie war im letzten Jahr zweimal bei Ihnen.","en":"Yes, she was here twice last year.","ur":"Ji haan, pichle saal do baar aap ke paas aayi thi."},{"s":"A","de":"Gut. Wie heißt sie und wann ist sie geboren?","en":"Good. What is her name and when was she born?","ur":"Acha. Us ka naam kya hai aur woh kab paida hui?"},{"s":"B","de":"Sie heißt Amina Khan und sie ist am zwölften März zweitausendzwanzig geboren.","en":"Her name is Amina Khan and she was born on the twelfth of March 2020.","ur":"Us ka naam Amina Khan hai aur woh barah March do hazaar bees ko paida hui."},{"s":"A","de":"Danke. Und was fehlt ihr?","en":"Thank you. And what's wrong with her?","ur":"Shukriya. Aur usay kya takleef hai?"},{"s":"B","de":"Sie hat seit gestern hohes Fieber und Ohrenschmerzen.","en":"She has had a high fever and an earache since yesterday.","ur":"Usay kal se tez bukhar aur kaan mein dard hai."},{"s":"B","de":"Sie weint sehr viel und will nichts essen.","en":"She cries a lot and doesn't want to eat anything.","ur":"Woh bohat roti hai aur kuch khana nahi chahti."},{"s":"A","de":"Das klingt nicht gut. Können Sie in einer Stunde da sein?","en":"That doesn't sound good. Can you be here in an hour?","ur":"Yeh acha nahi lagta. Kya aap ek ghante mein aa sakti hain?"},{"s":"B","de":"Das ist schwierig, weil ich noch arbeite. Geht es auch um halb fünf?","en":"That's difficult because I'm still working. Would half past four work too?","ur":"Mushkil hai kyunke main abhi kaam par hoon. Kya saarhe chaar baje ho sakta hai?"},{"s":"A","de":"Um halb fünf habe ich leider nichts frei. Aber um Viertel nach fünf ist ein Termin frei.","en":"Unfortunately I have nothing free at half past four. But there is an appointment free at quarter past five.","ur":"Afsos, saarhe chaar baje kuch khali nahi. Lekin sawa paanch baje ek appointment khali hai."},{"s":"B","de":"Viertel nach fünf passt mir gut. Vielen Dank.","en":"Quarter past five suits me well. Thank you very much.","ur":"Sawa paanch baje mere liye theek hai. Bohat shukriya."},{"s":"A","de":"Bitte kommen Sie zehn Minuten früher und bringen Sie die Versichertenkarte mit.","en":"Please come ten minutes earlier and bring the insurance card.","ur":"Meherbani kar ke das minute pehle aayein aur insurance card saath layein."},{"s":"B","de":"Muss ich noch etwas mitbringen?","en":"Do I have to bring anything else?","ur":"Kya mujhe aur kuch bhi lana hoga?"},{"s":"A","de":"Wenn Sie das gelbe Untersuchungsheft haben, bringen Sie es bitte auch mit.","en":"If you have the yellow check-up booklet, please bring that as well.","ur":"Agar aap ke paas peela check-up copy hai to woh bhi le aayein."},{"s":"B","de":"Alles klar. Bis später, Frau Baumann.","en":"All right. See you later, Mrs Baumann.","ur":"Theek hai. Baad mein milte hain, Frau Baumann."}]},"B1":{"speakers":{"A":"Frau Baumann (Praxis)","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Praxis Doktor Weber, mein Name ist Baumann, guten Morgen.","en":"Doctor Weber's practice, my name is Baumann, good morning.","ur":"Doctor Weber ka clinic, mera naam Baumann hai, subh bakhair."},{"s":"B","de":"Guten Morgen, Frau Baumann. Khan hier. Es tut mir leid, dass ich so früh anrufe.","en":"Good morning, Mrs Baumann. Khan here. I'm sorry for calling so early.","ur":"Subh bakhair, Frau Baumann. Khan bol rahi hoon. Maazrat ke itni jaldi phone kar rahi hoon."},{"s":"B","de":"Aber ich mache mir Sorgen um meinen Sohn.","en":"But I am worried about my son.","ur":"Lekin mujhe apne bete ki fikar ho rahi hai."},{"s":"A","de":"Kein Problem, dafür sind wir da. Was ist denn passiert?","en":"No problem, that's what we're here for. What happened?","ur":"Koi baat nahi, hum isi liye hain. Kya hua hai?"},{"s":"B","de":"Er hat die ganze Nacht gehustet und heute Morgen hatte er fast neununddreißig Grad Fieber.","en":"He coughed all night and this morning he had almost thirty-nine degrees of fever.","ur":"Woh saari raat khansta raha aur aaj subh usay taqreeban unatalees degree bukhar tha."},{"s":"A","de":"Hat er auch Atemprobleme oder hat er sich übergeben?","en":"Does he also have breathing problems, or has he vomited?","ur":"Kya usay saans lene mein bhi mushkil hai ya us ne ulti ki hai?"},{"s":"B","de":"Übergeben hat er sich nicht, aber beim Atmen pfeift es manchmal.","en":"He hasn't vomited, but sometimes there's a wheezing when he breathes.","ur":"Ulti nahi ki, lekin kabhi kabhi saans lete waqt seeti si awaaz aati hai."},{"s":"B","de":"Deshalb wollte ich lieber gleich anrufen.","en":"That's why I preferred to call right away.","ur":"Isi liye main ne foran phone karna behtar samjha."},{"s":"A","de":"Das haben Sie richtig gemacht. Wir haben eine Akutsprechstunde zwischen acht und zehn Uhr.","en":"You did the right thing. We have an urgent walk-in surgery between eight and ten o'clock.","ur":"Aap ne theek kiya. Hamare paas aath se das baje tak emergency waqt hota hai."},{"s":"A","de":"Da können Sie ohne festen Termin kommen.","en":"You can come then without a fixed appointment.","ur":"Us waqt aap bina appointment ke aa sakti hain."},{"s":"B","de":"Wie lange muss ich dann ungefähr warten?","en":"Roughly how long will I have to wait then?","ur":"To phir mujhe taqreeban kitna intezaar karna hoga?"},{"s":"A","de":"Das kommt darauf an, wie viele Kinder vor Ihnen da sind. Rechnen Sie mit einer halben Stunde bis zu einer Stunde.","en":"That depends on how many children are there before you. Count on half an hour up to an hour.","ur":"Yeh is par hai ke aap se pehle kitne bachay hain. Aadha ghanta se ek ghanta samjhein."},{"s":"B","de":"Das ist in Ordnung. Ich versuche, in zwanzig Minuten da zu sein.","en":"That's fine. I'll try to be there in twenty minutes.","ur":"Theek hai. Main bees minute mein pohanchne ki koshish karti hoon."},{"s":"A","de":"Falls es ihm plötzlich schlechter geht, fahren Sie bitte direkt in die Kinderklinik.","en":"If he suddenly gets worse, please drive straight to the children's hospital.","ur":"Agar us ki halat achanak kharab ho jaye to seedha bachon ke hospital chali jayein."},{"s":"B","de":"Woran würde ich das merken?","en":"How would I notice that?","ur":"Mujhe kaise pata chalega?"},{"s":"A","de":"Wenn er sehr schwer atmet, wenn die Lippen blau werden oder wenn er kaum noch trinkt.","en":"If he breathes very heavily, if his lips turn blue, or if he barely drinks anything.","ur":"Agar woh bohat mushkil se saans le, hont neelay ho jayein, ya woh mushkil se kuch piye."},{"s":"B","de":"Gut, darauf achte ich. Soll ich noch etwas mitbringen?","en":"Good, I'll watch out for that. Should I bring anything else?","ur":"Acha, main dhyan rakhoongi. Kya kuch aur bhi lana hai?"},{"s":"A","de":"Die Versichertenkarte, das Untersuchungsheft und den Impfpass, falls Sie ihn finden.","en":"The insurance card, the check-up booklet and the vaccination record, if you can find it.","ur":"Insurance card, check-up copy aur teeka card, agar mil jaye to."},{"s":"B","de":"Ich packe alles ein. Vielen Dank für Ihre Hilfe.","en":"I'll pack everything. Thank you very much for your help.","ur":"Main sab rakh loongi. Aap ki madad ka bohat shukriya."},{"s":"A","de":"Gern geschehen. Bis gleich, Frau Khan.","en":"You're welcome. See you shortly, Mrs Khan.","ur":"Koi baat nahi. Abhi milte hain, Frau Khan."}]},"B2":{"speakers":{"A":"Frau Baumann (Praxis)","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Praxis Doktor Weber, Baumann, guten Tag.","en":"Doctor Weber's practice, Baumann, hello.","ur":"Doctor Weber ka clinic, Baumann, salam."},{"s":"B","de":"Guten Tag, Frau Baumann, Khan mein Name. Ich hätte gern einen Termin, möglichst noch in dieser Woche.","en":"Hello, Mrs Baumann, Khan is my name. I would like an appointment, ideally still this week.","ur":"Salam, Frau Baumann, mera naam Khan hai. Mujhe appointment chahiye, agar ho sake to isi hafte."},{"s":"A","de":"Worum geht es denn genau?","en":"What exactly is it about?","ur":"Baat asal mein kya hai?"},{"s":"B","de":"Meiner Tochter geht es seit etwa zehn Tagen nicht besonders gut.","en":"My daughter hasn't been feeling particularly well for about ten days.","ur":"Meri beti ki tabiyat taqreeban das din se theek nahi hai."},{"s":"B","de":"Sie ist ständig müde, hat wenig Appetit und klagt immer wieder über Bauchschmerzen.","en":"She is constantly tired, has little appetite and repeatedly complains about stomach ache.","ur":"Woh hamesha thaki rehti hai, bhook kam hai aur baar baar pait dard ki shikayat karti hai."},{"s":"A","de":"Wurde sie deswegen schon einmal untersucht?","en":"Has she already been examined for this?","ur":"Kya is wajah se us ka pehle muaina hua hai?"},{"s":"B","de":"Vor einer Woche waren wir im Notdienst. Dort wurde nichts Auffälliges festgestellt, aber die Beschwerden sind geblieben.","en":"A week ago we were at the emergency service. Nothing unusual was found there, but the symptoms have remained.","ur":"Ek hafta pehle hum emergency gaye thay. Wahan koi khaas baat nahi mili, lekin takleef bar qarar hai."},{"s":"A","de":"Dann wäre es sinnvoll, das in Ruhe abzuklären, und nicht zwischen Tür und Angel in der Akutsprechstunde.","en":"Then it would make sense to look into it calmly, and not in passing during the walk-in surgery.","ur":"To behtar hoga ke isay itminan se dekha jaye, jaldi jaldi emergency waqt mein nahi."},{"s":"B","de":"Genau das ist mein Gedanke. Hätten Sie einen längeren Termin, bei dem der Arzt sich Zeit nehmen kann?","en":"That is exactly my thought. Would you have a longer appointment where the doctor can take their time?","ur":"Bilkul yehi meri soch hai. Kya aap ke paas lamba appointment hai jis mein doctor waqt de sakein?"},{"s":"A","de":"Am Donnerstag um vierzehn Uhr ist mir gerade ein Vorsorgetermin frei geworden. Der wäre lang genug.","en":"On Thursday at two o'clock a check-up slot has just become free. That would be long enough.","ur":"Jumeraat ko do baje abhi ek check-up ka waqt khali hua hai. Woh kaafi lamba hoga."},{"s":"B","de":"Donnerstag um vierzehn Uhr würde mir sehr gut passen.","en":"Thursday at two o'clock would suit me very well.","ur":"Jumeraat do baje mere liye bohat munasib hoga."},{"s":"A","de":"Es wäre hilfreich, wenn Sie vorher notieren würden, wann die Schmerzen auftreten und was Ihre Tochter jeweils gegessen hat.","en":"It would be helpful if you noted down beforehand when the pain occurs and what your daughter had eaten each time.","ur":"Madadgar hoga agar aap pehle likh lein ke dard kab hota hai aur us waqt beti ne kya khaya tha."},{"s":"B","de":"Soll ich das für die ganze Woche aufschreiben?","en":"Should I write that down for the whole week?","ur":"Kya main poore hafte ke liye likhoon?"},{"s":"A","de":"Idealerweise ja. So ein Beschwerdetagebuch sagt uns oft mehr als jede einzelne Untersuchung.","en":"Ideally yes. Such a symptom diary often tells us more than any single examination.","ur":"Behtar yehi hai. Aisi shikayat diary aksar kisi bhi ek test se zyada batati hai."},{"s":"B","de":"Das mache ich. Sollte ich vorsichtshalber nüchtern kommen, falls Blut abgenommen wird?","en":"I'll do that. Should she come on an empty stomach just in case, if blood is taken?","ur":"Main karti hoon. Kya ehtiyatan khali pait aana chahiye, agar khoon liya jaye?"},{"s":"A","de":"Das wäre nicht verkehrt. Falls es doch nicht nötig ist, kann Ihre Tochter anschließend etwas essen.","en":"That wouldn't be wrong. If it turns out not to be necessary, your daughter can eat something afterwards.","ur":"Yeh ghalat nahi hoga. Agar zaroorat na pari to beti baad mein kuch kha sakti hai."},{"s":"B","de":"Verstanden. Dann bringe ich ihr ein Brot mit. Vielen Dank für Ihre Geduld.","en":"Understood. Then I'll bring her a sandwich. Thank you for your patience.","ur":"Samajh gayi. To main us ke liye bread le aaoongi. Aap ke sabr ka shukriya."},{"s":"A","de":"Nicht dafür. Wir sehen uns am Donnerstag, Frau Khan.","en":"Don't mention it. We'll see each other on Thursday, Mrs Khan.","ur":"Koi baat nahi. Jumeraat ko milte hain, Frau Khan."}]}},"roleplay":{"easy":{"role":"Frau Baumann, Arzthelferin","you":"Vater oder Mutter","scene":{"de":"Sie rufen in der Kinderarztpraxis an. Ihr Sohn hat seit zwei Tagen Fieber.","en":"You call the pediatric practice. Your son has had a fever for two days.","ur":"Aap bachon ke clinic phone karte hain. Bete ko do din se bukhar hai."},"start":"n1","nodes":{"n1":{"say":"Praxis Doktor Weber, guten Tag.","goal":{"en":"Say hello and say you need an appointment for your son.","ur":"Salam karein aur kahein ke bete ke liye appointment chahiye."},"options":["Guten Tag, ich brauche einen Termin für meinen Sohn.","Guten Tag. Ich möchte einen Termin für meinen Sohn."],"fallback":"Entschuldigung, ich habe Sie nicht verstanden. Was möchten Sie?","accept":[{"kw":["guten","termin","sohn"],"next":"n2"},{"kw":["termin"],"next":"n2"}]},"n2":{"say":"Gern. Wie alt ist Ihr Sohn?","goal":{"en":"Say that he is four years old.","ur":"Kahein ke woh chaar saal ka hai."},"options":["Er ist vier Jahre alt.","Vier Jahre."],"fallback":"Wie alt ist er denn genau?","accept":[{"kw":["vier","jahre"],"next":"n3"},{"kw":["vier"],"next":"n3"}]},"n3":{"say":"Und was hat er?","goal":{"en":"Say he has a fever and coughs a lot.","ur":"Kahein ke usay bukhar hai aur bohat khansta hai."},"options":["Er hat Fieber und er hustet viel.","Er hat Fieber. Er hustet auch."],"fallback":"Können Sie mir sagen, welche Beschwerden er hat?","accept":[{"kw":["fieber","hustet"],"next":"n4"},{"kw":["fieber"],"next":"n4"}]},"n4":{"say":"Seit wann hat er Fieber?","goal":{"en":"Say: for two days.","ur":"Kahein: do din se."},"options":["Seit zwei Tagen.","Er hat seit zwei Tagen Fieber."],"fallback":"Seit gestern? Seit einer Woche?","accept":[{"kw":["seit","zwei","tagen"],"next":"n5"},{"kw":["zwei"],"next":"n5"}]},"n5":{"say":"Können Sie heute um fünfzehn Uhr kommen?","goal":{"en":"Say yes, that works for you.","ur":"Haan kahein, yeh waqt theek hai."},"options":["Ja, das geht.","Ja, um fünfzehn Uhr ist gut."],"fallback":"Passt Ihnen der Termin oder nicht?","accept":[{"kw":["ja"],"next":"n6"},{"kw":["nein"],"reply":"Kein Problem. Dann nehmen wir morgen um neun Uhr.","next":"n6"}]},"n6":{"say":"Bitte bringen Sie die Versichertenkarte mit.","goal":{"en":"Say yes and say thank you and goodbye.","ur":"Haan kahein, shukriya kahein aur khuda hafiz."},"options":["Ja, natürlich. Vielen Dank. Auf Wiederhören.","Gut. Danke schön. Auf Wiederhören."],"fallback":"Haben Sie das notiert?","accept":[{"kw":["danke","wiederhören"],"reply":"Bis später. Auf Wiederhören.","next":"END"},{"kw":["danke"],"reply":"Bis später. Auf Wiederhören.","next":"END"}]}}},"hard":{"role":"Frau Baumann, Arzthelferin","you":"Vater oder Mutter","scene":{"de":"Ihre Tochter hat die ganze Nacht gehustet und hohes Fieber. Sie rufen morgens in der Praxis an.","en":"Your daughter coughed all night and has a high fever. You call the practice in the morning.","ur":"Aap ki beti saari raat khansti rahi aur tez bukhar hai. Aap subh clinic phone karte hain."},"start":"n1","nodes":{"n1":{"say":"Praxis Doktor Weber, mein Name ist Baumann, guten Morgen.","goal":{"en":"Greet, give your name, and say you are worried about your daughter.","ur":"Salam karein, apna naam batayein aur kahein ke aap ko beti ki fikar hai."},"options":["Guten Morgen, Khan hier. Ich mache mir Sorgen um meine Tochter.","Guten Morgen, mein Name ist Khan. Ich mache mir Sorgen um meine Tochter."],"fallback":"Entschuldigung, worum geht es?","accept":[{"kw":["guten","sorgen","tochter"],"next":"n2"},{"kw":["tochter"],"next":"n2"}]},"n2":{"say":"Kein Problem, dafür sind wir da. Was ist denn passiert?","goal":{"en":"Say she coughed all night and had almost 39 degrees this morning.","ur":"Kahein ke woh saari raat khansti rahi aur aaj subh taqreeban unatalees degree bukhar tha."},"options":["Sie hat die ganze Nacht gehustet und heute Morgen hatte sie fast neununddreißig Grad Fieber.","Sie hat die ganze Nacht gehustet und hat hohes Fieber."],"fallback":"Können Sie die Beschwerden genauer beschreiben?","accept":[{"kw":["nacht","gehustet","fieber"],"next":"n3"},{"kw":["gehustet"],"next":"n3"},{"kw":["fieber"],"next":"n3"}]},"n3":{"say":"Hat sie auch Atemprobleme oder hat sie sich übergeben?","goal":{"en":"Say she hasn't vomited, but there is sometimes a wheezing when she breathes.","ur":"Kahein ke ulti nahi ki, lekin kabhi kabhi saans lete waqt seeti si awaaz aati hai."},"options":["Übergeben hat sie sich nicht, aber beim Atmen pfeift es manchmal.","Nein, aber beim Atmen pfeift es manchmal."],"fallback":"Atmet sie normal? Hat sie erbrochen?","accept":[{"kw":["atmen","pfeift"],"next":"n4"},{"kw":["nicht","atmen"],"next":"n4"},{"kw":["pfeift"],"next":"n4"}]},"n4":{"say":"Das haben Sie richtig gemacht. Wir haben eine Akutsprechstunde zwischen acht und zehn Uhr, da können Sie ohne festen Termin kommen.","goal":{"en":"Ask roughly how long you will have to wait.","ur":"Poochein ke taqreeban kitna intezaar karna hoga."},"options":["Wie lange muss ich ungefähr warten?","Wie lange dauert die Wartezeit?"],"fallback":"Haben Sie dazu noch eine Frage?","accept":[{"kw":["wie","lange","warten"],"next":"n5"},{"kw":["warten"],"next":"n5"},{"kw":["wartezeit"],"next":"n5"}]},"n5":{"say":"Das kommt darauf an, wie viele Kinder vor Ihnen sind. Rechnen Sie mit einer halben Stunde bis zu einer Stunde.","goal":{"en":"Say that's fine and that you'll try to be there in twenty minutes.","ur":"Kahein theek hai aur aap bees minute mein pohanchne ki koshish karengi."},"options":["Das ist in Ordnung. Ich versuche, in zwanzig Minuten da zu sein.","Gut. Ich bin in zwanzig Minuten da."],"fallback":"Schaffen Sie das?","accept":[{"kw":["zwanzig","minuten"],"next":"n6"},{"kw":["ordnung"],"next":"n6"},{"kw":["gut"],"next":"n6"}]},"n6":{"say":"Falls es ihr plötzlich schlechter geht, fahren Sie bitte direkt in die Kinderklinik.","goal":{"en":"Ask how you would notice that.","ur":"Poochein ke aap ko kaise pata chalega."},"options":["Woran würde ich das merken?","Wie merke ich das?"],"fallback":"Ist Ihnen das klar so?","accept":[{"kw":["woran","merken"],"next":"n7"},{"kw":["merke"],"next":"n7"},{"kw":["wie"],"next":"n7"}]},"n7":{"say":"Wenn sie sehr schwer atmet, wenn die Lippen blau werden oder wenn sie kaum noch trinkt.","goal":{"en":"Ask whether you should bring anything else.","ur":"Poochein ke kya kuch aur bhi lana hai."},"options":["Soll ich noch etwas mitbringen?","Muss ich noch etwas mitbringen?"],"fallback":"Noch eine Frage?","accept":[{"kw":["etwas","mitbringen"],"next":"n8"},{"kw":["mitbringen"],"next":"n8"}]},"n8":{"say":"Die Versichertenkarte, das Untersuchungsheft und den Impfpass, falls Sie ihn finden.","goal":{"en":"Say you'll pack everything and thank her for her help.","ur":"Kahein ke aap sab rakh lengi aur madad ka shukriya."},"options":["Ich packe alles ein. Vielen Dank für Ihre Hilfe.","Gut, ich bringe alles mit. Danke für Ihre Hilfe."],"fallback":"Haben Sie alles notiert?","accept":[{"kw":["danke","hilfe"],"reply":"Gern geschehen. Bis gleich, Frau Khan.","next":"END"},{"kw":["danke"],"reply":"Gern geschehen. Bis gleich.","next":"END"}]}}}}},{"id":"anmeldung","order":2,"icon":"🗂️","title":{"de":"An der Anmeldung","en":"At the reception desk","ur":"Reception par"},"angle":"Checking in, card, forms, waiting room · Card, form aur waiting room","words":["anmeldung","formular","ausfüllen","unterschreiben","wartezimmer","überweisung","attest","adresse","geburtsdatum","datenschutz"],"dialogues":{"A1":{"speakers":{"A":"Frau Baumann (Anmeldung)","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag. Wie kann ich helfen?","en":"Hello. How can I help?","ur":"Salam. Main kaise madad karoon?"},{"s":"B","de":"Guten Tag. Ich habe einen Termin um drei Uhr.","en":"Hello. I have an appointment at three o'clock.","ur":"Salam. Mera teen baje ka appointment hai."},{"s":"A","de":"Wie ist Ihr Name?","en":"What is your name?","ur":"Aap ka naam kya hai?"},{"s":"B","de":"Khan. Mein Sohn heißt Yusuf Khan.","en":"Khan. My son's name is Yusuf Khan.","ur":"Khan. Mere bete ka naam Yusuf Khan hai."},{"s":"A","de":"Haben Sie die Versichertenkarte?","en":"Do you have the insurance card?","ur":"Kya aap ke paas insurance card hai?"},{"s":"B","de":"Ja, hier ist sie.","en":"Yes, here it is.","ur":"Ji haan, yeh raha."},{"s":"A","de":"Danke. Waren Sie schon einmal hier?","en":"Thank you. Have you been here before?","ur":"Shukriya. Kya aap pehle kabhi yahan aayi hain?"},{"s":"B","de":"Nein, wir sind neu.","en":"No, we are new.","ur":"Nahi, hum naye hain."},{"s":"A","de":"Dann füllen Sie bitte dieses Formular aus.","en":"Then please fill in this form.","ur":"To meherbani kar ke yeh form bhar dein."},{"s":"B","de":"Wo soll ich unterschreiben?","en":"Where should I sign?","ur":"Mujhe kahan dastakhat karne hain?"},{"s":"A","de":"Hier unten, bitte.","en":"Down here, please.","ur":"Yahan neeche, please."},{"s":"B","de":"Fertig. Und wo warten wir?","en":"Done. And where do we wait?","ur":"Ho gaya. Aur hum kahan intezaar karein?"},{"s":"A","de":"Im Wartezimmer links. Dort gibt es Spielzeug.","en":"In the waiting room on the left. There is toys there.","ur":"Baayen taraf waiting room mein. Wahan khilone hain."},{"s":"B","de":"Vielen Dank.","en":"Thank you very much.","ur":"Bohat shukriya."},{"s":"A","de":"Wir rufen Sie auf.","en":"We will call you.","ur":"Hum aap ko bula lenge."}]},"A2":{"speakers":{"A":"Frau Baumann (Anmeldung)","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, was kann ich für Sie tun?","en":"Hello, what can I do for you?","ur":"Salam, main aap ki kya madad kar sakti hoon?"},{"s":"B","de":"Guten Tag. Wir haben um Viertel nach fünf einen Termin für Amina Khan.","en":"Hello. We have an appointment at quarter past five for Amina Khan.","ur":"Salam. Amina Khan ka sawa paanch baje appointment hai."},{"s":"A","de":"Einen Moment, ich schaue nach. Ja, hier ist sie. Die Versichertenkarte, bitte.","en":"One moment, I'll check. Yes, here she is. The insurance card, please.","ur":"Ek minute, main dekhti hoon. Ji haan, yeh rahi. Insurance card, please."},{"s":"B","de":"Hier, bitte schön.","en":"Here you are.","ur":"Yeh lijiye."},{"s":"A","de":"Danke. Die Karte ist leider abgelaufen. Haben Sie eine neue bekommen?","en":"Thank you. Unfortunately the card has expired. Have you received a new one?","ur":"Shukriya. Afsos, card ki tareekh khatam ho gayi hai. Kya aap ko naya mila hai?"},{"s":"B","de":"Ja, aber die neue Karte liegt zu Hause. Ist das ein Problem?","en":"Yes, but the new card is at home. Is that a problem?","ur":"Ji haan, lekin naya card ghar par hai. Kya yeh masla hai?"},{"s":"A","de":"Heute geht es noch. Bringen Sie die Karte bitte innerhalb von zehn Tagen vorbei.","en":"Today it's still all right. Please bring the card by within ten days.","ur":"Aaj chalega. Meherbani kar ke das din ke andar card le aayein."},{"s":"B","de":"Das mache ich. Ich habe auch die Adresse gewechselt.","en":"I'll do that. I have also changed address.","ur":"Main le aaoongi. Mera address bhi badal gaya hai."},{"s":"A","de":"Gut, dass Sie das sagen. Wie lautet die neue Adresse?","en":"Good that you mention it. What is the new address?","ur":"Acha hua aap ne bataya. Naya address kya hai?"},{"s":"B","de":"Gartenstraße siebenundzwanzig, vierzig, zweihundertsiebzehn Düsseldorf.","en":"Gartenstrasse 27, 40217 Düsseldorf.","ur":"Gartenstrasse 27, 40217 Düsseldorf."},{"s":"A","de":"Danke. Hat sich die Telefonnummer auch geändert?","en":"Thank you. Has the phone number changed as well?","ur":"Shukriya. Kya phone number bhi badla hai?"},{"s":"B","de":"Nein, die Nummer ist gleich geblieben.","en":"No, the number has stayed the same.","ur":"Nahi, number wohi hai."},{"s":"A","de":"Alles notiert. Bitte füllen Sie noch dieses Formular zum Datenschutz aus und unterschreiben Sie unten.","en":"All noted. Please also fill in this data protection form and sign at the bottom.","ur":"Sab likh liya. Meherbani kar ke yeh privacy form bhi bharein aur neeche dastakhat karein."},{"s":"B","de":"Muss ich das jedes Mal machen?","en":"Do I have to do that every time?","ur":"Kya yeh har baar karna hoga?"},{"s":"A","de":"Nein, nur einmal. Danach ist es bei uns gespeichert.","en":"No, only once. After that it is saved with us.","ur":"Nahi, sirf ek baar. Us ke baad hamare paas mehfooz rehta hai."},{"s":"B","de":"Gut. Wie lange dauert es heute ungefähr?","en":"Good. Roughly how long will it take today?","ur":"Acha. Aaj taqreeban kitna waqt lagega?"},{"s":"A","de":"Etwa zwanzig Minuten. Nehmen Sie bitte im Wartezimmer Platz, wir rufen Sie auf.","en":"About twenty minutes. Please take a seat in the waiting room, we will call you.","ur":"Taqreeban bees minute. Waiting room mein baith jayein, hum bula lenge."}]},"B1":{"speakers":{"A":"Frau Baumann (Anmeldung)","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Khan. Sie waren gestern schon einmal hier, richtig?","en":"Hello, Mrs Khan. You were here yesterday already, right?","ur":"Salam, Frau Khan. Aap kal bhi aayi thin, theek?"},{"s":"B","de":"Genau. Der Arzt hat gesagt, wir sollen heute noch einmal vorbeikommen.","en":"Exactly. The doctor said we should come by again today.","ur":"Bilkul. Doctor ne kaha tha ke hum aaj dobara aayein."},{"s":"A","de":"Dann brauche ich die Karte nicht noch einmal. Ich melde Sie direkt an.","en":"Then I don't need the card again. I'll register you straight away.","ur":"To mujhe card dobara nahi chahiye. Main aap ko seedha register kar deti hoon."},{"s":"B","de":"Ich habe außerdem eine Überweisung vom Hausarzt dabei.","en":"I also have a referral from the family doctor with me.","ur":"Mere paas family doctor ki referral bhi hai."},{"s":"A","de":"Die nehme ich gleich mit. Ist sie aus diesem Quartal?","en":"I'll take that right away. Is it from this quarter?","ur":"Main abhi le leti hoon. Kya yeh isi quarter ki hai?"},{"s":"B","de":"Sie ist von letzter Woche. Reicht das?","en":"It's from last week. Is that enough?","ur":"Yeh pichle hafte ki hai. Kya kaafi hai?"},{"s":"A","de":"Das reicht völlig. Brauchen Sie heute auch ein Attest für die Kita?","en":"That is completely enough. Do you also need a sick note for the daycare today?","ur":"Bilkul kaafi hai. Kya aaj kita ke liye medical certificate bhi chahiye?"},{"s":"B","de":"Ja, bitte. Die Kita will wissen, ab wann er wieder kommen darf.","en":"Yes, please. The daycare wants to know from when he is allowed to come back.","ur":"Ji haan. Kita jan-na chahti hai ke woh kab se dobara aa sakta hai."},{"s":"A","de":"Sagen Sie das bitte dem Arzt im Sprechzimmer, dann schreibt er es direkt auf.","en":"Please tell the doctor in the consulting room, then he'll write it straight away.","ur":"Meherbani kar ke doctor ko kamre mein bata dein, woh foran likh dega."},{"s":"B","de":"Mache ich. Eine Frage noch: Können wir das Attest später abholen?","en":"I will. One more question: can we pick the certificate up later?","ur":"Zaroor. Ek aur sawal: kya hum certificate baad mein le sakte hain?"},{"s":"A","de":"Natürlich. Ab morgen liegt es hier an der Anmeldung bereit.","en":"Of course. From tomorrow it will be ready here at reception.","ur":"Zaroor. Kal se yeh yahan reception par tayyar hoga."},{"s":"B","de":"Sehr gut. Und wo ist das Wartezimmer für kranke Kinder?","en":"Very good. And where is the waiting room for sick children?","ur":"Bohat acha. Aur beemar bachon ka waiting room kahan hai?"},{"s":"A","de":"Den Gang entlang und dann rechts. Links ist das Zimmer für die Vorsorgeuntersuchungen.","en":"Along the corridor and then to the right. On the left is the room for check-ups.","ur":"Corridor ke saath aur phir dayen. Baayen taraf check-up ka kamra hai."},{"s":"B","de":"Danke, das hätte ich verwechselt.","en":"Thank you, I would have mixed that up.","ur":"Shukriya, main ghalti kar deti."},{"s":"A","de":"Das passiert oft. Deshalb steht es auch an der Tür.","en":"That happens often. That's why it is written on the door too.","ur":"Yeh aksar hota hai. Isi liye darwaze par bhi likha hai."},{"s":"B","de":"Wie lange dauert es heute ungefähr?","en":"Roughly how long will it take today?","ur":"Aaj taqreeban kitna waqt lagega?"},{"s":"A","de":"Heute geht es schnell, es sind nur zwei Kinder vor Ihnen.","en":"Today it's quick, there are only two children ahead of you.","ur":"Aaj jaldi hoga, sirf do bachay aap se pehle hain."},{"s":"B","de":"Perfekt. Dann setzen wir uns.","en":"Perfect. Then we'll sit down.","ur":"Bohat acha. To hum baith jate hain."}]},"B2":{"speakers":{"A":"Frau Baumann (Anmeldung)","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Khan. Ihre Karte lässt sich leider nicht einlesen, der Chip scheint defekt zu sein.","en":"Hello, Mrs Khan. Unfortunately your card can't be read, the chip seems to be defective.","ur":"Salam, Frau Khan. Afsos, aap ka card parha nahi ja raha, chip kharab lagta hai."},{"s":"B","de":"Das ist ärgerlich. Bedeutet das, dass wir die Behandlung selbst bezahlen müssen?","en":"That's annoying. Does that mean we have to pay for the treatment ourselves?","ur":"Yeh pareshan kun hai. Kya iska matlab hai ke ilaaj ka kharcha khud dena hoga?"},{"s":"A","de":"Nein, keine Sorge. Wir behandeln heute ganz normal und Sie reichen die Karte innerhalb von zehn Tagen nach.","en":"No, don't worry. We'll treat as normal today and you submit the card within ten days.","ur":"Nahi, fikar na karein. Aaj normal ilaaj hoga aur aap das din ke andar card jama kara dein."},{"s":"B","de":"Und falls die Krankenkasse bis dahin keine neue Karte geschickt hat?","en":"And if the health insurance hasn't sent a new card by then?","ur":"Aur agar insurance company tab tak naya card na bhejay?"},{"s":"A","de":"Dann lassen Sie sich dort eine vorläufige Bescheinigung ausstellen, die gilt genauso.","en":"Then have them issue a provisional certificate, that counts just the same.","ur":"To wahan se aarzi certificate bana lein, woh bhi barabar chalta hai."},{"s":"B","de":"Gut zu wissen. Ich rufe morgen früh bei der Kasse an.","en":"Good to know. I'll call the insurance first thing tomorrow.","ur":"Acha maloom hua. Main kal subh insurance ko phone karti hoon."},{"s":"A","de":"Machen Sie das. Und noch etwas: Bei Ihrem Sohn steht die U8 an, das wäre eigentlich schon vor drei Monaten fällig gewesen.","en":"Do that. And one more thing: your son's U8 check-up is due, it should actually have been three months ago.","ur":"Zaroor karein. Aur ek baat: aap ke bete ka U8 check-up baqi hai, woh asal mein teen mahine pehle hona chahiye tha."},{"s":"B","de":"Das ist mir völlig durchgerutscht. Ist der Termin dann noch möglich?","en":"That completely slipped my mind. Is the appointment still possible then?","ur":"Yeh mere zehen se bilkul nikal gaya. Kya ab bhi appointment mumkin hai?"},{"s":"A","de":"Es gibt ein Toleranzfenster, in dem die Kasse die Untersuchung noch übernimmt. Wir liegen gerade noch darin.","en":"There is a tolerance window in which the insurance still covers the examination. We are just about inside it.","ur":"Ek gunjaish ka arsa hota hai jis mein insurance test ka kharcha uthata hai. Hum abhi us ke andar hain."},{"s":"B","de":"Dann würde ich das gern gleich mit erledigen, wenn es zeitlich passt.","en":"Then I'd like to get that done at the same time, if it fits time-wise.","ur":"To main yeh saath hi karwa loon, agar waqt mein aa jaye."},{"s":"A","de":"Heute wird es knapp, weil eine Vorsorge etwa vierzig Minuten dauert. Ich schlage Freitagvormittag vor.","en":"Today it will be tight, because a check-up takes about forty minutes. I suggest Friday morning.","ur":"Aaj mushkil hoga kyunke check-up taqreeban chalees minute leta hai. Main Jumma subh tajweez karti hoon."},{"s":"B","de":"Freitagvormittag ist ungünstig, da arbeite ich. Ginge es auch am späten Nachmittag?","en":"Friday morning is inconvenient, I'm working then. Would late afternoon be possible too?","ur":"Jumma subh mushkil hai, main kaam par hoti hoon. Kya sham ko der se ho sakta hai?"},{"s":"A","de":"Um sechzehn Uhr dreißig hätte ich noch etwas frei. Das ist der letzte Vorsorgetermin des Tages.","en":"At half past four I still have something free. That is the last check-up slot of the day.","ur":"Saarhe chaar baje kuch khali hai. Woh din ka aakhri check-up ka waqt hai."},{"s":"B","de":"Den nehme ich. Bringe ich dazu das Untersuchungsheft und den Impfpass mit?","en":"I'll take that one. Do I bring the check-up booklet and the vaccination record for it?","ur":"Main woh le leti hoon. Kya us ke liye check-up copy aur teeka card lana hai?"},{"s":"A","de":"Beides, ja. Falls das Heft verloren gegangen ist, sagen Sie bitte vorher Bescheid.","en":"Both, yes. If the booklet has been lost, please let us know beforehand.","ur":"Dono, ji haan. Agar copy gum ho gayi hai to pehle bata dein."},{"s":"B","de":"Es liegt zu Hause, ich habe es neulich beim Aufräumen gesehen.","en":"It's at home, I saw it recently while tidying up.","ur":"Woh ghar par hai, main ne haal hi mein safai ke doran dekha tha."},{"s":"A","de":"Perfekt. Dann trage ich Freitag um halb fünf ein und Sie gehen jetzt bitte ins Wartezimmer.","en":"Perfect. Then I'll enter Friday at half past four and you please go to the waiting room now.","ur":"Bohat acha. To main Jumma saarhe chaar likh deti hoon aur aap ab waiting room chali jayein."},{"s":"B","de":"Vielen Dank, dass Sie mitgedacht haben.","en":"Thank you very much for thinking along.","ur":"Bohat shukriya ke aap ne dhyan dilaya."}]}},"roleplay":{"easy":{"role":"Frau Baumann, Anmeldung","you":"Vater oder Mutter","scene":{"de":"Sie kommen mit Ihrem Sohn in die Praxis. Sie haben einen Termin um drei Uhr.","en":"You arrive at the practice with your son. You have an appointment at three o'clock.","ur":"Aap apne bete ke saath clinic aate hain. Teen baje ka appointment hai."},"start":"n1","nodes":{"n1":{"say":"Guten Tag. Wie kann ich helfen?","goal":{"en":"Say hello and say you have an appointment at three o'clock.","ur":"Salam karein aur kahein ke teen baje ka appointment hai."},"options":["Guten Tag. Ich habe einen Termin um drei Uhr.","Guten Tag, wir haben einen Termin um drei Uhr."],"fallback":"Haben Sie einen Termin?","accept":[{"kw":["termin","drei"],"next":"n2"},{"kw":["termin"],"next":"n2"}]},"n2":{"say":"Wie ist Ihr Name?","goal":{"en":"Say your family name is Khan and your son is called Yusuf.","ur":"Kahein ke aap ka naam Khan hai aur bete ka naam Yusuf hai."},"options":["Khan. Mein Sohn heißt Yusuf Khan.","Mein Name ist Khan."],"fallback":"Ihren Namen bitte.","accept":[{"kw":["khan","yusuf"],"next":"n3"},{"kw":["khan"],"next":"n3"}]},"n3":{"say":"Haben Sie die Versichertenkarte?","goal":{"en":"Say yes, here it is.","ur":"Kahein: ji haan, yeh raha."},"options":["Ja, hier ist sie.","Ja, hier bitte."],"fallback":"Die Karte, bitte.","accept":[{"kw":["ja","hier"],"next":"n4"},{"kw":["hier"],"next":"n4"}]},"n4":{"say":"Danke. Waren Sie schon einmal hier?","goal":{"en":"Say no, you are new.","ur":"Kahein: nahi, hum naye hain."},"options":["Nein, wir sind neu.","Nein, wir waren noch nie hier."],"fallback":"Sind Sie zum ersten Mal hier?","accept":[{"kw":["nein","neu"],"next":"n5"},{"kw":["neu"],"next":"n5"},{"kw":["nein"],"next":"n5"}]},"n5":{"say":"Dann füllen Sie bitte dieses Formular aus.","goal":{"en":"Ask where you should sign.","ur":"Poochein ke dastakhat kahan karne hain."},"options":["Wo soll ich unterschreiben?","Wo muss ich unterschreiben?"],"fallback":"Haben Sie eine Frage zum Formular?","accept":[{"kw":["wo","unterschreiben"],"next":"n6"},{"kw":["unterschreiben"],"next":"n6"}]},"n6":{"say":"Hier unten, bitte.","goal":{"en":"Say you're done and ask where you wait.","ur":"Kahein ke ho gaya aur poochein kahan intezaar karna hai."},"options":["Fertig. Und wo warten wir?","Fertig. Wo ist das Wartezimmer?"],"fallback":"Sind Sie fertig?","accept":[{"kw":["wo","warten"],"reply":"Im Wartezimmer links. Wir rufen Sie auf.","next":"END"},{"kw":["wartezimmer"],"reply":"Das Wartezimmer ist links. Wir rufen Sie auf.","next":"END"}]}}},"hard":{"role":"Frau Baumann, Anmeldung","you":"Vater oder Mutter","scene":{"de":"Ihre Versichertenkarte ist abgelaufen und Sie haben umgezogen. Sie brauchen außerdem ein Attest für die Kita.","en":"Your insurance card has expired and you have moved. You also need a sick note for the daycare.","ur":"Aap ka insurance card purana ho gaya hai aur aap ne ghar badla hai. Kita ke liye certificate bhi chahiye."},"start":"n1","nodes":{"n1":{"say":"Guten Tag. Die Karte ist leider abgelaufen. Haben Sie eine neue bekommen?","goal":{"en":"Say yes, but the new card is at home, and ask whether that is a problem.","ur":"Kahein haan, lekin naya card ghar par hai, aur poochein ke kya yeh masla hai."},"options":["Ja, aber die neue Karte liegt zu Hause. Ist das ein Problem?","Die neue Karte ist zu Hause. Ist das ein Problem?"],"fallback":"Haben Sie eine neue Karte oder nicht?","accept":[{"kw":["hause","problem"],"next":"n2"},{"kw":["hause"],"next":"n2"},{"kw":["problem"],"next":"n2"}]},"n2":{"say":"Heute geht es noch. Bringen Sie die Karte bitte innerhalb von zehn Tagen vorbei.","goal":{"en":"Agree, and mention that you have also changed your address.","ur":"Haan kahein, aur batayein ke aap ka address bhi badal gaya hai."},"options":["Das mache ich. Ich habe auch die Adresse gewechselt.","Gut. Meine Adresse hat sich auch geändert."],"fallback":"Ist noch etwas anders als beim letzten Mal?","accept":[{"kw":["adresse","gewechselt"],"next":"n3"},{"kw":["adresse"],"next":"n3"}]},"n3":{"say":"Gut, dass Sie das sagen. Wie lautet die neue Adresse?","goal":{"en":"Give the address: Gartenstraße 27 in Düsseldorf.","ur":"Address batayein: Gartenstrasse 27, Düsseldorf."},"options":["Gartenstraße siebenundzwanzig in Düsseldorf.","Gartenstraße siebenundzwanzig, Düsseldorf."],"fallback":"Straße und Hausnummer, bitte.","accept":[{"kw":["gartenstraße","düsseldorf"],"next":"n4"},{"kw":["gartenstraße"],"next":"n4"}]},"n4":{"say":"Danke, ist notiert. Brauchen Sie heute sonst noch etwas?","goal":{"en":"Say yes, you need a sick note for the daycare.","ur":"Kahein haan, kita ke liye medical certificate chahiye."},"options":["Ja, ich brauche ein Attest für die Kita.","Wir brauchen noch ein Attest für die Kita."],"fallback":"Sonst noch etwas?","accept":[{"kw":["attest","kita"],"next":"n5"},{"kw":["attest"],"next":"n5"}]},"n5":{"say":"Sagen Sie das bitte dem Arzt im Sprechzimmer, dann schreibt er es direkt auf.","goal":{"en":"Ask whether you can pick the certificate up later.","ur":"Poochein ke kya certificate baad mein le sakte hain."},"options":["Können wir das Attest später abholen?","Kann ich das Attest morgen abholen?"],"fallback":"Haben Sie dazu eine Frage?","accept":[{"kw":["attest","abholen"],"next":"n6"},{"kw":["abholen"],"next":"n6"}]},"n6":{"say":"Natürlich. Ab morgen liegt es hier an der Anmeldung bereit.","goal":{"en":"Thank her and ask where the waiting room for sick children is.","ur":"Shukriya kahein aur poochein ke beemar bachon ka waiting room kahan hai."},"options":["Danke. Wo ist das Wartezimmer für kranke Kinder?","Vielen Dank. Wo ist das Wartezimmer für kranke Kinder?"],"fallback":"Wissen Sie, wo Sie warten müssen?","accept":[{"kw":["wartezimmer","kranke"],"reply":"Den Gang entlang und dann rechts. Wir rufen Sie auf.","next":"END"},{"kw":["wartezimmer"],"reply":"Den Gang entlang und dann rechts. Wir rufen Sie auf.","next":"END"}]}}}}},{"id":"symptome","order":3,"icon":"🌡️","title":{"de":"Symptome beschreiben","en":"Describing the symptoms","ur":"Takleef batana"},"angle":"In the consulting room with the doctor · Doctor ke kamre mein","words":["hals","wehtun","erkältung","ausschlag","durchfall","appetit","schlafen","abstrich","antibiotikum","virus"],"dialogues":{"A1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Hallo Yusuf. Was ist los?","en":"Hello Yusuf. What's the matter?","ur":"Hello Yusuf. Kya masla hai?"},{"s":"B","de":"Er hat seit zwei Tagen Fieber.","en":"He has had a fever for two days.","ur":"Usay do din se bukhar hai."},{"s":"A","de":"Wie hoch ist das Fieber?","en":"How high is the fever?","ur":"Bukhar kitna tez hai?"},{"s":"B","de":"Heute Morgen achtunddreißig Grad.","en":"This morning thirty-eight degrees.","ur":"Aaj subh athtees degree."},{"s":"A","de":"Hat er Schmerzen?","en":"Is he in pain?","ur":"Kya usay dard hai?"},{"s":"B","de":"Ja, sein Hals tut weh.","en":"Yes, his throat hurts.","ur":"Ji haan, us ke gale mein dard hai."},{"s":"A","de":"Isst er normal?","en":"Is he eating normally?","ur":"Kya woh normal kha raha hai?"},{"s":"B","de":"Nein, er isst sehr wenig.","en":"No, he eats very little.","ur":"Nahi, woh bohat kam khata hai."},{"s":"A","de":"Trinkt er genug?","en":"Is he drinking enough?","ur":"Kya woh kaafi pee raha hai?"},{"s":"B","de":"Er trinkt Wasser und Tee.","en":"He drinks water and tea.","ur":"Woh paani aur chai peeta hai."},{"s":"A","de":"Gut. Ich schaue in den Hals.","en":"Good. I'll look into his throat.","ur":"Acha. Main gala dekhta hoon."},{"s":"A","de":"Mach bitte den Mund auf, Yusuf.","en":"Please open your mouth, Yusuf.","ur":"Yusuf, munh kholo."},{"s":"B","de":"Mach den Mund auf. Gut so.","en":"Open your mouth. Well done.","ur":"Munh kholo. Shabash."},{"s":"A","de":"Der Hals ist rot. Die Ohren sind in Ordnung.","en":"The throat is red. The ears are fine.","ur":"Gala laal hai. Kaan theek hain."},{"s":"B","de":"Ist es schlimm?","en":"Is it serious?","ur":"Kya yeh serious hai?"},{"s":"A","de":"Nein, es ist nur eine Erkältung.","en":"No, it's only a cold.","ur":"Nahi, yeh sirf zukam hai."},{"s":"B","de":"Gott sei Dank. Vielen Dank, Herr Doktor.","en":"Thank God. Thank you very much, doctor.","ur":"Shukar hai. Bohat shukriya, doctor sahab."}]},"A2":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Khan. Setzen Sie sich. Was führt Sie heute zu mir?","en":"Hello, Mrs Khan. Have a seat. What brings you to me today?","ur":"Salam, Frau Khan. Baith jayein. Aaj kis silsile mein aayi hain?"},{"s":"B","de":"Amina hat seit gestern hohes Fieber und sie fasst sich immer ans Ohr.","en":"Amina has had a high fever since yesterday and she keeps touching her ear.","ur":"Amina ko kal se tez bukhar hai aur woh baar baar kaan ko haath lagati hai."},{"s":"A","de":"Wie hoch war das Fieber gestern Abend?","en":"How high was the fever yesterday evening?","ur":"Kal sham bukhar kitna tha?"},{"s":"B","de":"Neununddreißig Komma zwei. Ich habe ihr dann Fiebersaft gegeben.","en":"Thirty-nine point two. I then gave her fever syrup.","ur":"Unatalees point do. Phir main ne usay bukhar ka syrup diya."},{"s":"A","de":"Das war richtig. Hat der Saft geholfen?","en":"That was right. Did the syrup help?","ur":"Yeh theek kiya. Kya syrup se faida hua?"},{"s":"B","de":"Für ein paar Stunden ja, dann ist das Fieber wieder gestiegen.","en":"For a few hours yes, then the fever went up again.","ur":"Kuch ghanton ke liye haan, phir bukhar dobara barh gaya."},{"s":"A","de":"Hat sie Durchfall oder hat sie erbrochen?","en":"Does she have diarrhoea or has she vomited?","ur":"Kya usay dast hain ya us ne ulti ki hai?"},{"s":"B","de":"Durchfall hatte sie einmal, erbrochen hat sie nicht.","en":"She had diarrhoea once, she hasn't vomited.","ur":"Ek baar dast aaye, ulti nahi ki."},{"s":"A","de":"Und wie schläft sie nachts?","en":"And how does she sleep at night?","ur":"Aur raat ko woh kaise soti hai?"},{"s":"B","de":"Schlecht. Sie wacht oft auf und weint.","en":"Badly. She often wakes up and cries.","ur":"Buri tarah. Woh aksar jaag jati hai aur roti hai."},{"s":"A","de":"Das passt zu einer Mittelohrentzündung. Ich schaue mir das Ohr an.","en":"That fits with a middle ear infection. I'll take a look at the ear.","ur":"Yeh kaan ki sozish se milta hai. Main kaan dekhta hoon."},{"s":"B","de":"Amina, halt bitte kurz still. Der Arzt tut dir nicht weh.","en":"Amina, please keep still for a moment. The doctor won't hurt you.","ur":"Amina, thora ruk jao. Doctor tumhein dard nahi dega."},{"s":"A","de":"So, fertig. Das rechte Trommelfell ist gerötet, das linke ist normal.","en":"There, done. The right eardrum is reddened, the left one is normal.","ur":"Lo, ho gaya. Dayan parda laal hai, baayan normal hai."},{"s":"B","de":"Braucht sie jetzt ein Antibiotikum?","en":"Does she need an antibiotic now?","ur":"Kya usay ab antibiotic chahiye?"},{"s":"A","de":"Noch nicht. Wir warten zwei Tage ab und behandeln erst nur die Schmerzen.","en":"Not yet. We'll wait two days and first only treat the pain.","ur":"Abhi nahi. Hum do din dekhte hain aur pehle sirf dard ka ilaaj karte hain."},{"s":"B","de":"Und wann soll ich mich wieder melden?","en":"And when should I get in touch again?","ur":"Aur main dobara kab rabta karoon?"},{"s":"A","de":"Wenn das Fieber nach zwei Tagen nicht sinkt oder wenn das Ohr läuft, kommen Sie sofort.","en":"If the fever doesn't go down after two days, or if the ear discharges, come immediately.","ur":"Agar do din baad bukhar kam na ho ya kaan se paani aaye to foran aayein."},{"s":"B","de":"Alles klar. Vielen Dank für die Erklärung.","en":"All right. Thank you very much for the explanation.","ur":"Theek hai. Wazahat ka bohat shukriya."}]},"B1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag, Frau Khan. Am Telefon haben Sie gesagt, Yusuf hat einen Ausschlag bekommen.","en":"Hello, Mrs Khan. On the phone you said Yusuf has developed a rash.","ur":"Salam, Frau Khan. Phone par aap ne kaha tha ke Yusuf ko dane nikle hain."},{"s":"B","de":"Ja, seit gestern Nachmittag. Zuerst nur am Bauch, inzwischen auch am Rücken und an den Armen.","en":"Yes, since yesterday afternoon. First only on his tummy, by now also on his back and arms.","ur":"Ji haan, kal dopahar se. Pehle sirf pait par, ab kamar aur baazuon par bhi."},{"s":"A","de":"Juckt der Ausschlag oder tut er weh?","en":"Does the rash itch or does it hurt?","ur":"Kya danon mein khujli hai ya dard?"},{"s":"B","de":"Er kratzt sich ständig, vor allem abends. Wehtun scheint es ihm nicht.","en":"He scratches himself constantly, especially in the evening. It doesn't seem to hurt him.","ur":"Woh baar baar kharoncta hai, khaas kar sham ko. Dard nahi lagta."},{"s":"A","de":"Hatte er vorher Fieber, und wenn ja, wie lange?","en":"Did he have a fever before, and if so, for how long?","ur":"Kya us se pehle bukhar tha, aur agar tha to kitne din?"},{"s":"B","de":"Drei Tage lang hohes Fieber, und genau als das Fieber weg war, kam der Ausschlag.","en":"High fever for three days, and exactly when the fever was gone, the rash came.","ur":"Teen din tez bukhar, aur jab bukhar utra to dane nikal aaye."},{"s":"A","de":"Das ist ein typischer Verlauf. Haben Sie in den letzten Tagen etwas Neues gegeben, ein Medikament oder ein neues Essen?","en":"That is a typical course. Have you given anything new in the last few days, a medication or a new food?","ur":"Yeh aam tareeqa hai. Kya pichle dinon mein koi nayi cheez di, koi dawa ya naya khana?"},{"s":"B","de":"Nur Fiebersaft, den er schon oft bekommen hat. Sonst nichts Neues.","en":"Only fever syrup, which he has often had before. Nothing else new.","ur":"Sirf bukhar ka syrup, jo woh pehle bhi leta raha hai. Aur kuch naya nahi."},{"s":"A","de":"Dann spricht wenig für eine Allergie. Ich untersuche ihn kurz von oben bis unten.","en":"Then there is little to suggest an allergy. I'll examine him briefly from head to toe.","ur":"To allergy ka imkaan kam hai. Main us ka poora muaina karta hoon."},{"s":"B","de":"Soll ich ihn ausziehen?","en":"Should I undress him?","ur":"Kya main us ke kapre utaar doon?"},{"s":"A","de":"Bis auf die Windel, ja. Danke. — Die Flecken sind blass und verschwinden, wenn ich draufdrücke.","en":"Down to the nappy, yes. Thank you. — The spots are pale and disappear when I press on them.","ur":"Sirf nappy chhor kar, haan. Shukriya. — Nishan halke hain aur dabane par ghayab ho jate hain."},{"s":"B","de":"Ist das ein gutes oder ein schlechtes Zeichen?","en":"Is that a good or a bad sign?","ur":"Kya yeh acha ishara hai ya bura?"},{"s":"A","de":"Ein gutes. Flecken, die beim Drücken bleiben, wären ein Warnzeichen. Das ist hier nicht der Fall.","en":"A good one. Spots that stay when pressed would be a warning sign. That is not the case here.","ur":"Acha. Jo nishan dabane par bhi rahein woh khatre ki alamat hote hain. Yahan aisa nahi hai."},{"s":"B","de":"Also brauchen wir kein Antibiotikum?","en":"So we don't need an antibiotic?","ur":"To humein antibiotic ki zaroorat nahi?"},{"s":"A","de":"Nein, dahinter steckt ein Virus. Antibiotika wirken gegen Viren überhaupt nicht.","en":"No, there is a virus behind it. Antibiotics don't work against viruses at all.","ur":"Nahi, is ke peeche virus hai. Antibiotic virus par bilkul asar nahi karti."},{"s":"B","de":"Wie lange bleibt der Ausschlag denn?","en":"How long will the rash stay then?","ur":"To dane kitne din rahenge?"},{"s":"A","de":"Meistens drei bis vier Tage. Gegen das Jucken gebe ich Ihnen eine Lotion mit.","en":"Usually three to four days. For the itching I'll give you a lotion to take with you.","ur":"Aam tor par teen chaar din. Khujli ke liye main aap ko lotion de deta hoon."},{"s":"B","de":"Darf er wieder in die Kita?","en":"Is he allowed back at daycare?","ur":"Kya woh dobara kita ja sakta hai?"},{"s":"A","de":"Sobald er vierundzwanzig Stunden fieberfrei ist, ja.","en":"As soon as he has been fever-free for twenty-four hours, yes.","ur":"Jab woh chobees ghante bukhar ke baghair rahe, tab haan."}]},"B2":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Sie hatten am Telefon erwähnt, dass die Beschwerden immer wiederkehren. Schildern Sie mir das bitte einmal im Zusammenhang.","en":"You mentioned on the phone that the symptoms keep coming back. Please describe it to me as a whole.","ur":"Aap ne phone par kaha tha ke takleef baar baar wapis aati hai. Meherbani kar ke poori baat tarteeb se batayein."},{"s":"B","de":"Es fing vor etwa drei Monaten an. Seitdem hat Amina alle zwei bis drei Wochen Bauchschmerzen, meistens morgens vor der Kita.","en":"It started about three months ago. Since then Amina has had stomach ache every two to three weeks, mostly in the mornings before daycare.","ur":"Taqreeban teen mahine pehle shuru hua. Tab se Amina ko har do teen hafte baad pait dard hota hai, aksar subh kita se pehle."},{"s":"A","de":"Das zeitliche Muster ist auffällig. Treten die Schmerzen auch am Wochenende oder in den Ferien auf?","en":"The timing pattern is striking. Does the pain also occur at the weekend or in the holidays?","ur":"Waqt ka yeh andaaz ghaur talab hai. Kya dard weekend ya chhuttiyon mein bhi hota hai?"},{"s":"B","de":"Jetzt, wo Sie es sagen — deutlich seltener. In den Sommerferien war sie zwei Wochen komplett beschwerdefrei.","en":"Now that you mention it — noticeably less often. In the summer holidays she was completely free of symptoms for two weeks.","ur":"Ab jab aap ne kaha — kaafi kam. Garmi ki chhuttiyon mein do hafte bilkul theek rahi."},{"s":"A","de":"Das schließt eine körperliche Ursache nicht aus, macht sie aber weniger wahrscheinlich. Wie verhält es sich mit Appetit, Gewicht und Stuhlgang?","en":"That doesn't rule out a physical cause, but makes it less likely. What about appetite, weight and bowel movements?","ur":"Is se jismani wajah khatam nahi hoti, lekin us ka imkaan kam ho jata hai. Bhook, wazan aur pait ka kya haal hai?"},{"s":"B","de":"Der Appetit schwankt, das Gewicht ist meines Wissens stabil. Verstopfung hatte sie im Winter häufiger.","en":"The appetite fluctuates, the weight is stable as far as I know. She had constipation more often in the winter.","ur":"Bhook kabhi kam kabhi zyada, wazan mere khayal mein theek hai. Sardiyon mein qabz zyada hoti thi."},{"s":"A","de":"Verstopfung ist bei Kindern eine der häufigsten Ursachen für wiederkehrende Bauchschmerzen und wird oft übersehen.","en":"Constipation is one of the most common causes of recurring stomach ache in children and is often overlooked.","ur":"Bachon mein baar baar pait dard ki sab se aam wajah qabz hoti hai aur aksar nazar andaaz ho jati hai."},{"s":"B","de":"Damit hätte ich nicht gerechnet. Ich dachte eher an eine Unverträglichkeit.","en":"I wouldn't have expected that. I was rather thinking of an intolerance.","ur":"Main ne yeh socha hi nahi tha. Main to samajh rahi thi koi cheez us ko nahi lagti."},{"s":"A","de":"Das lässt sich prüfen, aber ungezielte Tests führen bei Kindern häufig zu falschen Schlüssen. Ich würde strukturiert vorgehen.","en":"That can be checked, but untargeted tests in children often lead to false conclusions. I would proceed in a structured way.","ur":"Yeh dekha ja sakta hai, lekin bila wajah test bachon mein aksar ghalat nateeje dete hain. Main tarteeb se aage barhna chahoonga."},{"s":"B","de":"Was heißt das konkret?","en":"What does that mean concretely?","ur":"Is ka amli matlab kya hai?"},{"s":"A","de":"Zuerst tasten wir den Bauch ab und machen eine Urinprobe. Dann führen Sie zwei Wochen ein Tagebuch über Essen, Stuhlgang und Schmerzen.","en":"First we palpate the abdomen and do a urine sample. Then you keep a diary of food, bowel movements and pain for two weeks.","ur":"Pehle hum pait ko haath se dekhte hain aur urine test karte hain. Phir aap do hafte khane, pait aur dard ki diary rakhein."},{"s":"B","de":"Und falls dabei nichts herauskommt?","en":"And if nothing comes out of that?","ur":"Aur agar us se kuch na nikle?"},{"s":"A","de":"Dann sprechen wir über Stress in der Kita. Bauchschmerzen sind bei Vierjährigen eine völlig normale Reaktion auf Druck, und das ist keine eingebildete Krankheit.","en":"Then we talk about stress at daycare. Stomach ache is a completely normal reaction to pressure in four-year-olds, and that is not an imagined illness.","ur":"To hum kita ke stress par baat karenge. Chaar saal ke bachon mein dabao ka yeh bilkul normal rad-e-amal hai, aur yeh farzi beemari nahi."},{"s":"B","de":"Das beruhigt mich, ehrlich gesagt. Ich hatte Angst, etwas übersehen zu haben.","en":"That reassures me, to be honest. I was afraid I had overlooked something.","ur":"Sach kahoon to isse mujhe tasalli hui. Mujhe dar tha ke main ne kuch nazar andaaz kiya hai."},{"s":"A","de":"Sie haben sie hergebracht, statt es auszusitzen. Genau das ist richtig gewesen.","en":"You brought her in instead of sitting it out. That was exactly the right thing.","ur":"Aap us ko le aayin, baithe nahi rahin. Yehi theek tha."},{"s":"B","de":"Wann sollen wir wiederkommen?","en":"When should we come back?","ur":"Hum kab dobara aayein?"},{"s":"A","de":"In zwei Wochen mit dem Tagebuch. Sollten die Schmerzen sie nachts aufwecken oder Blut im Stuhl auftreten, sofort.","en":"In two weeks with the diary. Should the pain wake her at night or blood appear in the stool, immediately.","ur":"Do hafte baad diary ke saath. Agar dard raat ko jaga de ya pait se khoon aaye to foran."},{"s":"B","de":"Verstanden. Ich schreibe alles mit.","en":"Understood. I'll note everything down.","ur":"Samajh gayi. Main sab likh loongi."}]}},"roleplay":{"easy":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Sie sind mit Yusuf im Sprechzimmer. Er hat seit zwei Tagen Fieber und Halsschmerzen.","en":"You are in the consulting room with Yusuf. He has had a fever and a sore throat for two days.","ur":"Aap Yusuf ke saath doctor ke kamre mein hain. Usay do din se bukhar aur gale mein dard hai."},"start":"n1","nodes":{"n1":{"say":"Hallo Yusuf. Guten Tag, Frau Khan. Was ist los?","goal":{"en":"Say he has had a fever for two days.","ur":"Kahein ke usay do din se bukhar hai."},"options":["Er hat seit zwei Tagen Fieber.","Yusuf hat seit zwei Tagen Fieber."],"fallback":"Was hat er denn?","accept":[{"kw":["fieber","zwei"],"next":"n2"},{"kw":["fieber"],"next":"n2"}]},"n2":{"say":"Wie hoch ist das Fieber?","goal":{"en":"Say: this morning thirty-eight degrees.","ur":"Kahein: aaj subh athtees degree."},"options":["Heute Morgen achtunddreißig Grad.","Achtunddreißig Grad heute Morgen."],"fallback":"Haben Sie gemessen? Wie viel Grad?","accept":[{"kw":["achtunddreißig","grad"],"next":"n3"},{"kw":["grad"],"next":"n3"}]},"n3":{"say":"Hat er Schmerzen?","goal":{"en":"Say yes, his throat hurts.","ur":"Kahein haan, us ke gale mein dard hai."},"options":["Ja, sein Hals tut weh.","Ja, er hat Halsschmerzen."],"fallback":"Wo tut es ihm weh?","accept":[{"kw":["hals","weh"],"next":"n4"},{"kw":["halsschmerzen"],"next":"n4"},{"kw":["hals"],"next":"n4"}]},"n4":{"say":"Isst und trinkt er normal?","goal":{"en":"Say he eats little but drinks water and tea.","ur":"Kahein ke woh kam khata hai lekin paani aur chai peeta hai."},"options":["Er isst wenig, aber er trinkt Wasser und Tee.","Er isst sehr wenig. Er trinkt Wasser und Tee."],"fallback":"Wie ist es mit Essen und Trinken?","accept":[{"kw":["isst","trinkt"],"next":"n5"},{"kw":["trinkt"],"next":"n5"},{"kw":["wenig"],"next":"n5"}]},"n5":{"say":"Gut. Ich schaue in den Hals. — Der Hals ist rot, die Ohren sind in Ordnung.","goal":{"en":"Ask whether it is serious.","ur":"Poochein ke kya yeh serious hai."},"options":["Ist es schlimm?","Ist das schlimm?"],"fallback":"Haben Sie eine Frage dazu?","accept":[{"kw":["schlimm"],"next":"n6"},{"kw":["ist"],"next":"n6"}]},"n6":{"say":"Nein, es ist nur eine Erkältung. In ein paar Tagen geht es ihm besser.","goal":{"en":"Say thank you to the doctor.","ur":"Doctor ka shukriya ada karein."},"options":["Vielen Dank, Herr Doktor.","Danke schön, Herr Doktor."],"fallback":"Alles klar so weit?","accept":[{"kw":["danke"],"reply":"Gern geschehen. Gute Besserung, Yusuf!","next":"END"},{"kw":["dank"],"reply":"Gern geschehen. Gute Besserung, Yusuf!","next":"END"}]}}},"hard":{"role":"Doktor Weber","you":"Vater oder Mutter","scene":{"de":"Yusuf hatte drei Tage Fieber. Als das Fieber weg war, kam ein Ausschlag am Bauch und am Rücken.","en":"Yusuf had a fever for three days. When the fever was gone, a rash appeared on his tummy and back.","ur":"Yusuf ko teen din bukhar tha. Bukhar utarne par pait aur kamar par dane nikal aaye."},"start":"n1","nodes":{"n1":{"say":"Guten Tag, Frau Khan. Am Telefon haben Sie gesagt, Yusuf hat einen Ausschlag bekommen. Seit wann genau?","goal":{"en":"Say: since yesterday afternoon, first on the tummy, now on the back too.","ur":"Kahein: kal dopahar se, pehle pait par, ab kamar par bhi."},"options":["Seit gestern Nachmittag, zuerst am Bauch, inzwischen auch am Rücken.","Seit gestern Nachmittag. Zuerst am Bauch, jetzt auch am Rücken."],"fallback":"Wann hat der Ausschlag angefangen und wo?","accept":[{"kw":["gestern","bauch","rücken"],"next":"n2"},{"kw":["bauch"],"next":"n2"},{"kw":["gestern"],"next":"n2"}]},"n2":{"say":"Juckt der Ausschlag oder tut er weh?","goal":{"en":"Say he scratches constantly, especially in the evening, but it doesn't seem to hurt.","ur":"Kahein ke woh baar baar kharoncta hai, khaas kar sham ko, lekin dard nahi lagta."},"options":["Er kratzt sich ständig, vor allem abends. Wehtun scheint es ihm nicht.","Er kratzt sich viel, aber es tut ihm nicht weh."],"fallback":"Kratzt er sich? Hat er Schmerzen dabei?","accept":[{"kw":["kratzt","weh"],"next":"n3"},{"kw":["kratzt"],"next":"n3"},{"kw":["juckt"],"next":"n3"}]},"n3":{"say":"Hatte er vorher Fieber, und wenn ja, wie lange?","goal":{"en":"Say: three days of high fever, and the rash came exactly when the fever went.","ur":"Kahein: teen din tez bukhar, aur jab bukhar utra tab dane nikle."},"options":["Drei Tage lang hohes Fieber, und genau als das Fieber weg war, kam der Ausschlag.","Er hatte drei Tage Fieber. Dann kam der Ausschlag."],"fallback":"Wie war das mit dem Fieber?","accept":[{"kw":["drei","fieber","ausschlag"],"next":"n4"},{"kw":["drei","fieber"],"next":"n4"},{"kw":["fieber"],"next":"n4"}]},"n4":{"say":"Haben Sie in den letzten Tagen etwas Neues gegeben, ein Medikament oder ein neues Essen?","goal":{"en":"Say only fever syrup, which he has often had before, nothing else new.","ur":"Kahein sirf bukhar ka syrup jo woh pehle bhi le chuka hai, aur kuch naya nahi."},"options":["Nur Fiebersaft, den er schon oft bekommen hat. Sonst nichts Neues.","Nur Fiebersaft. Sonst nichts Neues."],"fallback":"Ein neues Medikament? Ein neues Lebensmittel?","accept":[{"kw":["fiebersaft","nichts"],"next":"n5"},{"kw":["fiebersaft"],"next":"n5"},{"kw":["nichts"],"next":"n5"}]},"n5":{"say":"Die Flecken sind blass und verschwinden, wenn ich draufdrücke.","goal":{"en":"Ask whether that is a good or a bad sign.","ur":"Poochein ke yeh acha ishara hai ya bura."},"options":["Ist das ein gutes oder ein schlechtes Zeichen?","Ist das gut oder schlecht?"],"fallback":"Möchten Sie wissen, was das bedeutet?","accept":[{"kw":["gutes","zeichen"],"next":"n6"},{"kw":["zeichen"],"next":"n6"},{"kw":["gut"],"next":"n6"}]},"n6":{"say":"Ein gutes. Flecken, die beim Drücken bleiben, wären ein Warnzeichen. Dahinter steckt hier ein Virus.","goal":{"en":"Ask whether you need an antibiotic then.","ur":"Poochein ke kya phir antibiotic chahiye."},"options":["Brauchen wir dann ein Antibiotikum?","Also brauchen wir kein Antibiotikum?"],"fallback":"Haben Sie eine Frage zur Behandlung?","accept":[{"kw":["antibiotikum"],"next":"n7"},{"kw":["antibiotika"],"next":"n7"}]},"n7":{"say":"Nein, Antibiotika wirken gegen Viren überhaupt nicht. Gegen das Jucken gebe ich Ihnen eine Lotion mit.","goal":{"en":"Ask whether he is allowed back at daycare.","ur":"Poochein ke kya woh dobara kita ja sakta hai."},"options":["Darf er wieder in die Kita?","Wann darf er wieder in die Kita?"],"fallback":"Noch eine Frage?","accept":[{"kw":["kita"],"reply":"Sobald er vierundzwanzig Stunden fieberfrei ist, ja. Gute Besserung!","next":"END"},{"kw":["darf"],"reply":"Sobald er vierundzwanzig Stunden fieberfrei ist, ja. Gute Besserung!","next":"END"}]}}}}},{"id":"impfung","order":4,"icon":"💉","title":{"de":"Vorsorge und Impfung","en":"Check-up and vaccination","ur":"Check-up aur teeka"},"angle":"The U check-up, measuring, and the vaccination · U check-up, napna aur teeka","words":["impfung","impfpass","gesund","größe","wiegen","spritze","nebenwirkung","masern","aufklärung","einwilligung"],"dialogues":{"A1":{"speakers":{"A":"Doktor Weber","B":"Frau Khan (Mutter)"},"right":"B","lines":[{"s":"A","de":"Guten Tag. Heute ist die U8. Wie geht es Yusuf?","en":"Hello. Today is the U8 check-up. How is Yusuf?","ur":"Salam. Aaj U8 check-up hai. Yusuf kaisa hai?"},{"s":"B","de":"Gut. Er ist gesund.","en":"Good. He is healthy.","ur":"Acha. Woh theek hai."},{"s":"A","de":"Zuerst messen wir Größe und Gewicht.","en":"First we measure height and weight.","ur":"Pehle hum qad aur wazan naapte hain."},{"s":"B","de":"Yusuf, stell dich bitte hierhin.","en":"Yusuf, please stand here.","ur":"Yusuf, yahan khare ho jao."},{"s":"A","de":"Er ist einen Meter groß und wiegt siebzehn Kilo.","en":"He is one metre tall and weighs seventeen kilos.","ur":"Woh ek meter lamba hai aur sattarah kilo ka hai."},{"s":"B","de":"Ist das normal?","en":"Is that normal?","ur":"Kya yeh normal hai?"},{"s":"A","de":"Ja, das ist sehr gut.","en":"Yes, that is very good.","ur":"Ji haan, yeh bohat acha hai."},{"s":"A","de":"Yusuf, kannst du auf einem Bein stehen?","en":"Yusuf, can you stand on one leg?","ur":"Yusuf, kya tum ek taang par khare ho sakte ho?"},{"s":"B","de":"Ja, d
