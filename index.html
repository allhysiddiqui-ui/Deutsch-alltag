stion maybe isn't from stress at all, but from the sleep itself?","ur":"Yani meri thakan shayad stress se nahi, balke neend se hai?"},{"s":"A","de":"Möglich. Beides kann sich auch gegenseitig verstärken. Ich möchte das sauber trennen, statt vorschnell zu urteilen.","en":"Possibly. The two can also reinforce each other. I want to separate this cleanly rather than judge prematurely.","ur":"Mumkin. Dono ek doosre ko barha bhi sakte hain. Main jaldi faisla karne ke bajaye isay saaf alag karna chahta hoon."},{"s":"B","de":"Wie gehen Sie da methodisch vor?","en":"How do you proceed methodically there?","ur":"Aap is mein tarteeb se kaise aage barhte hain?"},{"s":"A","de":"Erst Basiswerte aus dem Blut, dann ein Schlaflabor oder ein Gerät für zu Hause, das nachts Atmung und Sauerstoff misst.","en":"First baseline values from the blood, then a sleep lab or a home device that measures breathing and oxygen at night.","ur":"Pehle khoon se bunyadi values, phir sleep lab ya ghar ka aala jo raat ko saans aur oxygen naapta hai."},{"s":"B","de":"Ein Gerät für zu Hause klingt machbar. Bekomme ich das über Sie oder über einen Facharzt?","en":"A home device sounds doable. Do I get that through you or through a specialist?","ur":"Ghar wala aala kar-e-amal lagta hai. Yeh aap ke zariye milega ya specialist se?"},{"s":"A","de":"Die Voruntersuchung mache ich, für die eigentliche Diagnostik überweise ich Sie gegebenenfalls zum Schlafmediziner.","en":"I do the preliminary examination; for the actual diagnostics I'll refer you to a sleep physician if needed.","ur":"Ibtidai muaina main karta hoon, asli tashkhees ke liye zaroorat par sleep doctor ke paas bhej doonga."},{"s":"B","de":"Und bis dahin? Ich kann nicht einfach wochenlang auf einen Termin warten und weiter so müde sein.","en":"And until then? I can't just wait weeks for an appointment and stay this tired.","ur":"Aur tab tak? Main hafton appointment ka intezaar kar ke itni thaki nahi reh sakti."},{"s":"A","de":"Völlig berechtigt. Wir verbessern parallel die Schlafhygiene und ich gebe Ihnen konkrete Punkte mit, keine leeren Ratschläge.","en":"Completely fair. In parallel we'll improve sleep hygiene, and I'll give you concrete points, not empty advice.","ur":"Bilkul jaiz. Sath sath hum neend ki aadat behtar karenge, aur main aap ko amli baatein doonga, khokhle mashware nahi."},{"s":"B","de":"Das schätze ich. Ich habe schon zu oft gehört, ich solle einfach entspannen.","en":"I appreciate that. I've too often heard I should just relax.","ur":"Yeh mujhe pasand hai. Mujhe aksar kaha gaya ke bas sukoon karo."},{"s":"A","de":"Entspannung ist ein Werkzeug, keine Diagnose. Lassen Sie uns mit Fakten arbeiten, dann finden wir die Ursache.","en":"Relaxation is a tool, not a diagnosis. Let's work with facts, then we'll find the cause.","ur":"Sukoon ek zariya hai, tashkhees nahi. Aayein haqaiq se kaam karein, phir wajah mil jaye gi."},{"s":"B","de":"Einverstanden. Fangen wir mit der Blutabnahme an.","en":"Agreed. Let's start with the blood test.","ur":"Manzoor. Khoon ke test se shuru karte hain."}]}},"roleplay":{"easy":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Sie sind beim Hausarzt. Sie sind seit zwei Wochen sehr müde und schlapp.","en":"You're at the family doctor. You've been very tired and run-down for two weeks.","ur":"Aap family doctor ke paas hain. Do hafte se bohat thaki aur nidhaal hain."},"start":"n1","nodes":{"n1":{"say":"Guten Tag, Frau Yilmaz. Was fehlt Ihnen?","goal":{"en":"Say you are very tired and run-down.","ur":"Kahein ke aap bohat thaki aur nidhaal hain."},"options":["Ich bin sehr müde und schlapp.","Ich fühle mich müde und schlapp."],"fallback":"Was für Beschwerden haben Sie?","accept":[{"kw":["müde","schlapp"],"next":"n2"},{"kw":["müde"],"next":"n2"}]},"n2":{"say":"Seit wann geht das so?","goal":{"en":"Say: for about two weeks.","ur":"Kahein: taqreeban do hafte se."},"options":["Seit ungefähr zwei Wochen.","Seit zwei Wochen."],"fallback":"Wie lange schon?","accept":[{"kw":["zwei","wochen"],"next":"n3"},{"kw":["wochen"],"next":"n3"}]},"n3":{"say":"Schlafen Sie gut?","goal":{"en":"Say no, you often wake up.","ur":"Kahein: nahi, aksar jaag jati hoon."},"options":["Nein, ich wache oft auf.","Nein, ich schlafe schlecht."],"fallback":"Wie ist Ihr Schlaf?","accept":[{"kw":["nein","auf"],"next":"n4"},{"kw":["schlecht"],"next":"n4"},{"kw":["wache"],"next":"n4"}]},"n4":{"say":"Ich messe den Blutdruck und mache eine Blutabnahme.","goal":{"en":"Ask whether that is serious.","ur":"Poochein ke kya yeh serious hai."},"options":["Ist das schlimm?","Ist das etwas Ernstes?"],"fallback":"Haben Sie eine Frage dazu?","accept":[{"kw":["schlimm"],"next":"n5"},{"kw":["ernst"],"next":"n5"}]},"n5":{"say":"Nein. Wir schauen, ob Ihnen etwas fehlt, zum Beispiel Eisen.","goal":{"en":"Thank the doctor.","ur":"Doctor ka shukriya karein."},"options":["Danke, Herr Doktor.","Vielen Dank, Herr Doktor."],"fallback":"Alles klar so weit?","accept":[{"kw":["danke"],"reply":"Gern. Die Ergebnisse haben wir in ein paar Tagen.","next":"END"},{"kw":["dank"],"reply":"Gern. Bis bald.","next":"END"}]}}},"hard":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Sie schleppen sich seit Wochen durch den Tag und fühlen sich erschöpft und niedergeschlagen. Sie schildern das dem Hausarzt.","en":"You've been dragging yourself through the day for weeks and feel exhausted and low. You describe this to the family doctor.","ur":"Kai hafton se aap mushkil se din guzarte hain aur thake aur udaas mehsoos karte hain. Aap yeh doctor ko batate hain."},"start":"n1","nodes":{"n1":{"say":"Setzen Sie sich, Frau Yilmaz. Erzählen Sie mir in Ruhe, was los ist.","goal":{"en":"Say you've dragged yourself through the day for weeks; even small things exhaust you.","ur":"Kahein ke kai hafton se mushkil se din guzarti hain; chhoti cheezein bhi thaka deti hain."},"options":["Ich schleppe mich seit Wochen durch den Tag. Selbst kleine Dinge strengen mich an.","Seit Wochen bin ich erschöpft, kleine Dinge strengen mich an."],"fallback":"Beschreiben Sie mir Ihre Beschwerden.","accept":[{"kw":["wochen","strengen"],"next":"n2"},{"kw":["erschöpft"],"next":"n2"},{"kw":["schleppe"],"next":"n2"}]},"n2":{"say":"Ist die Erschöpfung eher körperlich, oder fühlen Sie sich auch niedergeschlagen?","goal":{"en":"Say both — you don't feel like doing anything and get irritable quickly.","ur":"Kahein dono — kisi cheez ka dil nahi karta aur jaldi chirh jati hoon."},"options":["Beides. Ich habe zu nichts mehr Lust und bin schnell gereizt.","Beides, ich habe keine Lust und bin gereizt."],"fallback":"Körperlich oder seelisch?","accept":[{"kw":["beides","gereizt"],"next":"n3"},{"kw":["beides"],"next":"n3"},{"kw":["lust"],"next":"n3"}]},"n3":{"say":"Das nehme ich ernst. Solche Beschwerden können körperliche Ursachen haben, aber auch mit der Psyche zusammenhängen.","goal":{"en":"Say you'd honestly prefer a physical explanation.","ur":"Kahein ke sach mein aap ko jismani wajah zyada pasand hogi."},"options":["Ich hätte lieber eine körperliche Erklärung, ehrlich gesagt.","Ehrlich gesagt hoffe ich auf eine körperliche Ursache."],"fallback":"Wie denken Sie darüber?","accept":[{"kw":["körperliche","erklärung"],"next":"n4"},{"kw":["körperliche"],"next":"n4"}]},"n4":{"say":"Das verstehe ich. Zuerst schließe ich körperliche Ursachen aus: Blutabnahme, Blutdruck und Fragen zum Schlaf.","goal":{"en":"Ask what happens if nothing is found in the blood.","ur":"Poochein ke agar khoon mein kuch na mile to kya hoga."},"options":["Und falls im Blut nichts gefunden wird?","Was, wenn das Blut normal ist?"],"fallback":"Haben Sie dazu eine Frage?","accept":[{"kw":["blut","nichts"],"next":"n5"},{"kw":["blut","normal"],"next":"n5"},{"kw":["falls"],"next":"n5"}]},"n5":{"say":"Dann reden wir offen über Stress, Schlaf und mögliche Unterstützung. Das ist kein Zeichen von Schwäche.","goal":{"en":"Say it's good to hear; you thought you just had to push through.","ur":"Kahein sun kar acha laga; aap samjhti thin ke bas bardasht karna hai."},"options":["Das zu hören tut gut. Ich dachte, ich müsste einfach durchhalten.","Das tut gut. Ich dachte, ich muss nur durchhalten."],"fallback":"Wie klingt das für Sie?","accept":[{"kw":["gut","durchhalten"],"next":"n6"},{"kw":["durchhalten"],"next":"n6"},{"kw":["gut"],"next":"n6"}]},"n6":{"say":"Führen Sie bis nächste Woche ein kleines Tagebuch: Schlaf, Essen, Stimmung. Dann sehen wir weiter.","goal":{"en":"Agree and ask how soon you'll have the blood results.","ur":"Haan kahein aur poochein ke khoon ke nateeje kitni jaldi milenge."},"options":["Das mache ich. Wie schnell habe ich die Blutergebnisse?","Gut. Wann bekomme ich die Ergebnisse?"],"fallback":"Noch eine Frage?","accept":[{"kw":["ergebnisse"],"reply":"In wenigen Tagen. Bei etwas Auffälligem melde ich mich sofort.","next":"END"},{"kw":["blutergebnisse"],"reply":"In wenigen Tagen. Ich melde mich.","next":"END"}]}}}}},{"id":"krankschreibung","order":3,"icon":"📄","title":{"de":"Krankschreibung","en":"The sick note","ur":"Medical chhutti ka certificate"},"angle":"Getting a sick note for your employer · Employer ke liye chhutti ka certificate","voices":{"A":"Puck","B":"Kore"},"words":["krankschreibung","arbeitgeber","arbeitsunfähig","attest","verlängern","rückdatieren","elektronisch","krankenkasse","belastbar","wiederkommen"],"dialogues":{"A1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"B","de":"Herr Doktor, ich brauche eine Krankschreibung.","en":"Doctor, I need a sick note.","ur":"Doctor sahab, mujhe chhutti ka certificate chahiye."},{"s":"A","de":"Für wen ist die Krankschreibung?","en":"Who is the sick note for?","ur":"Certificate kis ke liye hai?"},{"s":"B","de":"Für meinen Arbeitgeber.","en":"For my employer.","ur":"Mere employer ke liye."},{"s":"A","de":"Seit wann sind Sie krank?","en":"Since when have you been ill?","ur":"Aap kab se beemar hain?"},{"s":"B","de":"Seit heute Morgen.","en":"Since this morning.","ur":"Aaj subh se."},{"s":"A","de":"Wie lange brauchen Sie sie?","en":"How long do you need it for?","ur":"Aap ko kitne din chahiye?"},{"s":"B","de":"Vielleicht drei Tage?","en":"Maybe three days?","ur":"Shayad teen din?"},{"s":"A","de":"Gut. Ich schreibe Sie bis Freitag krank.","en":"Good. I'll sign you off sick until Friday.","ur":"Acha. Main aap ko Jumma tak chhutti de deta hoon."},{"s":"B","de":"Muss ich das Papier abholen?","en":"Do I have to collect the paper?","ur":"Kya mujhe kaghaz lena hoga?"},{"s":"A","de":"Nein. Die Krankschreibung geht elektronisch an die Krankenkasse.","en":"No. The sick note goes electronically to the health insurance.","ur":"Nahi. Certificate electronic tor par insurance ko chala jata hai."},{"s":"B","de":"Und mein Arbeitgeber?","en":"And my employer?","ur":"Aur mera employer?"},{"s":"A","de":"Der Arbeitgeber bekommt die Information auch. Sagen Sie ihm nur, dass Sie krank sind.","en":"The employer gets the information too. Just tell him you're ill.","ur":"Employer ko bhi maloomat mil jati hai. Bas usay bata dein ke aap beemar hain."},{"s":"B","de":"Und wenn es länger dauert?","en":"And if it takes longer?","ur":"Aur agar zyada din lagein?"},{"s":"A","de":"Dann kommen Sie wieder, und ich verlängere die Krankschreibung.","en":"Then come back, and I'll extend the sick note.","ur":"To dobara aayein, main certificate barha doonga."},{"s":"B","de":"Danke, Herr Doktor.","en":"Thank you, doctor.","ur":"Shukriya, doctor sahab."}]},"A2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"B","de":"Herr Doktor, können Sie mich krankschreiben? Ich schaffe die Arbeit im Moment nicht.","en":"Doctor, can you sign me off sick? I can't manage work at the moment.","ur":"Doctor sahab, kya aap chhutti de sakte hain? Filhaal main kaam nahi kar pa rahi."},{"s":"A","de":"Das klären wir gleich. Was genau macht Ihnen zu schaffen?","en":"We'll sort that out. What exactly is troubling you?","ur":"Abhi tay karte hain. Aap ko kya takleef hai?"},{"s":"B","de":"Die Kopfschmerzen und die Müdigkeit. Ich kann mich kaum konzentrieren.","en":"The headaches and the tiredness. I can hardly concentrate.","ur":"Sar dard aur thakan. Main mushkil se dhyan de pati hoon."},{"s":"A","de":"Verstehe. Arbeiten Sie am Bildschirm oder körperlich?","en":"I see. Do you work at a screen or physically?","ur":"Samjha. Aap screen par kaam karti hain ya jismani?"},{"s":"B","de":"Am Bildschirm, den ganzen Tag.","en":"At a screen, all day.","ur":"Screen par, poora din."},{"s":"A","de":"Dann ist das gerade wirklich nicht ideal. Ich schreibe Sie zunächst für den Rest der Woche krank.","en":"Then that really isn't ideal right now. I'll sign you off for the rest of the week first.","ur":"To yeh abhi bilkul theek nahi. Main pehle hafte ke aakhir tak chhutti de deta hoon."},{"s":"B","de":"Können Sie mich rückwirkend seit gestern krankschreiben? Ich war gestern schon nicht arbeitsfähig.","en":"Can you sign me off retroactively from yesterday? I already couldn't work yesterday.","ur":"Kya aap kal se peeche ki tareekh par chhutti de sakte hain? Main kal bhi kaam ke qabil nahi thi."},{"s":"A","de":"Einen Tag rückdatieren ist möglich, mehr in der Regel nicht. Ich trage gestern als Beginn ein.","en":"Backdating one day is possible, usually not more. I'll enter yesterday as the start.","ur":"Ek din peeche karna mumkin hai, aam tor par is se zyada nahi. Main kal ko shuruaat likh deta hoon."},{"s":"B","de":"Muss ich die Bescheinigung selbst zum Arbeitgeber bringen?","en":"Do I have to take the certificate to the employer myself?","ur":"Kya mujhe certificate khud employer ko dena hoga?"},{"s":"A","de":"Nein, das läuft heute elektronisch. Ihr Arbeitgeber ruft die Daten bei der Krankenkasse ab.","en":"No, that's done electronically these days. Your employer retrieves the data from the health insurance.","ur":"Nahi, aaj kal yeh electronic hota hai. Aap ka employer insurance se data le leta hai."},{"s":"B","de":"Und was sage ich meinem Chef?","en":"And what do I tell my boss?","ur":"Aur main apne boss ko kya kahoon?"},{"s":"A","de":"Melden Sie sich nur krank. Sie müssen die Diagnose nicht nennen, das ist Ihr gutes Recht.","en":"Just call in sick. You don't have to state the diagnosis, that's your right.","ur":"Bas beemari ki ittila dein. Aap ko beemari ka naam batana zaroori nahi, yeh aap ka haq hai."},{"s":"B","de":"Das wusste ich nicht. Und wenn es Freitag noch nicht besser ist?","en":"I didn't know that. And if it's not better by Friday?","ur":"Yeh mujhe nahi pata tha. Aur agar Jumma tak behtar na ho?"},{"s":"A","de":"Dann kommen Sie am Freitag kurz vorbei, und wir verlängern, wenn es nötig ist.","en":"Then drop by on Friday, and we'll extend it if necessary.","ur":"To Jumma ko aa jayein, aur zaroorat par barha denge."},{"s":"B","de":"Gut. Ich hoffe, es reicht so.","en":"Good. I hope this is enough.","ur":"Acha. Umeed hai itna kaafi hoga."},{"s":"A","de":"Ruhen Sie sich aus und trinken Sie viel. Gute Besserung.","en":"Rest and drink a lot. Get well soon.","ur":"Aaram karein aur kaafi piyein. Jald sehatyabi."}]},"B1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"B","de":"Herr Doktor, ich brauche eine Krankschreibung, aber ich habe ein bisschen Angst, wie mein Arbeitgeber reagiert.","en":"Doctor, I need a sick note, but I'm a bit afraid of how my employer will react.","ur":"Doctor sahab, mujhe chhutti ka certificate chahiye, lekin mujhe thora dar hai ke employer kaise rad-e-amal dega."},{"s":"A","de":"Diese Sorge höre ich oft. Rechtlich sind Sie geschützt: Wenn Sie krank sind, sind Sie krank.","en":"I hear that worry often. Legally you're protected: if you're ill, you're ill.","ur":"Yeh fikar main aksar sunta hoon. Qanoonan aap mehfooz hain: agar beemar hain to beemar hain."},{"s":"B","de":"Trotzdem fühlt es sich an, als würde ich das Team im Stich lassen.","en":"Still, it feels like I'm letting the team down.","ur":"Phir bhi lagta hai jaise main team ko akela chhor rahi hoon."},{"s":"A","de":"Krank zur Arbeit zu gehen hilft dem Team selten. Sie stecken andere an oder machen mehr Fehler.","en":"Going to work ill rarely helps the team. You infect others or make more mistakes.","ur":"Beemar hote hue kaam par jana team ki madad kam hi karta hai. Aap doosron ko laga dete hain ya zyada ghaltiyan karte hain."},{"s":"B","de":"Da ist etwas dran. Wie lange würden Sie mich denn krankschreiben?","en":"There's something to that. How long would you sign me off then?","ur":"Is mein waqai baat hai. To aap kitne din ki chhutti denge?"},{"s":"A","de":"Realistisch für Ihre Beschwerden eine Woche. Danach schauen wir, ob Sie wieder belastbar sind.","en":"Realistically for your symptoms, one week. After that we'll see if you're fit for load again.","ur":"Aap ki takleef ke liye haqeeqatan ek hafta. Us ke baad dekhenge ke aap dobara kaam ke qabil hain ya nahi."},{"s":"B","de":"Eine Woche klingt viel. Reicht nicht vielleicht bis Mittwoch?","en":"A week sounds like a lot. Wouldn't until Wednesday be enough maybe?","ur":"Ek hafta zyada lagta hai. Shayad Budh tak kaafi ho?"},{"s":"A","de":"Sie können früher zurück, wenn es Ihnen besser geht. Aber ich setze den Zeitraum lieber ausreichend an.","en":"You can return earlier if you feel better. But I'd rather set the period generously enough.","ur":"Agar behtar mehsoos karein to jaldi wapis aa sakti hain. Lekin main muddat kaafi rakhna behtar samajhta hoon."},{"s":"B","de":"Muss ich Ihnen sagen, wann ich zurückgehe, oder entscheide ich das selbst?","en":"Do I have to tell you when I go back, or do I decide that myself?","ur":"Kya mujhe batana hoga ke kab wapis jaoongi, ya main khud tay karoon?"},{"s":"A","de":"Innerhalb der Krankschreibung entscheiden Sie das selbst. Fühlen Sie sich am Donnerstag fit, gehen Sie am Donnerstag.","en":"Within the sick note you decide that yourself. If you feel fit on Thursday, go on Thursday.","ur":"Certificate ki muddat mein aap khud tay karti hain. Jumeraat ko theek lagein to Jumeraat ko chali jayein."},{"s":"B","de":"Und wenn ich merke, dass eine Woche nicht reicht?","en":"And if I realise a week isn't enough?","ur":"Aur agar mujhe lage ke ek hafta kaafi nahi?"},{"s":"A","de":"Dann kommen Sie vor Ablauf wieder, nicht erst am letzten Tag. So vermeiden wir eine Lücke.","en":"Then come back before it expires, not just on the last day. That way we avoid a gap.","ur":"To khatam hone se pehle aa jayein, sirf aakhri din nahi. Yun kami se bach jayenge."},{"s":"B","de":"Eine Lücke wäre schlecht?","en":"A gap would be bad?","ur":"Kami buri baat hogi?"},{"s":"A","de":"Ja, für den Lohn und die Kasse ist eine lückenlose Krankschreibung wichtig. Denken Sie einfach rechtzeitig daran.","en":"Yes, for your pay and the insurance a gapless sick note matters. Just remember it in good time.","ur":"Ji haan, tankhwah aur insurance ke liye be-kami certificate ahem hai. Bas waqt par yaad rakhein."},{"s":"B","de":"Mache ich. Vielen Dank, das beruhigt mich sehr.","en":"I will. Thank you, that reassures me a lot.","ur":"Zaroor. Shukriya, is se mujhe kaafi tasalli hui."},{"s":"A","de":"Sehr gern. Melden Sie sich, wenn etwas unklar ist. Gute Besserung.","en":"You're very welcome. Get in touch if anything is unclear. Get well soon.","ur":"Bohat khushi se. Kuch samajh na aaye to rabta karein. Jald sehatyabi."}]},"B2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"B","de":"Herr Doktor, ich möchte offen sein: Ich brauche zwar eine Krankschreibung, aber ich will sie mir nicht erschleichen.","en":"Doctor, I want to be honest: I do need a sick note, but I don't want to obtain it dishonestly.","ur":"Doctor sahab, main saaf baat karna chahti hoon: mujhe certificate chahiye, lekin main isay ghalat tareeqe se hasil nahi karna chahti."},{"s":"A","de":"Das ehrt Sie, aber eine Krankschreibung ist keine Gefälligkeit. Ich beurteile Ihre Arbeitsfähigkeit medizinisch, nicht moralisch.","en":"That does you credit, but a sick note isn't a favour. I assess your fitness for work medically, not morally.","ur":"Yeh aap ki achi baat hai, lekin certificate koi ehsaan nahi. Main aap ki kaam ki salahiyat tibbi tor par jaanchta hoon, akhlaqi nahi."},{"s":"B","de":"Das Problem ist: Körperlich könnte ich hingehen, aber ich bin durch die Erschöpfung nicht wirklich leistungsfähig.","en":"The problem is: physically I could go, but due to the exhaustion I'm not really able to perform.","ur":"Masla yeh hai: jismani tor par ja sakti hoon, lekin thakan ki wajah se asal mein kaam nahi kar pati."},{"s":"A","de":"Arbeitsunfähigkeit heißt nicht bettlägerig. Wenn Ihre Konzentration und Belastbarkeit deutlich eingeschränkt sind, sind Sie arbeitsunfähig.","en":"Incapacity to work doesn't mean bedridden. If your concentration and resilience are clearly reduced, you're unfit for work.","ur":"Kaam ke na-qabil hone ka matlab bistar par parna nahi. Agar aap ki tawajjoh aur bardasht saaf tor par kam hai to aap kaam ke qabil nahi."},{"s":"B","de":"Das trifft es genau. Ich funktioniere, aber auf Reserve, und mache Fehler, die mir sonst nicht passieren.","en":"That's exactly it. I function, but on reserve, and I make mistakes I normally wouldn't.","ur":"Bilkul yehi baat hai. Main kaam karti hoon, lekin bamushkil, aur aisi ghaltiyan karti hoon jo aam tor par nahi hotin."},{"s":"A","de":"Dann ist eine Krankschreibung medizinisch gerechtfertigt. Die Frage ist eher die Dauer und wie wir die Rückkehr gestalten.","en":"Then a sick note is medically justified. The question is rather the duration and how we shape the return.","ur":"To certificate tibbi tor par jaiz hai. Sawal muddat ka hai aur wapsi kaise ho."},{"s":"B","de":"Genau da hätte ich gern Ihren Rat. Ich habe Angst, nach einer Woche wieder ins gleiche Loch zu fallen.","en":"That's exactly where I'd like your advice. I'm afraid of falling back into the same hole after a week.","ur":"Isi mein main aap ka mashwara chahoongi. Mujhe dar hai ke ek hafte baad phir usi gaddhe mein gir jaoongi."},{"s":"A","de":"Eine berechtigte Sorge. Sinnvoller als eine lange Vollkrankschreibung ist oft eine stufenweise Wiedereingliederung.","en":"A valid concern. More sensible than a long full sick note is often a phased return to work.","ur":"Yeh jaiz fikar hai. Lambi mukammal chhutti se behtar aksar thora thora kaam par wapsi hoti hai."},{"s":"B","de":"Was bedeutet das praktisch?","en":"What does that mean in practice?","ur":"Amal mein is ka kya matlab hai?"},{"s":"A","de":"Sie steigen mit reduzierter Stundenzahl ein und steigern langsam. Das muss aber der Arbeitgeber mittragen, sonst geht es nicht.","en":"You start with reduced hours and increase slowly. But the employer has to support it, otherwise it won't work.","ur":"Aap kam ghanton se shuru karti hain aur dheere dheere barhati hain. Lekin employer ko iska saath dena hoga, warna nahi hoga."},{"s":"B","de":"Mein Arbeitgeber ist eigentlich verständnisvoll. Wie leite ich so etwas ein?","en":"My employer is actually understanding. How do I initiate something like that?","ur":"Mera employer asal mein samajhdaar hai. Aisi cheez kaise shuru karoon?"},{"s":"A","de":"Ich schreibe Sie zunächst voll krank, und wir besprechen den Stufenplan, sobald Sie stabiler sind. Nichts überstürzen.","en":"I'll sign you off fully first, and we'll discuss the phased plan once you're more stable. Nothing rushed.","ur":"Main pehle mukammal chhutti deta hoon, aur jab aap zyada mustahkam hon to stufen-plan par baat karenge. Jaldbazi nahi."},{"s":"B","de":"Das nimmt mir wirklich Druck. Ich hatte erwartet, mich rechtfertigen zu müssen.","en":"That really takes the pressure off me. I'd expected to have to justify myself.","ur":"Is se waqai dabao kam hua. Main to safai deni parne ki tawaqqo kar rahi thi."},{"s":"A","de":"Bei mir müssen Sie sich nicht rechtfertigen, sondern gesund werden. Das ist der ganze Zweck.","en":"With me you don't have to justify yourself, but get healthy. That's the whole point.","ur":"Mere paas aap ko safai nahi deni, balke sehatyab hona hai. Yehi maqsad hai."},{"s":"B","de":"Danke. Dann fangen wir mit der vollen Krankschreibung an.","en":"Thank you. Then let's start with the full sick note.","ur":"Shukriya. To mukammal chhutti se shuru karte hain."},{"s":"A","de":"So machen wir es. Und kommen Sie lieber einen Tag zu früh als einen zu spät.","en":"That's what we'll do. And come a day too early rather than a day too late.","ur":"Aise hi karenge. Aur der se aane se behtar ek din pehle aa jayein."}]}},"roleplay":{"easy":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Sie sind krank und brauchen eine Krankschreibung für Ihren Arbeitgeber.","en":"You're ill and need a sick note for your employer.","ur":"Aap beemar hain aur employer ke liye chhutti ka certificate chahiye."},"start":"n1","nodes":{"n1":{"say":"Guten Tag, Frau Yilmaz. Was kann ich für Sie tun?","goal":{"en":"Say you need a sick note.","ur":"Kahein ke aap ko chhutti ka certificate chahiye."},"options":["Ich brauche eine Krankschreibung.","Ich brauche eine Krankschreibung, bitte."],"fallback":"Was möchten Sie genau?","accept":[{"kw":["krankschreibung"],"next":"n2"}]},"n2":{"say":"Für wen ist die Krankschreibung?","goal":{"en":"Say: for your employer.","ur":"Kahein: apne employer ke liye."},"options":["Für meinen Arbeitgeber.","Für die Arbeit."],"fallback":"Wofür brauchen Sie sie?","accept":[{"kw":["arbeitgeber"],"next":"n3"},{"kw":["arbeit"],"next":"n3"}]},"n3":{"say":"Seit wann sind Sie krank?","goal":{"en":"Say: since this morning.","ur":"Kahein: aaj subh se."},"options":["Seit heute Morgen.","Seit heute früh."],"fallback":"Ab wann fühlen Sie sich krank?","accept":[{"kw":["heute","morgen"],"next":"n4"},{"kw":["heute"],"next":"n4"}]},"n4":{"say":"Gut, ich schreibe Sie bis Freitag krank. Das geht elektronisch an die Krankenkasse.","goal":{"en":"Ask what happens if it takes longer.","ur":"Poochein ke agar zyada din lagein to kya hoga."},"options":["Und wenn es länger dauert?","Was, wenn ich länger krank bin?"],"fallback":"Haben Sie eine Frage dazu?","accept":[{"kw":["länger"],"next":"n5"},{"kw":["dauert"],"next":"n5"}]},"n5":{"say":"Dann kommen Sie wieder, und ich verlängere die Krankschreibung.","goal":{"en":"Thank the doctor.","ur":"Doctor ka shukriya karein."},"options":["Danke, Herr Doktor.","Vielen Dank, Herr Doktor."],"fallback":"Alles klar so weit?","accept":[{"kw":["danke"],"reply":"Gern. Gute Besserung!","next":"END"},{"kw":["dank"],"reply":"Gern. Gute Besserung!","next":"END"}]}}},"hard":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Sie brauchen eine Krankschreibung, haben aber Angst, wie Ihr Arbeitgeber reagiert. Sie sprechen offen mit dem Arzt.","en":"You need a sick note but are afraid of how your employer will react. You speak openly with the doctor.","ur":"Aap ko chhutti ka certificate chahiye lekin dar hai ke employer kaise rad-e-amal dega. Aap doctor se khul kar baat karti hain."},"start":"n1","nodes":{"n1":{"say":"Guten Tag, Frau Yilmaz. Wie geht es Ihnen?","goal":{"en":"Say you need a sick note, but you're a bit afraid of how your employer will react.","ur":"Kahein ke certificate chahiye, lekin employer ke rad-e-amal ka thora dar hai."},"options":["Ich brauche eine Krankschreibung, aber ich habe Angst, wie mein Arbeitgeber reagiert.","Ich brauche eine Krankschreibung, aber mein Arbeitgeber macht mir Sorgen."],"fallback":"Was beschäftigt Sie?","accept":[{"kw":["krankschreibung","arbeitgeber"],"next":"n2"},{"kw":["angst","arbeitgeber"],"next":"n2"},{"kw":["krankschreibung"],"next":"n2"}]},"n2":{"say":"Diese Sorge höre ich oft. Rechtlich sind Sie geschützt: Wenn Sie krank sind, sind Sie krank.","goal":{"en":"Say it still feels like you're letting the team down.","ur":"Kahein ke phir bhi lagta hai aap team ko akela chhor rahi hain."},"options":["Trotzdem fühlt es sich an, als würde ich das Team im Stich lassen.","Trotzdem lasse ich das Team im Stich."],"fallback":"Wie sehen Sie das?","accept":[{"kw":["team","stich"],"next":"n3"},{"kw":["team"],"next":"n3"},{"kw":["trotzdem"],"next":"n3"}]},"n3":{"say":"Krank zur Arbeit zu gehen hilft dem Team selten. Wie lange würde ich Sie sinnvoll krankschreiben? Was denken Sie?","goal":{"en":"Ask how long he would sign you off.","ur":"Poochein ke woh kitne din ki chhutti denge."},"options":["Wie lange würden Sie mich krankschreiben?","Für wie lange schreiben Sie mich krank?"],"fallback":"Haben Sie eine Vorstellung?","accept":[{"kw":["wie","lange"],"next":"n4"},{"kw":["lange"],"next":"n4"}]},"n4":{"say":"Realistisch eine Woche. Danach schauen wir, ob Sie wieder belastbar sind.","goal":{"en":"Ask whether you decide yourself when to go back.","ur":"Poochein ke kya aap khud tay karti hain ke kab wapis jayein."},"options":["Entscheide ich selbst, wann ich zurückgehe?","Kann ich selbst entscheiden, wann ich zurückgehe?"],"fallback":"Noch eine Frage?","accept":[{"kw":["selbst","zurück"],"next":"n5"},{"kw":["entscheide"],"next":"n5"},{"kw":["zurückgehe"],"next":"n5"}]},"n5":{"say":"Innerhalb der Krankschreibung entscheiden Sie das selbst. Wenn eine Woche nicht reicht, kommen Sie vor Ablauf wieder, nicht erst am letzten Tag.","goal":{"en":"Ask why a gap would be bad.","ur":"Poochein ke kami buri baat kyun hogi."},"options":["Warum wäre eine Lücke schlecht?","Was ist an einer Lücke schlimm?"],"fallback":"Ist das klar?","accept":[{"kw":["lücke"],"next":"n6"},{"kw":["warum"],"next":"n6"}]},"n6":{"say":"Für den Lohn und die Kasse ist eine lückenlose Krankschreibung wichtig. Denken Sie rechtzeitig daran.","goal":{"en":"Say you will and thank him; it reassures you.","ur":"Kahein zaroor aur shukriya; is se tasalli hui."},"options":["Mache ich. Vielen Dank, das beruhigt mich.","Gut. Danke, das beruhigt mich sehr."],"fallback":"Noch etwas unklar?","accept":[{"kw":["danke","beruhigt"],"reply":"Sehr gern. Gute Besserung, Frau Yilmaz.","next":"END"},{"kw":["danke"],"reply":"Sehr gern. Gute Besserung.","next":"END"}]}}}}},{"id":"ueberweisung","order":4,"icon":"➡️","title":{"de":"Überweisung zum Facharzt","en":"Referral to a specialist","ur":"Specialist ke liye referral"},"angle":"Getting referred to a specialist · Specialist ke paas referral","voices":{"A":"Puck","B":"Kore"},"words":["überweisung","facharzt","orthopäde","termin","quartal","dringlichkeit","wartezeit","befund","mitgeben","vereinbaren"],"dialogues":{"A1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Ihr Knie sollte ein Facharzt ansehen.","en":"A specialist should look at your knee.","ur":"Aap ka ghutna ek specialist ko dekhna chahiye."},{"s":"B","de":"Welcher Facharzt ist das?","en":"Which specialist is that?","ur":"Yeh kaunsa specialist hai?"},{"s":"A","de":"Ein Orthopäde.","en":"An orthopedist.","ur":"Ek haddi ka doctor (orthopedist)."},{"s":"B","de":"Bekomme ich eine Überweisung?","en":"Do I get a referral?","ur":"Kya mujhe referral milega?"},{"s":"A","de":"Ja, ich schreibe Ihnen eine Überweisung.","en":"Yes, I'll write you a referral.","ur":"Ji haan, main aap ko referral likh deta hoon."},{"s":"B","de":"Muss ich dafür bezahlen?","en":"Do I have to pay for it?","ur":"Kya is ke paise dene honge?"},{"s":"A","de":"Nein, mit der Überweisung ist es kostenlos.","en":"No, with the referral it's free.","ur":"Nahi, referral ke saath muft hai."},{"s":"B","de":"Wo finde ich einen Orthopäden?","en":"Where do I find an orthopedist?","ur":"Haddi ka doctor kahan milega?"},{"s":"A","de":"Hier ist eine Liste. Sie rufen an und machen einen Termin.","en":"Here is a list. You call and make an appointment.","ur":"Yeh list hai. Aap phone kar ke appointment banayein."},{"s":"B","de":"Muss ich die Überweisung mitnehmen?","en":"Do I have to take the referral with me?","ur":"Kya referral saath le jana hoga?"},{"s":"A","de":"Ja, bringen Sie sie zum Termin mit.","en":"Yes, bring it to the appointment.","ur":"Ji haan, appointment par saath layein."},{"s":"B","de":"Und meine Versichertenkarte?","en":"And my insurance card?","ur":"Aur mera insurance card?"},{"s":"A","de":"Die auch. Karte und Überweisung.","en":"That too. Card and referral.","ur":"Woh bhi. Card aur referral."},{"s":"B","de":"Alles klar. Vielen Dank.","en":"All right. Thank you very much.","ur":"Theek hai. Bohat shukriya."},{"s":"A","de":"Gute Besserung für das Knie.","en":"Get well soon with the knee.","ur":"Ghutne ke liye jald sehatyabi."}]},"A2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Die Schmerzen im Knie halten jetzt schon länger an. Ich möchte Sie zum Orthopäden überweisen.","en":"The knee pain has now lasted quite a while. I'd like to refer you to an orthopedist.","ur":"Ghutne ka dard ab kaafi arse se hai. Main aap ko haddi ke doctor ke paas bhejna chahta hoon."},{"s":"B","de":"Warum kann das nicht der Hausarzt machen?","en":"Why can't the family doctor do that?","ur":"Yeh family doctor kyun nahi kar sakta?"},{"s":"A","de":"Für ein MRT und die genaue Diagnose ist der Facharzt besser ausgestattet.","en":"For an MRI and the exact diagnosis the specialist is better equipped.","ur":"MRI aur theek tashkhees ke liye specialist behtar hai."},{"s":"B","de":"Wie lange dauert es, bis ich einen Termin bekomme?","en":"How long will it take to get an appointment?","ur":"Appointment milne mein kitna waqt lagega?"},{"s":"A","de":"Das ist unterschiedlich. Bei Orthopäden sind die Wartezeiten leider oft lang.","en":"That varies. With orthopedists the waiting times are unfortunately often long.","ur":"Yeh alag alag hota hai. Haddi ke doctors ke paas afsos intezaar aksar lamba hota hai."},{"s":"B","de":"Kann man da etwas machen?","en":"Can anything be done about that?","ur":"Kya us ke liye kuch kiya ja sakta hai?"},{"s":"A","de":"Ich vermerke auf der Überweisung, dass es dringlich ist. Das hilft manchmal.","en":"I'll note on the referral that it's urgent. That sometimes helps.","ur":"Main referral par likh deta hoon ke zaroori hai. Yeh kabhi madad karta hai."},{"s":"B","de":"Gibt es auch eine Terminservicestelle?","en":"Is there an appointment service too?","ur":"Kya koi appointment service bhi hai?"},{"s":"A","de":"Ja. Mit dem Code auf der Überweisung können Sie dort anrufen, wenn Sie selbst keinen Termin finden.","en":"Yes. With the code on the referral you can call them if you can't find an appointment yourself.","ur":"Ji haan. Referral par diye code se aap unhein phone kar sakti hain agar khud appointment na mile."},{"s":"B","de":"Das ist gut zu wissen. Gilt die Überweisung unbegrenzt?","en":"That's good to know. Is the referral valid indefinitely?","ur":"Yeh acha maloom hua. Kya referral hamesha ke liye chalta hai?"},{"s":"A","de":"Sie gilt für das aktuelle Quartal. Gehen Sie also möglichst bald hin.","en":"It's valid for the current quarter. So go as soon as possible.","ur":"Yeh maujooda quarter ke liye hai. To jitni jaldi ho sake chali jayein."},{"s":"B","de":"Soll ich Ihnen danach berichten, was der Facharzt sagt?","en":"Should I report back to you afterwards what the specialist says?","ur":"Kya baad mein aap ko bataoon ke specialist ne kya kaha?"},{"s":"A","de":"Der Facharzt schickt mir einen Bericht. Bringen Sie den Befund aber gern auch selbst mit.","en":"The specialist sends me a report. But feel free to bring the findings yourself too.","ur":"Specialist mujhe report bhejta hai. Lekin aap report khud bhi le aayein to acha hai."},{"s":"B","de":"Mache ich. Danke für die Überweisung.","en":"I will. Thank you for the referral.","ur":"Zaroor. Referral ka shukriya."},{"s":"A","de":"Gern. Melden Sie sich, wenn Sie keinen Termin bekommen.","en":"You're welcome. Get in touch if you can't get an appointment.","ur":"Koi baat nahi. Agar appointment na mile to rabta karein."}]},"B1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"B","de":"Herr Doktor, ehrlich gesagt bin ich unsicher, ob ich wirklich zum Facharzt muss oder ob das übertrieben ist.","en":"Doctor, honestly I'm unsure whether I really need to see a specialist or whether that's excessive.","ur":"Doctor sahab, sach kahoon to mujhe yaqeen nahi ke waqai specialist ke paas jana hai ya yeh zyada hai."},{"s":"A","de":"Eine berechtigte Frage. Ich überweise nicht aus Vorsicht, sondern weil ich hier eine gezielte Untersuchung brauche.","en":"A fair question. I'm not referring out of caution, but because I need a targeted examination here.","ur":"Jaiz sawal. Main ehtiyatan nahi bhej raha, balke is liye ke yahan khaas muaina chahiye."},{"s":"B","de":"Können Sie das MRT nicht einfach selbst anordnen?","en":"Can't you just order the MRI yourself?","ur":"Kya aap MRI khud nahi likhwa sakte?"},{"s":"A","de":"Anordnen teils schon, aber die Befundung und die Therapieentscheidung gehören in fachärztliche Hände.","en":"Ordering, partly yes, but the interpretation and the treatment decision belong in specialist hands.","ur":"Likhwana kuch had tak, lekin report parhna aur ilaaj ka faisla specialist ka kaam hai."},{"s":"B","de":"Das leuchtet mir ein. Mein Problem ist eher, dass ich schlecht an Termine komme.","en":"That makes sense to me. My problem is rather that I struggle to get appointments.","ur":"Yeh samajh aata hai. Mera masla yeh hai ke mujhe appointments mushkil se milte hain."},{"s":"A","de":"Deshalb gebe ich Ihnen die Überweisung mit einer Dringlichkeitseinstufung. Rufen Sie mehrere Praxen an, nicht nur eine.","en":"That's why I'll give you the referral with an urgency rating. Call several practices, not just one.","ur":"Isi liye main referral par zaroorat ka darja likh deta hoon. Kai clinics ko phone karein, sirf ek ko nahi."},{"s":"B","de":"Was sage ich am Telefon, damit ich schneller drankomme?","en":"What do I say on the phone so I'm seen sooner?","ur":"Phone par kya kahoon ke jaldi baari aaye?"},{"s":"A","de":"Sagen Sie, dass Sie eine Überweisung mit Dringlichkeit haben und fragen Sie aktiv nach Ausfalltermine.","en":"Say you have a referral marked urgent and actively ask about cancellation slots.","ur":"Kahein ke aap ke paas zaroori referral hai aur cancel hone wale appointments ke baare mein zaroor poochein."},{"s":"B","de":"Und wenn ich trotzdem erst in drei Monaten einen Termin bekomme?","en":"And if I still only get an appointment in three months?","ur":"Aur agar phir bhi teen mahine baad appointment mile?"},{"s":"A","de":"Dann rufen Sie die Terminservicestelle unter der 116117 an. Die müssen Ihnen fristgerecht einen Termin vermitteln.","en":"Then call the appointment service on 116117. They have to arrange an appointment for you within the deadline.","ur":"To 116117 par appointment service ko phone karein. Unhein waqt par appointment dilana hota hai."},{"s":"B","de":"Das wusste ich gar nicht. Bringt die Überweisung denn irgendetwas, wenn ich sie länger liegen lasse?","en":"I didn't know that at all. Does the referral still count if I leave it lying around for a while?","ur":"Yeh mujhe bilkul nahi pata tha. Kya referral chalti rahegi agar main isay kuch arse rakh loon?"},{"s":"A","de":"Sie gilt nur im laufenden Quartal. Verstreicht das, brauchen Sie eine neue. Gehen Sie also zügig vor.","en":"It's only valid in the current quarter. If that passes, you need a new one. So act promptly.","ur":"Yeh sirf maujooda quarter mein chalti hai. Woh guzar jaye to nayi chahiye. To jaldi karein."},{"s":"B","de":"Verstanden. Und den Befund bringe ich Ihnen dann mit?","en":"Understood. And I'll bring you the findings then?","ur":"Samajh gayi. Aur report aap ko le aaoon?"},{"s":"A","de":"Sehr gern. So kann ich die weitere Behandlung mit Ihnen abstimmen und wir verlieren keine Zeit.","en":"Very much so. That way I can coordinate the further treatment with you and we don't lose time.","ur":"Bilkul. Yun main aage ka ilaaj aap ke saath tay kar sakoonga aur waqt zaya nahi hoga."},{"s":"B","de":"Danke, jetzt fühle ich mich besser vorbereitet.","en":"Thank you, now I feel better prepared.","ur":"Shukriya, ab main behtar tayyar mehsoos karti hoon."},{"s":"A","de":"Genau darum geht es. Viel Erfolg bei der Terminsuche.","en":"That's exactly the point. Good luck with the appointment search.","ur":"Yehi to maqsad hai. Appointment dhoondne mein kamyabi."}]},"B2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"B","de":"Herr Doktor, bevor Sie überweisen: Ich möchte verstehen, was genau Sie sich vom Facharzt erhoffen.","en":"Doctor, before you refer: I'd like to understand what exactly you hope to get from the specialist.","ur":"Doctor sahab, referral se pehle: main samajhna chahti hoon ke aap ko specialist se asal mein kya umeed hai."},{"s":"A","de":"Berechtigt. Ich habe einen Verdacht, aber mir fehlt die Bildgebung, um ihn zu bestätigen oder auszuschließen.","en":"Fair. I have a suspicion, but I lack the imaging to confirm or rule it out.","ur":"Jaiz. Mujhe shubah hai, lekin tasdeeq ya khaarij karne ke liye imaging nahi hai."},{"s":"B","de":"Wenn Sie schon einen Verdacht haben, warum behandeln wir nicht direkt danach?","en":"If you already have a suspicion, why don't we treat according to it directly?","ur":"Agar aap ko pehle se shubah hai to hum us ke mutabiq seedha ilaaj kyun nahi karte?"},{"s":"A","de":"Weil eine falsche Annahme hier teuer wäre. Manche Ursachen behandelt man konservativ, andere brauchen einen Eingriff.","en":"Because a wrong assumption would be costly here. Some causes are treated conservatively, others need a procedure.","ur":"Kyunke ghalat andaza yahan mehnga parega. Kuch wajahat aaram se theek hoti hain, kuch mein operation chahiye."},{"s":"B","de":"Das heißt, die Überweisung schützt mich auch vor einer unnötigen Behandlung?","en":"So the referral also protects me from an unnecessary treatment?","ur":"Yani referral mujhe faltu ilaaj se bhi bachati hai?"},{"s":"A","de":"Genau so sehe ich das. Diagnostik zuerst, Therapie danach, nicht umgekehrt.","en":"That's exactly how I see it. Diagnostics first, therapy after, not the other way round.","ur":"Main bilkul aise dekhta hoon. Pehle tashkhees, phir ilaaj, ulta nahi."},{"s":"B","de":"Wie stelle ich sicher, dass der Facharzt Ihre Fragestellung überhaupt versteht?","en":"How do I make sure the specialist even understands your clinical question?","ur":"Main kaise yaqeeni banaoon ke specialist aap ka sawal samjhe?"},{"s":"A","de":"Ich formuliere die Fragestellung präzise auf der Überweisung, nicht nur eine Diagnose, sondern was ich geklärt haben möchte.","en":"I'll phrase the clinical question precisely on the referral, not just a diagnosis, but what I want clarified.","ur":"Main referral par sawal saaf likhta hoon, sirf tashkhees nahi, balke jo main jaanna chahta hoon."},{"s":"B","de":"Kann ich eine Kopie davon bekommen, damit ich beim Facharzt nichts vergesse?","en":"Can I get a copy of that so I don't forget anything at the specialist?","ur":"Kya mujhe is ki copy mil sakti hai taake specialist ke paas kuch na bhooloon?"},{"s":"A","de":"Selbstverständlich. Ich gebe Ihnen die Überweisung und einen kurzen Ausdruck der wichtigsten Vorbefunde mit.","en":"Of course. I'll give you the referral and a short printout of the most important prior findings.","ur":"Zaroor. Main aap ko referral aur ahem purani reports ka mukhtasar print de deta hoon."},{"s":"B","de":"Und wenn der Facharzt eine ganz andere Meinung hat als Sie?","en":"And if the specialist has a completely different opinion than you?","ur":"Aur agar specialist ki raye aap se bilkul mukhtalif ho?"},{"s":"A","de":"Dann ist das ein Gewinn, kein Problem. Ich will die richtige Antwort, nicht recht behalten.","en":"Then that's a gain, not a problem. I want the right answer, not to be proven right.","ur":"To yeh faida hai, masla nahi. Mujhe sahi jawab chahiye, apni baat manwana nahi."},{"s":"B","de":"Das ist eine erfrischend ehrliche Haltung.","en":"That's a refreshingly honest attitude.","ur":"Yeh aik taaza aur sacha rawaiya hai."},{"s":"A","de":"Medizin ist Teamarbeit. Bringen Sie den Befund zurück, dann entscheiden wir gemeinsam über die nächsten Schritte.","en":"Medicine is teamwork. Bring the findings back, then we'll decide the next steps together.","ur":"Medicine team ka kaam hai. Report wapis layein, phir hum mil kar agle qadam tay karenge."},{"s":"B","de":"Abgemacht. Dann nehme ich die Überweisung und die Vorbefunde mit.","en":"Agreed. Then I'll take the referral and the prior findings with me.","ur":"Tay raha. To main referral aur purani reports le jati hoon."},{"s":"A","de":"Sehr gut. Und wenn die Terminsuche hakt, wissen Sie ja jetzt, wo Sie anrufen.","en":"Very good. And if the appointment search stalls, you now know where to call.","ur":"Bohat acha. Aur agar appointment mein rukawat ho to ab aap ko pata hai kahan phone karna hai."}]}},"roleplay":{"easy":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Der Arzt möchte Sie wegen Ihres Knies zum Orthopäden überweisen.","en":"The doctor wants to refer you to an orthopedist because of your knee.","ur":"Doctor aap ke ghutne ki wajah se haddi ke doctor ke paas bhejna chahta hai."},"start":"n1","nodes":{"n1":{"say":"Ihr Knie sollte ein Facharzt ansehen, ein Orthopäde.","goal":{"en":"Ask whether you get a referral.","ur":"Poochein ke kya aap ko referral milega."},"options":["Bekomme ich eine Überweisung?","Geben Sie mir eine Überweisung?"],"fallback":"Haben Sie eine Frage dazu?","accept":[{"kw":["überweisung"],"next":"n2"}]},"n2":{"say":"Ja, ich schreibe Ihnen eine Überweisung.","goal":{"en":"Ask whether you have to pay for it.","ur":"Poochein ke kya is ke paise dene honge."},"options":["Muss ich dafür bezahlen?","Kostet das etwas?"],"fallback":"Möchten Sie noch etwas wissen?","accept":[{"kw":["bezahlen"],"next":"n3"},{"kw":["kostet"],"next":"n3"}]},"n3":{"say":"Nein, mit der Überweisung ist es kostenlos. Hier ist eine Liste mit Orthopäden.","goal":{"en":"Ask whether you have to take the referral with you.","ur":"Poochein ke kya referral saath le jana hoga."},"options":["Muss ich die Überweisung mitnehmen?","Nehme ich die Überweisung mit?"],"fallback":"Noch eine Frage?","accept":[{"kw":["mitnehmen"],"next":"n4"},{"kw":["überweisung"],"next":"n4"}]},"n4":{"say":"Ja, bringen Sie sie und die Versichertenkarte zum Termin mit.","goal":{"en":"Say all right and thank the doctor.","ur":"Kahein theek hai aur shukriya."},"options":["Alles klar. Vielen Dank.","Gut. Danke schön."],"fallback":"Ist das so weit klar?","accept":[{"kw":["danke"],"reply":"Gern. Gute Besserung für das Knie!","next":"END"},{"kw":["dank"],"reply":"Gern. Gute Besserung!","next":"END"}]}}},"hard":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Der Arzt will Sie zum Orthopäden überweisen. Sie sind unsicher, ob das nötig ist, und fürchten lange Wartezeiten.","en":"The doctor wants to refer you to an orthopedist. You're unsure it's necessary and fear long waits.","ur":"Doctor aap ko haddi ke doctor ke paas bhejna chahta hai. Aap ko yaqeen nahi ke zaroori hai, aur lambe intezaar ka dar hai."},"start":"n1","nodes":{"n1":{"say":"Die Schmerzen halten schon länger an. Ich möchte Sie zum Orthopäden überweisen.","goal":{"en":"Say you're honestly unsure whether you really need a specialist or whether it's excessive.","ur":"Kahein ke aap ko yaqeen nahi ke specialist zaroori hai ya yeh zyada hai."},"options":["Ehrlich gesagt bin ich unsicher, ob ich wirklich zum Facharzt muss oder ob das übertrieben ist.","Ich bin unsicher, ob ich wirklich zum Facharzt muss."],"fallback":"Wie sehen Sie das?","accept":[{"kw":["unsicher","facharzt"],"next":"n2"},{"kw":["übertrieben"],"next":"n2"},{"kw":["unsicher"],"next":"n2"}]},"n2":{"say":"Ich überweise nicht aus Vorsicht, sondern weil ich eine gezielte Untersuchung brauche, ein MRT.","goal":{"en":"Say your problem is rather that you struggle to get appointments.","ur":"Kahein ke aap ka masla yeh hai ke appointments mushkil se milte hain."},"options":["Mein Problem ist eher, dass ich schlecht an Termine komme.","Ich komme schwer an Termine."],"fallback":"Was ist Ihre größte Sorge?","accept":[{"kw":["termine"],"next":"n3"},{"kw":["termin"],"next":"n3"}]},"n3":{"say":"Deshalb gebe ich Ihnen die Überweisung mit einer Dringlichkeitseinstufung. Rufen Sie mehrere Praxen an.","goal":{"en":"Ask what to say on the phone so you're seen sooner.","ur":"Poochein ke phone par kya kahoon ke jaldi baari aaye."},"options":["Was sage ich am Telefon, damit ich schneller drankomme?","Wie komme ich schneller an einen Termin?"],"fallback":"Haben Sie eine Frage zur Terminsuche?","accept":[{"kw":["telefon"],"next":"n4"},{"kw":["schneller"],"next":"n4"},{"kw":["sage"],"next":"n4"}]},"n4":{"say":"Sagen Sie, dass Sie eine dringliche Überweisung haben, und fragen Sie nach Ausfallterminen.","goal":{"en":"Ask what if you still only get an appointment in three months.","ur":"Poochein ke agar phir bhi teen mahine baad mile to kya."},"options":["Und wenn ich trotzdem erst in drei Monaten einen Termin bekomme?","Was, wenn ich erst in Monaten einen Termin bekomme?"],"fallback":"Noch eine Frage?","accept":[{"kw":["drei","monaten"],"next":"n5"},{"kw":["monaten"],"next":"n5"},{"kw":["trotzdem"],"next":"n5"}]},"n5":{"say":"Dann rufen Sie die Terminservicestelle unter der 116117 an. Die müssen Ihnen fristgerecht einen Termin vermitteln. Die Überweisung gilt nur im laufenden Quartal.","goal":{"en":"Ask whether you bring the findings back to him.","ur":"Poochein ke kya report unko wapis le aaoon."},"options":["Und den Befund bringe ich Ihnen dann mit?","Soll ich Ihnen den Befund mitbringen?"],"fallback":"Ist das klar?","accept":[{"kw":["befund"],"next":"n6"},{"kw":["mitbringen"],"next":"n6"}]},"n6":{"say":"Sehr gern. So können wir die weitere Behandlung gemeinsam abstimmen.","goal":{"en":"Say thanks; now you feel better prepared.","ur":"Shukriya kahein; ab behtar tayyar mehsoos karti hain."},"options":["Danke, jetzt fühle ich mich besser vorbereitet.","Vielen Dank, das hilft mir sehr."],"fallback":"Noch etwas unklar?","accept":[{"kw":["danke","vorbereitet"],"reply":"Genau darum geht es. Viel Erfolg bei der Terminsuche!","next":"END"},{"kw":["danke"],"reply":"Viel Erfolg bei der Terminsuche!","next":"END"}]}}}}},{"id":"befund","order":5,"icon":"🧪","title":{"de":"Befund besprechen","en":"Discussing the results","ur":"Report par baat"},"angle":"Going over blood-test results and next steps · Test ke nateeje aur agla qadam","voices":{"A":"Puck","B":"Kore"},"words":["befund","blutwerte","eisenmangel","normal","wert","erhöht","tablette","kontrolle","ernährung","besprechen"],"dialogues":{"A1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Ihre Blutwerte sind da.","en":"Your blood results are here.","ur":"Aap ke khoon ke nateeje aa gaye."},{"s":"B","de":"Ist alles in Ordnung?","en":"Is everything all right?","ur":"Kya sab theek hai?"},{"s":"A","de":"Fast alles ist normal.","en":"Almost everything is normal.","ur":"Taqreeban sab normal hai."},{"s":"B","de":"Und was ist nicht normal?","en":"And what isn't normal?","ur":"Aur kya normal nahi?"},{"s":"A","de":"Ihr Eisenwert ist zu niedrig. Sie haben Eisenmangel.","en":"Your iron level is too low. You have iron deficiency.","ur":"Aap ka loha kam hai. Aap ko iron ki kami hai."},{"s":"B","de":"Ist das der Grund für die Müdigkeit?","en":"Is that the reason for the tiredness?","ur":"Kya thakan ki wajah yehi hai?"},{"s":"A","de":"Sehr wahrscheinlich, ja.","en":"Very likely, yes.","ur":"Bohat mumkin, ji haan."},{"s":"B","de":"Was kann ich tun?","en":"What can I do?","ur":"Main kya karoon?"},{"s":"A","de":"Sie nehmen drei Monate lang Eisentabletten.","en":"You take iron tablets for three months.","ur":"Aap teen mahine iron ki goliyan lein."},{"s":"B","de":"Jeden Tag?","en":"Every day?","ur":"Roz?"},{"s":"A","de":"Ja, eine Tablette am Morgen, nüchtern.","en":"Yes, one tablet in the morning, on an empty stomach.","ur":"Ji haan, ek goli subh, khali pait."},{"s":"B","de":"Und dann?","en":"And then?","ur":"Aur phir?"},{"s":"A","de":"Nach drei Monaten machen wir eine Kontrolle.","en":"After three months we'll do a check.","ur":"Teen mahine baad hum dobara check karenge."},{"s":"B","de":"Gut. Vielen Dank, Herr Doktor.","en":"Good. Thank you very much, doctor.","ur":"Acha. Bohat shukriya, doctor sahab."},{"s":"A","de":"Gern. Es wird Ihnen bald besser gehen.","en":"You're welcome. You'll feel better soon.","ur":"Koi baat nahi. Jald behtar mehsoos karengi."}]},"A2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Setzen Sie sich, ich habe den Befund vom Labor. Insgesamt sieht es gut aus.","en":"Have a seat, I have the findings from the lab. Overall it looks good.","ur":"Baith jayein, mujhe lab se report mil gayi. Kul mila kar theek hai."},{"s":"B","de":"Das beruhigt mich. Ich hatte ein bisschen Angst.","en":"That reassures me. I was a bit scared.","ur":"Is se tasalli hui. Mujhe thora dar tha."},{"s":"A","de":"Verständlich. Ein Wert ist auffällig: Ihr Eisen ist deutlich zu niedrig.","en":"Understandable. One value is notable: your iron is clearly too low.","ur":"Samajh sakta hoon. Ek value ghair mamooli hai: aap ka loha saaf tor par kam hai."},{"s":"B","de":"Was bedeutet ein niedriger Eisenwert?","en":"What does a low iron level mean?","ur":"Kam loha ka matlab kya hai?"},{"s":"A","de":"Der Körper bildet weniger rote Blutkörperchen. Das macht müde und manchmal auch schwindelig.","en":"The body forms fewer red blood cells. That causes tiredness and sometimes dizziness too.","ur":"Jism kam laal khoon ke zarrat banata hai. Is se thakan aur kabhi chakkar bhi hota hai."},{"s":"B","de":"Das passt genau zu meinen Beschwerden.","en":"That fits exactly with my symptoms.","ur":"Yeh meri takleef se bilkul milta hai."},{"s":"A","de":"Genau. Deshalb behandeln wir das jetzt gezielt mit Eisentabletten.","en":"Exactly. That's why we'll now treat it specifically with iron tablets.","ur":"Bilkul. Isi liye ab hum iron ki goliyon se ilaaj karenge."},{"s":"B","de":"Vertrage ich die Tabletten? Ich habe einen empfindlichen Magen.","en":"Will I tolerate the tablets? I have a sensitive stomach.","ur":"Kya goliyan mujhe lagengi? Mera pait naazuk hai."},{"s":"A","de":"Manche bekommen Bauchschmerzen. Wenn das passiert, nehmen Sie die Tablette nicht nüchtern, sondern zum Essen.","en":"Some get stomach ache. If that happens, don't take the tablet on an empty stomach, but with food.","ur":"Kuch logon ko pait dard hota hai. Agar aisa ho to goli khali pait nahi, khane ke saath lein."},{"s":"B","de":"Kann ich auch über die Ernährung etwas tun?","en":"Can I also do something through diet?","ur":"Kya main khane se bhi kuch kar sakti hoon?"},{"s":"A","de":"Ja. Rotes Fleisch, Hülsenfrüchte und grünes Gemüse enthalten viel Eisen. Vitamin C hilft bei der Aufnahme.","en":"Yes. Red meat, legumes and green vegetables contain a lot of iron. Vitamin C helps with absorption.","ur":"Ji haan. Laal gosht, daalein aur hari sabzi mein loha zyada hota hai. Vitamin C jazb hone mein madad karta hai."},{"s":"B","de":"Und Kaffee? Den trinke ich viel.","en":"And coffee? I drink a lot of it.","ur":"Aur coffee? Woh main zyada peeti hoon."},{"s":"A","de":"Kaffee direkt zur Tablette hemmt die Aufnahme. Lassen Sie lieber eine Stunde Abstand.","en":"Coffee right with the tablet inhibits absorption. Better leave an hour's gap.","ur":"Goli ke saath coffee jazb hone ko rokti hai. Behtar hai ek ghante ka waqfa rakhein."},{"s":"B","de":"Gut zu wissen. Wann kontrollieren wir die Werte?","en":"Good to know. When do we check the values?","ur":"Acha maloom hua. Values kab check karenge?"},{"s":"A","de":"In drei Monaten. Bis dahin sollten Sie sich deutlich fitter fühlen.","en":"In three months. By then you should feel considerably fitter.","ur":"Teen mahine mein. Tab tak aap kaafi behtar mehsoos karengi."},{"s":"B","de":"Das hoffe ich sehr. Vielen Dank für die genaue Erklärung.","en":"I really hope so. Thank you for the detailed explanation.","ur":"Mujhe poori umeed hai. Tafseeli wazahat ka shukriya."}]},"B1":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"B","de":"Herr Doktor, ich habe mir den Befund selbst schon angesehen und viele Werte nicht verstanden.","en":"Doctor, I've already looked at the findings myself and didn't understand many values.","ur":"Doctor sahab, main ne report khud dekhi thi lekin kai values samajh nahi aayin."},{"s":"A","de":"Das geht vielen so. Ein Laborbericht sieht dramatischer aus, als er ist. Gehen wir ihn zusammen durch.","en":"That happens to many people. A lab report looks more dramatic than it is. Let's go through it together.","ur":"Yeh bohat logon ke saath hota hai. Lab report asli se zyada khatarnak lagti hai. Aayein sath dekhte hain."},{"s":"B","de":"Bei einigen Werten stand ein Pfeil nach oben. Ist das schlimm?","en":"Next to some values there was an arrow pointing up. Is that bad?","ur":"Kuch values ke saath upar wala teer tha. Kya yeh bura hai?"},{"s":"A","de":"Nicht automatisch. Leicht erhöhte Werte können harmlos sein, gerade wenn man vorher gegessen hat oder gestresst war.","en":"Not automatically. Slightly elevated values can be harmless, especially if you ate beforehand or were stressed.","ur":"Zaroori nahi. Thori barhi values be-zarar ho sakti hain, khaas kar agar pehle khaya ho ya stress ho."},{"s":"B","de":"Der einzige Wert, der mir Sorgen macht, ist das Eisen. Es war deutlich zu niedrig.","en":"The only value that worries me is the iron. It was clearly too low.","ur":"Sirf jo value mujhe pareshan karti hai woh loha hai. Woh saaf tor par kam tha."},{"s":"A","de":"Da haben Sie richtig gelesen. Das erklärt Ihre Müdigkeit gut und ist gleichzeitig gut behandelbar.","en":"You read that correctly. It explains your tiredness well and is at the same time easily treatable.","ur":"Aap ne theek parha. Yeh aap ki thakan ki achi wajah hai aur saath hi aasaani se ilaaj hota hai."},{"s":"B","de":"Sollten wir nicht herausfinden, warum ich zu wenig Eisen habe?","en":"Shouldn't we find out why I have too little iron?","ur":"Kya humein maloom nahi karna chahiye ke mera loha kam kyun hai?"},{"s":"A","de":"Sehr gute Frage. Bei Frauen ist die Regelblutung eine häufige Ursache, aber wir sollten auch die Ernährung anschauen.","en":"Very good question. In women, menstruation is a common cause, but we should also look at diet.","ur":"Bohat acha sawal. Auraton mein maahwari aam wajah hai, lekin khane par bhi nazar dalni chahiye."},{"s":"B","de":"Ich esse tatsächlich selten Fleisch. Reicht es, wenn ich meine Ernährung umstelle?","en":"I actually rarely eat meat. Is it enough if I change my diet?","ur":"Main waqai kam gosht khati hoon. Kya sirf khana badalna kaafi hoga?"},{"s":"A","de":"Ernährung allein füllt einen echten Mangel nur langsam auf. Deshalb kombinieren wir das mit Tabletten für einige Monate.","en":"Diet alone fills a real deficiency only slowly. That's why we combine it with tablets for a few months.","ur":"Sirf khana asli kami ko dheere bharta hai. Isi liye hum kuch mahine goliyon ke saath milate hain."},{"s":"B","de":"Und wenn die Kontrolle nach drei Monaten noch schlecht ist?","en":"And if the check after three months is still bad?","ur":"Aur agar teen mahine baad check phir bhi kharab ho?"},{"s":"A","de":"Dann suchen wir gezielter nach einer Ursache, zum Beispiel im Magen-Darm-Bereich. Aber das ist selten nötig.","en":"Then we'll look more specifically for a cause, for example in the gastrointestinal area. But that's rarely necessary.","ur":"To hum zyada khaas tor par wajah dhoondenge, jaise pait-aanton mein. Lekin yeh kam hi zaroori hota hai."},{"s":"B","de":"Das klingt nach einem vernünftigen Plan.","en":"That sounds like a sensible plan.","ur":"Yeh munasib mansooba lagta hai."},{"s":"A","de":"Wichtig ist, dass Sie die Tabletten wirklich durchnehmen, auch wenn es Ihnen schon besser geht.","en":"It's important that you really finish the tablets, even when you already feel better.","ur":"Ahem yeh hai ke aap goliyan poori lein, chahe pehle hi behtar mehsoos karein."},{"s":"B","de":"Das verspreche ich. Danke, dass Sie sich die Zeit genommen haben, alles zu erklären.","en":"I promise. Thank you for taking the time to explain everything.","ur":"Main wada karti hoon. Sab samjhane ke liye waqt dene ka shukriya."},{"s":"A","de":"Dafür bin ich da. Ich trage Ihnen den Kontrolltermin gleich in drei Monaten ein.","en":"That's what I'm here for. I'll book your check-up appointment for three months from now right away.","ur":"Main isi liye hoon. Main abhi teen mahine baad ka check appointment likh deta hoon."}]},"B2":{"speakers":{"A":"Doktor Schulz","B":"Frau Yilmaz (Patientin)"},"right":"B","lines":[{"s":"A","de":"Bevor wir zum Ergebnis kommen: Möchten Sie zuerst die Zahlen im Detail oder lieber die Einordnung und was daraus folgt?","en":"Before we get to the result: would you first like the numbers in detail, or rather the interpretation and what follows from it?","ur":"Nateeje se pehle: aap pehle tafseeli numbers chahengi ya us ki tashreeh aur us ka natija?"},{"s":"B","de":"Die Einordnung, bitte. Zahlen ohne Kontext verunsichern mich nur.","en":"The interpretation, please. Numbers without context just unsettle me.","ur":"Tashreeh, please. Bina context ke numbers mujhe sirf pareshan karte hain."},{"s":"A","de":"Vernünftig. Kurz gesagt: Ihre Erschöpfung hat eine klare, behandelbare Ursache, nämlich einen ausgeprägten Eisenmangel.","en":"Sensible. In short: your exhaustion has a clear, treatable cause, namely a pronounced iron deficiency.","ur":"Munasib. Mukhtasaran: aap ki thakan ki ek saaf, qabil-e-ilaaj wajah hai, yani numaya iron ki kami."},{"s":"B","de":"Ist das der einzige auffällige Wert, oder beschönigen Sie gerade etwas?","en":"Is that the only abnormal value, or are you glossing over something right now?","ur":"Kya sirf yehi ghair mamooli value hai, ya aap kuch chhupa rahe hain?"},{"s":"A","de":"Berechtigte Nachfrage. Nein, ich beschönige nichts. Zwei Leberwerte sind minimal erhöht, aber im Rahmen, den man bei Stress und wenig Schlaf oft sieht.","en":"A fair follow-up. No, I'm not glossing over anything. Two liver values are minimally elevated, but within the range one often sees with stress and little sleep.","ur":"Jaiz sawal. Nahi, main kuch nahi chhupa raha. Do jigar ki values thori barhi hain, lekin us hadd mein jo stress aur kam neend mein aksar dikhti hai."},{"s":"B","de":"Sollten die Leberwerte nicht kontrolliert werden, bevor wir sie als harmlos abtun?","en":"Shouldn't the liver values be monitored before we dismiss them as harmless?","ur":"Kya jigar ki values ko harmless kehne se pehle check nahi karna chahiye?"},{"s":"A","de":"Doch, genau das schlage ich vor. Wir kontrollieren sie bei der Eisenkontrolle in drei Monaten gleich mit.","en":"Yes, that's exactly what I'm proposing. We'll check them together with the iron follow-up in three months.","ur":"Ji haan, main yehi tajweez kar raha hoon. Teen mahine baad iron ke check ke saath yeh bhi dekh lenge."},{"s":"B","de":"Gut. Zur Therapie: Ich habe gelesen, dass Eisentabletten oft schlecht vertragen werden und viele sie abbrechen.","en":"Good. On the treatment: I've read that iron tablets are often poorly tolerated and many people stop them.","ur":"Acha. Ilaaj ke baare mein: main ne parha ke iron ki goliyan aksar nahi lagtin aur log chhor dete hain."},{"s":"A","de":"Das stimmt, und deshalb reden wir vorher darüber. Wir starten niedrig dosiert, und Sie müssen sie nicht täglich nehmen, jeden zweiten Tag reicht oft.","en":"That's true, which is why we talk about it beforehand. We start at a low dose, and you don't have to take them daily; every other day is often enough.","ur":"Yeh sahi hai, isi liye pehle baat karte hain. Hum kam khurak se shuru karte hain, aur rozana zaroori nahi; har doosre din aksar kaafi hai."},{"s":"B","de":"Das widerspricht dem, was ich sonst gehört habe. Warum jeden zweiten Tag?","en":"That contradicts what I've heard elsewhere. Why every other day?","ur":"Yeh us se ulta hai jo main ne suna. Har doosre din kyun?"},{"s":"A","de":"Neuere Studien zeigen, dass der Darm Eisen mit Pause sogar besser aufnimmt und die Nebenwirkungen geringer sind. Belegte Erkenntnis, keine Meinung.","en":"Newer studies show that the gut actually absorbs iron better with a break and the side effects are lower. Evidence-based, not opinion.","ur":"Nayi tehqeeq batati hai ke waqfe ke saath aantein loha behtar jazb karti hain aur side effects kam hote hain. Saabit baat hai, raye nahi."},{"s":"B","de":"Das überzeugt mich. Woran merke ich selbst, ob die Behandlung wirkt, ohne auf die Kontrolle zu warten?","en":"That convinces me. How do I notice myself whether the treatment is working, without waiting for the check?","ur":"Yeh mujhe qail karta hai. Main khud kaise pata karoon ke ilaaj asar kar raha hai, check ka intezaar kiye baghair?"},{"s":"A","de":"Meist lässt die Müdigkeit nach zwei bis vier Wochen spürbar nach. Bleibt sie unverändert, melden Sie sich früher, dann denken wir um.","en":"Usually the tiredness eases noticeably after two to four weeks. If it stays unchanged, get in touch earlier, then we'll rethink.","ur":"Aam tor par thakan do se chaar hafton mein mehsoos hone layak kam ho jati hai. Agar wohi rahe to jaldi rabta karein, phir naye sire se sochenge."},{"s":"B","de":"Das ist ein klarer, ehrlicher Plan. So kann ich mitentscheiden, statt nur Anweisungen zu befolgen.","en":"That's a clear, honest plan. This way I can help decide, instead of just following instructions.","ur":"Yeh saaf, sacha mansooba hai. Yun main faislay mein shareek ho sakti hoon, sirf hukm mankar nahi."},{"s":"A","de":"Genau so soll es sein. Ich fasse alles kurz für Sie zusammen und drucke Ihnen die wichtigsten Punkte aus.","en":"That's exactly how it should be. I'll summarize everything briefly for you and print out the key points.","ur":"Aise hi hona chahiye. Main sab mukhtasar likh deta hoon aur ahem baatein print kar deta hoon."}]}},"roleplay":{"easy":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Der Arzt bespricht Ihre Blutwerte mit Ihnen. Sie haben Eisenmangel.","en":"The doctor discusses your blood results with you. You have iron deficiency.","ur":"Doctor aap ke khoon ke nateeje batata hai. Aap ko iron ki kami hai."},"start":"n1","nodes":{"n1":{"say":"Ihre Blutwerte sind da. Fast alles ist normal.","goal":{"en":"Ask what isn't normal.","ur":"Poochein ke kya normal nahi."},"options":["Und was ist nicht normal?","Was ist nicht in Ordnung?"],"fallback":"Haben Sie eine Frage dazu?","accept":[{"kw":["nicht","normal"],"next":"n2"},{"kw":["ordnung"],"next":"n2"}]},"n2":{"say":"Ihr Eisenwert ist zu niedrig. Sie haben Eisenmangel.","goal":{"en":"Ask if that's the reason for the tiredness.","ur":"Poochein ke kya thakan ki wajah yehi hai."},"options":["Ist das der Grund für die Müdigkeit?","Kommt die Müdigkeit davon?"],"fallback":"Möchten Sie mehr wissen?","accept":[{"kw":["müdigkeit"],"next":"n3"},{"kw":["grund"],"next":"n3"}]},"n3":{"say":"Sehr wahrscheinlich, ja.","goal":{"en":"Ask what you can do.","ur":"Poochein ke aap kya kar sakti hain."},"options":["Was kann ich tun?","Was soll ich jetzt machen?"],"fallback":"Haben Sie eine Frage?","accept":[{"kw":["tun"],"next":"n4"},{"kw":["machen"],"next":"n4"}]},"n4":{"say":"Sie nehmen drei Monate lang Eisentabletten, eine am Morgen.","goal":{"en":"Ask what happens after that.","ur":"Poochein ke us ke baad kya."},"options":["Und dann?","Und was passiert danach?"],"fallback":"Noch eine Frage?","accept":[{"kw":["dann"],"next":"n5"},{"kw":["danach"],"next":"n5"}]},"n5":{"say":"Nach drei Monaten machen wir eine Kontrolle.","goal":{"en":"Thank the doctor.","ur":"Doctor ka shukriya karein."},"options":["Gut. Vielen Dank, Herr Doktor.","Danke schön, Herr Doktor."],"fallback":"Alles klar so weit?","accept":[{"kw":["danke"],"reply":"Gern. Es wird Ihnen bald besser gehen!","next":"END"},{"kw":["dank"],"reply":"Gern. Gute Besserung!","next":"END"}]}}},"hard":{"role":"Doktor Schulz","you":"Patient / Patientin","scene":{"de":"Sie besprechen den Laborbefund. Sie haben ihn selbst gelesen und stellen kritische Fragen zu Werten und Therapie.","en":"You discuss the lab findings. You've read them yourself and ask critical questions about values and treatment.","ur":"Aap lab report par baat karte hain. Aap ne khud parhi hai aur values aur ilaaj par sawal karte hain."},"start":"n1","nodes":{"n1":{"say":"Ich habe den Befund vom Labor. Möchten Sie die Zahlen im Detail oder die Einordnung?","goal":{"en":"Say the interpretation — numbers without context just unsettle you.","ur":"Kahein: tashreeh — bina context ke numbers pareshan karte hain."},"options":["Die Einordnung, bitte. Zahlen ohne Kontext verunsichern mich.","Lieber die Einordnung, die Zahlen allein sagen mir wenig."],"fallback":"Was möchten Sie zuerst?","accept":[{"kw":["einordnung"],"next":"n2"},{"kw":["kontext"],"next":"n2"}]},"n2":{"say":"Kurz gesagt: Ihre Erschöpfung hat eine klare, behandelbare Ursache, einen ausgeprägten Eisenmangel.","goal":{"en":"Ask if that's the only abnormal value or if he's glossing over something.","ur":"Poochein ke kya sirf yehi ghair mamooli value hai ya kuch chhupa rahe hain."},"options":["Ist das der einzige auffällige Wert, oder beschönigen Sie etwas?","Ist das wirklich der einzige auffällige Wert?"],"fallback":"Haben Sie eine Rückfrage?","accept":[{"kw":["einzige","auffällige"],"next":"n3"},{"kw":["beschönigen"],"next":"n3"},{"kw":["auffällige"],"next":"n3"}]},"n3":{"say":"Ich beschönige nichts. Zwei Leberwerte sind minimal erhöht, aber im Rahmen, den man bei Stress oft sieht.","goal":{"en":"Ask whether the liver values shouldn't be monitored before dismissing them.","ur":"Poochein ke kya jigar ki values ko harmless kehne se pehle check nahi karna chahiye."},"options":["Sollten die Leberwerte nicht kontrolliert werden, bevor wir sie als harmlos abtun?","Müssen die Leberwerte nicht kontrolliert werden?"],"fallback":"Wie sehen Sie das?","accept":[{"kw":["leberwerte","kontrolliert"],"next":"n4"},{"kw":["kontrolliert"],"next":"n4"},{"kw":["leberwerte"],"next":"n4"}]},"n4":{"say":"Genau das schlage ich vor: Wir kontrollieren sie in drei Monaten mit. Zur Therapie starten wir Eisen niedrig dosiert, jeden zweiten Tag.","goal":{"en":"Ask why every other day, since you've heard otherwise.","ur":"Poochein ke har doosre din kyun, jab ke aap ne ulta suna."},"options":["Warum jeden zweiten Tag? Das widerspricht dem, was ich gehört habe.","Warum nur jeden zweiten Tag?"],"fallback":"Haben Sie eine Frage zur Einnahme?","accept":[{"kw":["jeden","zweiten"],"next":"n5"},{"kw":["warum"],"next":"n5"},{"kw":["widerspricht"],"next":"n5"}]},"n5":{"say":"Neuere Studien zeigen: mit Pause nimmt der Darm Eisen besser auf und die Nebenwirkungen sind geringer.","goal":{"en":"Ask how you'll notice yourself whether it's working, without waiting for the check.","ur":"Poochein ke check ke baghair khud kaise pata chale ke asar ho raha hai."},"options":["Woran merke ich selbst, ob es wirkt, ohne auf die Kontrolle zu warten?","Wie merke ich, ob die Behandlung wirkt?"],"fallback":"Noch eine Frage?","accept":[{"kw":["merke","wirkt"],"next":"n6"},{"kw":["wirkt"],"next":"n6"},{"kw":["merke"],"next":"n6"}]},"n6":{"say":"Meist lässt die Müdigkeit nach zwei bis vier Wochen nach. Bleibt sie, melden Sie sich früher, dann denken wir um.","goal":{"en":"Say it's a clear, honest plan and thank him.","ur":"Kahein yeh saaf, sacha mansooba hai aur shukriya."},"options":["Das ist ein klarer, ehrlicher Plan. Vielen Dank.","Danke, das ist ein klarer Plan."],"fallback":"Sind Sie einverstanden?","accept":[{"kw":["danke","plan"],"reply":"Genau so soll es sein. Ich drucke Ihnen die wichtigsten Punkte aus.","next":"END"},{"kw":["danke"],"reply":"Gern. Ich drucke Ihnen die Punkte aus.","next":"END"}]}}}}}]}]}]};</script>
<script>/* Deutsch Alltag — app engine. No network calls, no dependencies. */
(function () {
'use strict';

var D = window.__DATA__ || { topics: [], dictionary: {}, forms: {} };
var DICT = D.dictionary, FORMS = D.forms, TOPICS = D.topics;
var LEVELS = ['A1', 'A2', 'B1', 'B2'];
var LVNAME = { A1: 'Anfänger', A2: 'Grundlage', B1: 'Mittel', B2: 'Fortgeschr.' };

/* ---------------- storage ---------------- */
function ls(k, d) { try { var v = localStorage.getItem('dg.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function ss(k, v) { try { localStorage.setItem('dg.' + k, JSON.stringify(v)); } catch (e) {} }

var S = Object.assign({ level: 'A1', en: true, ur: true, theme: 'auto', rate: 1.0, mic: true, voice: '', aiUrl: '', aiKey: '', aiVoice: true }, ls('set', {}));
var SAVED = ls('saved', {});     // { wordKey: {t:timestamp, box:0} }
var PROG = ls('prog', {});       // { read:{'top/sub/lvl':1}, test:{topicId:pct}, rp:{'top/sub':1} }
if (!PROG.read) PROG.read = {}; if (!PROG.test) PROG.test = {}; if (!PROG.rp) PROG.rp = {};

function saveSet() { ss('set', S); applyTheme(); }
function saveProg() { ss('prog', PROG); }
function saveWords() { ss('saved', SAVED); }

/* "auto" leaves data-theme off entirely, so the CSS media query decides and any host
   page that stamps data-theme keeps control. An explicit choice sets the attribute. */
function applyTheme() {
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', S.theme);
}
applyTheme();

/* ---------------- utils ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) {
  return String(s).toLowerCase().replace(/[^a-zäöüß'’\-]/g, '');
}
function plain(s) {
  return String(s).toLowerCase()
    .replace(/[.,!?;:„“"'’\-–—()]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (a === b) return 0;
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  if (!m) return n; if (!n) return m;
  for (j = 0; j <= n; j++) prev[j] = j;
  for (i = 1; i <= m; i++) {
    cur[0] = i;
    for (j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur.slice();
  }
  return prev[n];
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function topicById(id) { for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].id === id) return TOPICS[i]; return null; }
function subById(t, id) { if (!t) return null; var a = t.subtopics || []; for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function subsubById(s, id) { if (!s) return null; var a = s.subs || []; for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }

/* ---------------- speech ---------------- */
var VOICE = null, VOICES = [];
function voiceId(v) { return v.voiceURI || v.name; }
/* Higher = more natural. The good voices are the cloud/"enhanced" ones — the plain
   offline default is the robotic one, so it must NOT win by default. */
function rankVoice(v) {
  var n = (v.name || '').toLowerCase(), s = 0;
  if ((v.lang || '').toLowerCase() === 'de-de') s += 2; else s += 1;
  if (n.indexOf('google') > -1) s += 4;
  if (/enhanced|premium|neural|natural|siri/.test(n)) s += 4;
  if (!v.localService) s += 1;
  if (/compact|espeak|pico|eloquence/.test(n)) s -= 4;
  return s;
}
function loadVoices() {
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices() || [];
  VOICES = vs.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('de') === 0; })
    .sort(function (a, b) { return rankVoice(b) - rankVoice(a); });
  pickVoice();
  // voices load asynchronously — if Settings is already open, refresh the list
  if ((location.hash || '') === '#/set' && typeof vSet === 'function') vSet();
}
function pickVoice() {
  VOICE = null;
  if (S.voice) for (var i = 0; i < VOICES.length; i++) if (voiceId(VOICES[i]) === S.voice) { VOICE = VOICES[i]; break; }
  if (!VOICE && VOICES.length) VOICE = VOICES[0];
}
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function sampleVoice(id) {
  if (!window.speechSynthesis) return;
  var v = null;
  for (var i = 0; i < VOICES.length; i++) if (voiceId(VOICES[i]) === id) { v = VOICES[i]; break; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance('Guten Tag! Ich helfe dir, Deutsch zu lernen.');
    u.lang = 'de-DE'; u.rate = Number(S.rate) || 0.9; if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function say(text, cb) {
  if (!window.speechSynthesis) { if (cb) cb(); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'de-DE'; u.rate = Number(S.rate) || 0.85;
    if (VOICE) u.voice = VOICE;
    if (cb) { u.onend = cb; u.onerror = cb; }
    speechSynthesis.speak(u);
  } catch (e) { if (cb) cb(); }
}
function hasMic() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

/* ---------------- AI backend (optional, free Cloudflare Worker) ---------------- */
function aiConfigured() { return !!(S.aiUrl && S.aiKey); }
function aiFetch(path, body) {
  return fetch(S.aiUrl.replace(/\/+$/, '') + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Pass': S.aiKey },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    });
  });
}
function aiChat(system, history) { return aiFetch('/chat', { system: system, history: history }).then(function (d) { return d.reply || ''; }); }
/* ---- natural voice with a permanent local cache ----
   Each unique German line is generated by the AI once, stored in IndexedDB, and
   replayed from there forever — free, instant, and works offline after the first play. */
var TTSDB = null;
function ttsDbOpen() {
  return new Promise(function (res) {
    if (TTSDB) return res(TTSDB);
    var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
    try {
      var rq = indexedDB.open('dg-tts', 1);
      rq.onupgradeneeded = function () { rq.result.createObjectStore('audio'); };
      rq.onsuccess = function () { TTSDB = rq.result; fin(TTSDB); };
      rq.onerror = function () { fin(null); };
      rq.onblocked = function () { fin(null); };
      setTimeout(function () { fin(null); }, 1500); // never let a stuck open freeze speech
    } catch (e) { fin(null); }
  });
}
function ttsGet(key) {
  return ttsDbOpen().then(function (db) {
    if (!db) return null;
    return new Promise(function (res) {
      try { var r = db.transaction('audio', 'readonly').objectStore('audio').get(key); r.onsuccess = function () { res(r.result || null); }; r.onerror = function () { res(null); }; }
      catch (e) { res(null); }
    });
  });
}
function ttsPut(key, val) { return ttsDbOpen().then(function (db) { if (db) try { db.transaction('audio', 'readwrite').objectStore('audio').put(val, key); } catch (e) {} }); }
function ttsClear() { return ttsDbOpen().then(function (db) { if (db) try { db.transaction('audio', 'readwrite').objectStore('audio').clear(); } catch (e) {} }); }
// bump the version to abandon clips cached before per-character voices existed
function ttsKey(text, voice) { return 'v4|' + (voice || '') + '|' + String(text).trim(); }

// Pick a voice from WHO the character is (not the A/B slot), so genders are right
// and two same-gender speakers still get different voices.
var VOICE_MOTHER = 'Kore';   // the parent (Frau Khan) — female
var VOICE_FEMPRO = 'Aoede';  // a female professional (receptionist, pharmacist) — distinct female
var VOICE_MALE   = 'Puck';   // a male professional (doctor, pharmacist)
function characterVoice(label) {
  var n = String(label || '').toLowerCase();
